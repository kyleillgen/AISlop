<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flow Pocket</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #140f0c; }
  body { display: flex; flex-direction: column; }
  /* The title strip: a dark cabinet rail. Window controls are quiet glass; the game picker is
     one segmented control with the playing game lit cream */
  .strip { display: flex; flex-direction: column; gap: 6px; padding: 6px 7px 7px; background: linear-gradient(#1f1814, #130e0b); box-shadow: 0 1px 0 rgba(246,230,192,.07), 0 6px 16px rgba(0,0,0,.45); position: relative; z-index: 2; cursor: grab; user-select: none; }
  .row { display: flex; align-items: center; gap: 4px; min-width: 0; }
  .grow { flex: 1; min-width: 0; }
  .strip .pb-btn { flex: none; height: 22px; padding: 0 8px !important; font: 500 10px/22px Oswald, Impact, sans-serif !important; letter-spacing: .1em; color: #f6e6c0 !important; background: rgba(246,230,192,.07) !important; box-shadow: 0 0 0 1px rgba(246,230,192,.07) inset; border-radius: 7px !important; }
  .strip .pb-btn:hover { background: rgba(246,230,192,.14) !important; transform: none; }
  .strip .pb-btn.on { color: #ffc400 !important; background: rgba(255,196,0,.12) !important; box-shadow: 0 0 0 1px rgba(255,196,0,.25) inset; }
  .strip .pb-btn.win { display: grid; place-items: center; width: 24px; padding: 0 !important; }
  .strip .pb-btn.win svg { width: 10px; height: 10px; }
  .strip #closeBtn:hover { background: #e8231f !important; color: #fff !important; box-shadow: none; }
  .seg { display: flex; gap: 2px; padding: 2px; border-radius: 9px; background: rgba(0,0,0,.4); box-shadow: 0 1px 2px rgba(0,0,0,.5) inset, 0 0 0 1px rgba(246,230,192,.05); }
  .seg .pb-btn { background: transparent !important; box-shadow: none; color: rgba(246,230,192,.62) !important; padding: 0 10px !important; }
  .seg .pb-btn:hover { color: #f6e6c0 !important; background: rgba(246,230,192,.06) !important; }
  .seg .pb-btn.on { color: #140f0c !important; background: linear-gradient(#fbf1da, #f0dcae) !important; box-shadow: 0 1px 3px rgba(0,0,0,.45); font-weight: 600 !important; }
  .fps { font: 500 9px Oswald, Impact, sans-serif; letter-spacing: .1em; text-transform: uppercase; color: rgba(246,230,192,.32); min-width: 30px; text-align: right; }
  .lamp { display: flex; align-items: center; gap: 6px; flex: 0 1 auto; padding-left: 2px; font: 500 10px Oswald, Impact, sans-serif; letter-spacing: .12em; text-transform: uppercase; color: rgba(246,230,192,.8); white-space: nowrap; min-width: 0; }
  .lamp i { flex: none; width: 8px; height: 8px; border-radius: 50%; background: #3a2a20; box-shadow: 0 1px 1px rgba(0,0,0,.5) inset; }
  .lamp.working i { background: radial-gradient(circle at 35% 35%, #fff3c4, #ffc400 60%); box-shadow: 0 0 6px rgba(255,196,0,.6); }
  .lamp.done i { background: radial-gradient(circle at 35% 35%, #d8ffe4, #1fbf55 60%); box-shadow: 0 0 6px rgba(31,191,85,.6); animation: blink 0.5s steps(1) 8; }
  .lamp.needs i { background: radial-gradient(circle at 35% 35%, #ffd2c4, #e8231f 60%); box-shadow: 0 0 6px rgba(232,35,31,.6); animation: blink 0.5s steps(1) 8; }
  @keyframes blink { 50% { background: #3a2a20; box-shadow: none; } }
  .lamp span { overflow: hidden; text-overflow: ellipsis; }
  iframe { flex: 1; width: 100%; border: 0; display: block; background: #140f0c; }
</style>
</head>
<body>
  <div class="strip" id="strip" title="Drag to move">
    <!-- Two rows so a narrow dock never pushes the window buttons out of sight: the title-bar
         row (Claude's lamp, dock, pin, minimise, close), then the game picker -->
    <div class="row">
      <span class="lamp" id="lamp" title="What Claude is doing (needs the hook in pocket/README.md)"><i></i><span id="lampText">idle</span></span>
      <span class="grow"></span>
      <button class="pb-btn" id="dock" title="Dock: right edge, corner or mini">Side</button>
      <button class="pb-btn" id="pin" title="Keep this window on top">Pin</button>
      <button class="pb-btn win" id="minBtn" title="Minimise" aria-label="Minimise"><svg viewBox="0 0 10 10"><path d="M1.5 5h7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></button>
      <button class="pb-btn win" id="closeBtn" title="Close" aria-label="Close"><svg viewBox="0 0 10 10"><path d="M2 2l6 6M8 2l-6 6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></button>
    </div>
    <div class="row">
    <div class="seg">
    <button class="pb-btn" data-game="flow-resonance.html" title="Flow // Resonance">Flow</button>
    <button class="pb-btn" data-game="orbit.html" title="Orbit: fling the ball from bumper to bumper">Orbit</button>
    <button class="pb-btn" data-game="flipper.html" title="Flipper: keep the ball up with the flippers">Flip</button>
    <button class="pb-btn" data-game="ricochet.html" title="Ricochet: kick off the walls and climb">Rico</button>
    </div>
    <span class="grow"></span>
    <span class="fps" id="fps" title="Frames per second the game is actually drawing"></span>
    </div>
  </div>
  <iframe id="game" title="Game" allow="autoplay"></iframe>

  <script src="js/neutralino.js"></script>
  <script src="games/pinball-skin.js"></script>
  <script>
    // Flow Pocket launcher: one small window, one game at a time, and a lamp that follows
    // Claude Code through pocket/signal.mjs. When Claude finishes (or needs you), the game gets
    // the engine's build-done message: it goes to autopilot, winds the music down and chimes.
    PinballSkin.install({ vignette: false });
    Neutralino.init();
    Neutralino.events.on("windowClose", () => Neutralino.app.exit());

    const frame = document.getElementById("game");
    const store = (k, v) => {
      try {
        if (v === undefined) return localStorage.getItem(k);
        localStorage.setItem(k, v);
      } catch (e) {}
    };

    function open(game) {
      store("pocket.game", game);
      frame.src = "games/" + game + "?pocket=1";
      document.querySelectorAll("[data-game]").forEach((b) => b.classList.toggle("on", b.dataset.game === game));
    }
    document.querySelectorAll("[data-game]").forEach((b, i) => {
      b.addEventListener("click", () => open(b.dataset.game));
      b.title += ` (${i + 1})`;
    });
    // Number keys pick a game: 1 Flow, 2 Orbit, 3 Flip, 4 Rico. The game in the frame has the
    // keyboard, so it passes digits up (flow:game); the strip handles them itself when focused.
    function openNth(n) {
      const b = document.querySelectorAll("[data-game]")[n - 1];
      if (b) open(b.dataset.game);
    }
    window.addEventListener("message", (e) => e.data && e.data.type === "flow:game" && openNth(e.data.n));
    window.addEventListener("keydown", (e) => /^[1-9]$/.test(e.key) && openNth(+e.key));
    frame.addEventListener("load", () => frame.contentWindow.focus());
    // A saved game that's since been retired (Leap, Rollover) falls back to Flow
    const saved = store("pocket.game");
    open(document.querySelector(`[data-game="${saved}"]`) ? saved : "flow-resonance.html");

    // Pinned (always on top) by default: the pocket is meant to sit over whatever you're working
    // in. Windows can drop a window's topmost flag (after minimising, or when another app raises
    // itself), so while pinned it's re-asserted every few seconds; the call is cheap.
    let pinned = store("pocket.pinned") !== "0";
    const pinBtn = document.getElementById("pin");
    function setPinned(on) {
      pinned = on;
      store("pocket.pinned", on ? "1" : "0");
      pinBtn.classList.toggle("on", on);
      Neutralino.window.setAlwaysOnTop(on).catch(() => {});
    }
    pinBtn.addEventListener("click", () => {
      setPinned(!pinned);
      frame.contentWindow.focus();
    });
    Neutralino.events.on("ready", () => setPinned(pinned));
    setInterval(() => pinned && Neutralino.window.setAlwaysOnTop(true).catch(() => {}), 4000);

    // Borderless window: the strip is the title bar. Dragging starts on press, so the
    // buttons and the lamp are carved out of the drag area or their clicks would be eaten.
    Neutralino.events.on("ready", () => {
      const strip = document.getElementById("strip");
      const exclude = [...strip.querySelectorAll("button, .lamp")];
      Neutralino.window.setDraggableRegion(strip, { exclude }).catch(() => {});
    });
    document.getElementById("minBtn").addEventListener("click", () => Neutralino.window.minimize().catch(() => {}));
    document.getElementById("closeBtn").addEventListener("click", () => Neutralino.app.exit());

    // ---- Docking -------------------------------------------------------------------------
    // Claude Code games live right above the prompt, where your eyes already are. A separate
    // window can't go there without covering it, so it docks into the margin beside Claude's
    // centred chat column instead: a full-height column on the right edge (side), the bottom-
    // right corner, or a small mini. Wherever you drag or resize it afterwards is remembered.
    const DOCKS = ["side", "corner", "mini"];
    const dockBtn = document.getElementById("dock");
    let dock = store("pocket.dock") || "side";
    let lastBox = null;

    // The screen's work area (excluding the taskbar), in physical pixels
    function workArea() {
      const dpr = window.devicePixelRatio || 1;
      return {
        x: Math.round((screen.availLeft || 0) * dpr),
        y: Math.round((screen.availTop || 0) * dpr),
        w: Math.round(screen.availWidth * dpr),
        h: Math.round(screen.availHeight * dpr),
        dpr
      };
    }
    function dockBox(name) {
      const a = workArea();
      const px = (n) => Math.round(n * a.dpr);
      if (name === "side") return { x: a.x + a.w - px(380), y: a.y, w: px(380), h: a.h };
      if (name === "mini") return { x: a.x + a.w - px(320) - px(12), y: a.y + a.h - px(380) - px(12), w: px(320), h: px(380) };
      return { x: a.x + a.w - px(420) - px(12), y: a.y + a.h - px(600) - px(12), w: px(420), h: px(600) };
    }
    async function applyBox(b) {
      await Neutralino.window.setSize({ width: b.w, height: b.h });
      await Neutralino.window.move(b.x, b.y);
      lastBox = b;
    }
    async function setDock(name, keepSaved) {
      dock = name;
      store("pocket.dock", name);
      dockBtn.textContent = name;
      const saved = keepSaved && JSON.parse(store("pocket.box." + name) || "null");
      await applyBox(saved || dockBox(name)).catch(() => {});
    }
    dockBtn.addEventListener("click", () => {
      setDock(DOCKS[(DOCKS.indexOf(dock) + 1) % DOCKS.length], false);
      frame.contentWindow.focus();
    });
    // Remember where you've dragged or resized it (per dock), checked every few seconds
    setInterval(async () => {
      try {
        const [pos, size] = await Promise.all([Neutralino.window.getPosition(), Neutralino.window.getSize()]);
        const b = { x: pos.x, y: pos.y, w: size.width, h: size.height };
        if (lastBox && (b.x !== lastBox.x || b.y !== lastBox.y || b.w !== lastBox.w || b.h !== lastBox.h)) {
          lastBox = b;
          store("pocket.box." + dock, JSON.stringify(b));
        }
      } catch (e) {}
    }, 3000);
    Neutralino.events.on("ready", () => setDock(dock, true));

    // When Claude starts a task, bring the pocket back if it was minimised, without taking
    // the keyboard (like the Claude Code games that open themselves when Claude starts working)
    async function surface() {
      try {
        if (await Neutralino.window.isMinimized()) await Neutralino.window.unminimize();
        if (pinned) await Neutralino.window.setAlwaysOnTop(true);
      } catch (e) {}
    }

    // The game reports its real frame rate every 2 s
    // Each report is also appended to ~/.flow-pocket/perf.log with the GPU WebView2 is drawing
    // with, so frame-rate problems can be diagnosed from outside the window
    let gpu = "unknown";
    try {
      const gl = document.createElement("canvas").getContext("webgl");
      const ext = gl && gl.getExtension("WEBGL_debug_renderer_info");
      gpu = ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : gl ? gl.getParameter(gl.RENDERER) : "no webgl";
    } catch (e) {}
    // Each game's session numbers are appended to ~/.flow-pocket/sessions.log for tuning
    // (node pocket/report.mjs summarises them)
    window.addEventListener("message", async (e) => {
      if (!e.data || e.data.type !== "flow:session" || !e.data.session) return;
      try {
        const home = await Neutralino.os.getEnv("USERPROFILE");
        const line = JSON.stringify(Object.assign({ loggedAt: new Date().toISOString() }, e.data.session));
        await Neutralino.filesystem.appendFile(home + "/.flow-pocket/sessions.log", line + "\n");
      } catch (err) {}
    });
    window.addEventListener("message", async (e) => {
      if (!e.data || e.data.type !== "flow:fps") return;
      document.getElementById("fps").textContent = e.data.fps + " FPS";
      try {
        const home = await Neutralino.os.getEnv("USERPROFILE");
        const line = JSON.stringify({ t: new Date().toISOString(), game: store("pocket.game"), fps: e.data.fps, workMs: e.data.workMs, canvas: e.data.canvas, dpr: devicePixelRatio, view: innerWidth + "x" + innerHeight, gpu, args: navigator.userAgent.slice(-40) });
        await Neutralino.filesystem.appendFile(home + "/.flow-pocket/perf.log", line + "\n");
      } catch (err) {}
    });

    // ---- Claude signal ------------------------------------------------------------------
    // pocket/signal.mjs writes "<time> <start|done|needs>" to ~/.flow-pocket/signal. Polled
    // every 1.5 s (one tiny file read; nothing else runs in the background).
    const lamp = document.getElementById("lamp");
    const lampText = document.getElementById("lampText");
    // Short labels so the strip fits a narrow dock; the tooltip has the full wording
    const LABELS = { start: "working", done: "done", needs: "needs you" };
    const TIPS = { start: "Claude is working", done: "Claude is done", needs: "Claude needs you" };
    let signalPath = null;
    let workingSince = 0;
    const clock = (ms) => {
      const sec = Math.max(0, Math.round(ms / 1000));
      return Math.floor(sec / 60) + ":" + String(sec % 60).padStart(2, "0");
    };
    setInterval(() => {
      if (workingSince) lampText.textContent = clock(Date.now() - workingSince);
    }, 1000);
    let lastSignal = null;
    async function poll() {
      try {
        if (!signalPath) signalPath = (await Neutralino.os.getEnv("USERPROFILE")) + "\\.flow-pocket\\signal";
        const text = (await Neutralino.filesystem.readFile(signalPath)).trim();
        if (text === lastSignal) return;
        const first = lastSignal === null;
        lastSignal = text;
        const kind = text.split(" ")[1];
        if (!LABELS[kind]) return;
        lamp.className = "lamp " + (kind === "start" ? "working" : kind);
        lampText.textContent = LABELS[kind];
        lamp.title = TIPS[kind];
        // While Claude works, the lamp counts the wait; when it's done, it says how long it took.
        // Knowing roughly how long you've been away makes switching back less jarring.
        const at = +text.split(" ")[0];
        if (kind === "start") workingSince = at;
        else if (workingSince && at >= workingSince) {
          lampText.textContent = LABELS[kind] + " " + clock(at - workingSince);
          workingSince = 0;
        }
        // Only react to news, not to whatever the file said when the app opened
        if (!first && kind === "start") surface();
        if (!first && kind !== "start") {
          frame.contentWindow.postMessage({ type: "flow:build-done", label: kind === "needs" ? "Claude needs you" : "Claude is done" }, "*");
        }
      } catch (e) {
        // No signal file yet: the hook isn't set up, or Claude hasn't run. Nothing to do.
      }
    }
    setInterval(poll, 1500);
    poll();

    // node pocket/setup.mjs --sync writes ~/.flow-pocket/reload after copying new games in; when
    // it changes, the pocket reloads itself (the window, its place and the chosen game stay)
    let reloadStamp = null;
    setInterval(async () => {
      try {
        const home = await Neutralino.os.getEnv("USERPROFILE");
        const stamp = (await Neutralino.filesystem.readFile(home + "/.flow-pocket/reload")).trim();
        if (reloadStamp !== null && stamp !== reloadStamp) location.reload();
        reloadStamp = stamp;
      } catch (e) {
        if (reloadStamp === null) reloadStamp = "";
      }
    }, 2000);
  </script>
</body>
</html>
