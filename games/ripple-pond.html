<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<script src="flow-layer.js" data-step="5"></script>
<script src="key-cursor.js"></script>
<title>Ripple Pond</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b2a33; touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
  "use strict";
  // Ripple Pond: leaves drift on a slow current. Tap the water to send out ripples
  // that push them; nudge each leaf onto the glowing lily before it slips over the edge.
  const cv = document.getElementById("c");
  const g = cv.getContext("2d");
  let W = 0, H = 0;
  function resize() {
    const d = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W * d; cv.height = H * d;
    g.setTransform(d, 0, 0, d, 0, 0);
  }
  window.addEventListener("resize", resize);
  resize();

  const BEST_KEY = "aislop.ripple-pond.best";
  let best = 0;
  try { best = parseInt(localStorage.getItem(BEST_KEY) || "0", 10) || 0; } catch (e) {}
  function saveBest(s) {
    if (s <= best) return;
    best = s;
    try { localStorage.setItem(BEST_KEY, String(best)); } catch (e) {}
  }

  const PUSH_R = 170, LILY_R = 44;
  let state = "ready", overAt = 0;
  let leaves, ripples, lily, spawnT, score, lives, t;

  function placeLily() {
    lily = { x: 70 + Math.random() * (W - 140), y: 140 + Math.random() * (H - 230), pulse: 0 };
  }

  function addLeaf() {
    // Leaves float in from a random edge, already inside the bank
    const side = Math.floor(Math.random() * 4);
    const x = side === 0 ? 30 : side === 1 ? W - 30 : 40 + Math.random() * (W - 80);
    const y = side === 2 ? 110 : side === 3 ? H - 30 : 120 + Math.random() * (H - 180);
    const a = Math.atan2(H / 2 - y, W / 2 - x);
    leaves.push({ x, y, vx: Math.cos(a) * 30, vy: Math.sin(a) * 30, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 2, hue: 80 + Math.random() * 50 });
  }

  function reset() {
    leaves = []; ripples = []; spawnT = 1; score = 0; lives = 5; t = 0;
    placeLily();
    addLeaf(); addLeaf();
    if (window.Flow) Flow.reset();
  }
  reset();

  function ripple(x, y) {
    ripples.push({ x, y, t: 0 });
    for (const l of leaves) {
      const dx = l.x - x, dy = l.y - y, d = Math.hypot(dx, dy);
      if (d < PUSH_R && d > 0.01) {
        const k = (1 - d / PUSH_R) * 300;
        l.vx += (dx / d) * k; l.vy += (dy / d) * k;
        l.vr += (Math.random() - 0.5) * 3;
      }
    }
  }

  function press(x, y) {
    if (state === "ready") { state = "play"; ripple(x, y); return; }
    if (state === "play") { ripple(x, y); return; }
    if (state === "over" && performance.now() - overAt > 600) { reset(); state = "ready"; }
  }
  window.addEventListener("pointerdown", (e) => { e.preventDefault(); press(e.clientX, e.clientY); }, { passive: false });
  window.addEventListener("keydown", (e) => {
    if ((e.code === "Space" || e.code === "Enter") && !e.repeat && state !== "play") { e.preventDefault(); press(W / 2, H / 2); }
  });

  function update(dt) {
    for (let i = ripples.length - 1; i >= 0; i--) { ripples[i].t += dt; if (ripples[i].t > 0.9) ripples.splice(i, 1); }
    lily.pulse += dt;
    if (state !== "play") return;
    t += dt;

    spawnT -= dt;
    const maxLeaves = Math.min(8, 2 + Math.floor(score / 4));
    if (spawnT <= 0 && leaves.length < maxLeaves) { addLeaf(); spawnT = Math.max(1.1, 2.6 - score * 0.05); }

    for (let i = leaves.length - 1; i >= 0; i--) {
      const l = leaves[i];
      // Slow swirling current that keeps leaves wandering toward the banks
      l.vx += Math.sin(l.y * 0.012 + t * 0.4) * 22 * dt;
      l.vy += Math.cos(l.x * 0.01 - t * 0.3) * 22 * dt;
      const drag = Math.exp(-1.3 * dt);
      l.vx *= drag; l.vy *= drag; l.vr *= drag;
      l.x += l.vx * dt; l.y += l.vy * dt; l.rot += l.vr * dt;

      if (Math.hypot(l.x - lily.x, l.y - lily.y) < LILY_R - 6) {
        leaves.splice(i, 1); score++;
        ripples.push({ x: lily.x, y: lily.y, t: 0, gold: true });
        if (window.Flow) { Flow.score(score); Flow.hit(lily.x, lily.y); }
        placeLily();
        continue;
      }
      if (l.x < -20 || l.x > W + 20 || l.y < 60 || l.y > H + 20) {
        leaves.splice(i, 1); lives--;
        if (window.Flow) Flow.miss();
        if (lives <= 0) { state = "over"; overAt = performance.now(); saveBest(score); return; }
      }
    }
  }

  function text(s, x, y, size, color) {
    g.font = `700 ${size}px system-ui, -apple-system, Segoe UI, sans-serif`;
    g.fillStyle = color; g.textAlign = "center";
    g.fillText(s, x, y);
  }

  function draw() {
    const bg = g.createLinearGradient(0, 0, W, H);
    bg.addColorStop(0, "#0b2a33"); bg.addColorStop(1, "#0f3b3a");
    g.fillStyle = bg; g.fillRect(0, 0, W, H);

    // Soft caustic lines
    g.strokeStyle = "rgba(160, 230, 220, 0.05)"; g.lineWidth = 2;
    for (let y = 70; y < H; y += 46) {
      g.beginPath();
      for (let x = 0; x <= W; x += 20) {
        const yy = y + Math.sin(x * 0.02 + t * 0.8 + y) * 6;
        if (x === 0) g.moveTo(x, yy); else g.lineTo(x, yy);
      }
      g.stroke();
    }

    // Lily goal
    const pr = LILY_R + Math.sin(lily.pulse * 3) * 3;
    g.fillStyle = "rgba(255, 220, 120, 0.12)";
    g.beginPath(); g.arc(lily.x, lily.y, pr + 14, 0, Math.PI * 2); g.fill();
    g.fillStyle = "#2f7d4f";
    g.beginPath(); g.arc(lily.x, lily.y, pr, 0.25, Math.PI * 2 - 0.25); g.lineTo(lily.x, lily.y); g.fill();
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * Math.PI * 2;
      g.fillStyle = "#ffd7ec";
      g.beginPath(); g.ellipse(lily.x + Math.cos(a) * 9, lily.y + Math.sin(a) * 9, 9, 4, a, 0, Math.PI * 2); g.fill();
    }
    g.fillStyle = "#ffd36e";
    g.beginPath(); g.arc(lily.x, lily.y, 5, 0, Math.PI * 2); g.fill();

    for (const r of ripples) {
      const k = r.t / 0.9;
      g.strokeStyle = r.gold ? `rgba(255, 215, 110, ${1 - k})` : `rgba(210, 250, 245, ${0.7 * (1 - k)})`;
      g.lineWidth = 2;
      for (let j = 0; j < 2; j++) {
        g.beginPath(); g.arc(r.x, r.y, Math.max(1, PUSH_R * k - j * 22), 0, Math.PI * 2); g.stroke();
      }
    }

    for (const l of leaves) {
      g.save(); g.translate(l.x, l.y); g.rotate(l.rot);
      g.fillStyle = `hsl(${l.hue}, 55%, 45%)`;
      g.beginPath(); g.ellipse(0, 0, 16, 9, 0, 0, Math.PI * 2); g.fill();
      g.strokeStyle = "rgba(255,255,255,0.35)"; g.lineWidth = 1.2;
      g.beginPath(); g.moveTo(-14, 0); g.lineTo(14, 0); g.stroke();
      g.restore();
    }

    g.fillStyle = "rgba(4, 20, 24, 0.55)"; g.fillRect(0, 0, W, 60);
    text(String(score), W / 2, 40, 28, "#ffffff");
    for (let i = 0; i < 5; i++) {
      g.fillStyle = i < lives ? "#8fd18a" : "rgba(255,255,255,0.15)";
      g.beginPath(); g.ellipse(18 + i * 18, 30, 6, 3.5, 0.5, 0, Math.PI * 2); g.fill();
    }
    g.font = "600 12px system-ui, sans-serif"; g.fillStyle = "rgba(255,255,255,0.5)"; g.textAlign = "right";
    g.fillText("BEST " + best, W - 14, 34);

    if (state === "ready") {
      text("RIPPLE POND", W / 2, H * 0.34, 32, "#d7fff4");
      text("Tap the water to push leaves with ripples", W / 2, H * 0.34 + 32, 15, "rgba(255,255,255,0.75)");
      text("Land them on the lily · don't let them drift off", W / 2, H * 0.34 + 54, 13, "rgba(255,255,255,0.55)");
    } else if (state === "over") {
      text("The pond goes still", W / 2, H * 0.42, 26, "#ffffff");
      text(score + " leaves home", W / 2, H * 0.42 + 30, 18, "#d7fff4");
      text("Tap to try again", W / 2, H * 0.42 + 56, 14, "rgba(255,255,255,0.7)");
    }
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    update(dt); draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
