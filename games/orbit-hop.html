<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<script src="flow-layer.js" data-bpm="92" data-step="10"></script>
<title>Orbit Hop</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #070a16; touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
  "use strict";
  // Orbit Hop: you circle a star. Tap to fling off on the tangent; pass close to
  // another star and its gravity catches you. Miss and you drift into the dark.
  const cv = document.getElementById("c");
  const g = cv.getContext("2d");
  let W = 0, H = 0;
  function resize() {
    const d = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W * d; cv.height = H * d;
    g.setTransform(d, 0, 0, d, 0, 0);
  }
  window.addEventListener("resize", resize);
  resize();

  const BEST_KEY = "aislop.orbit-hop.best";
  let best = 0;
  try { best = parseInt(localStorage.getItem(BEST_KEY) || "0", 10) || 0; } catch (e) {}
  function saveBest(s) {
    if (s <= best) return;
    best = s;
    try { localStorage.setItem(BEST_KEY, String(best)); } catch (e) {}
  }

  const CAPTURE = 46; // extra reach beyond a star's radius that still catches you
  let state = "ready";
  let overAt = 0;
  let nodes, p, camY, score, trail, sparks;

  function speed() { return Math.min(420, 250 + score * 5); }

  function addNode() {
    const prev = nodes[nodes.length - 1];
    const y = prev.y - (150 + Math.random() * 90);
    const reach = Math.min(220, W * 0.4);
    const x = Math.max(60, Math.min(W - 60, prev.x + (Math.random() * 2 - 1) * reach));
    nodes.push({ x, y, r: 11 + Math.random() * 10, hue: 170 + Math.random() * 140, visited: false });
  }

  function reset() {
    nodes = [{ x: W / 2, y: H * 0.68, r: 18, hue: 45, visited: true }];
    for (let i = 0; i < 8; i++) addNode();
    p = { mode: "orbit", node: nodes[0], a: -Math.PI / 2, rad: 64, dir: 1, x: 0, y: 0, vx: 0, vy: 0, flyT: 0, lastNode: null };
    camY = 0; score = 0; trail = []; sparks = [];
    if (window.Flow) Flow.reset();
  }
  reset();

  function launch() {
    if (p.mode !== "orbit") return;
    const v = speed();
    p.vx = -Math.sin(p.a) * p.dir * v;
    p.vy = Math.cos(p.a) * p.dir * v;
    p.mode = "fly"; p.flyT = 0; p.lastNode = p.node;
  }

  function burst(x, y, hue) {
    for (let i = 0; i < 18; i++) {
      const a = Math.random() * Math.PI * 2, s = 40 + Math.random() * 160;
      sparks.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1, hue });
    }
  }

  function gameOver() {
    state = "over"; overAt = performance.now();
    saveBest(score);
    if (window.Flow) Flow.miss();
  }

  function press() {
    if (state === "ready") { state = "play"; launch(); return; }
    if (state === "play") { launch(); return; }
    if (state === "over" && performance.now() - overAt > 600) { reset(); state = "ready"; }
  }
  window.addEventListener("pointerdown", (e) => { e.preventDefault(); press(); }, { passive: false });
  window.addEventListener("keydown", (e) => {
    if ((e.code === "Space" || e.code === "ArrowUp" || e.code === "Enter") && !e.repeat) { e.preventDefault(); press(); }
  });

  function update(dt) {
    for (let i = sparks.length - 1; i >= 0; i--) {
      const s = sparks[i];
      s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt * 1.6;
      if (s.life <= 0) sparks.splice(i, 1);
    }
    if (state === "over") return;

    if (p.mode === "orbit") {
      if (state === "play" || state === "ready") p.a += (p.dir * speed() / p.rad) * dt;
      p.x = p.node.x + Math.cos(p.a) * p.rad;
      p.y = p.node.y + Math.sin(p.a) * p.rad;
    } else {
      p.x += p.vx * dt; p.y += p.vy * dt; p.flyT += dt;
      for (const n of nodes) {
        if (n === p.lastNode) continue;
        const dx = p.x - n.x, dy = p.y - n.y, d = Math.hypot(dx, dy);
        if (d < n.r + CAPTURE) {
          p.mode = "orbit"; p.node = n;
          p.rad = Math.max(n.r + 16, d);
          p.a = Math.atan2(dy, dx);
          p.dir = dx * p.vy - dy * p.vx > 0 ? 1 : -1; // keep spinning the way you arrived
          if (!n.visited) {
            n.visited = true; score++; burst(n.x, n.y, n.hue);
            if (window.Flow) { Flow.score(score); Flow.hit(n.x, n.y - camY); }
          }
          break;
        }
      }
      const sy = p.y - camY;
      if (p.flyT > 3 || p.x < -40 || p.x > W + 40 || sy > H + 40 || sy < -80) gameOver();
    }

    trail.unshift({ x: p.x, y: p.y });
    if (trail.length > 22) trail.pop();

    const targetCam = p.y - H * 0.62;
    camY += (targetCam - camY) * Math.min(1, dt * 3);
    while (nodes[nodes.length - 1].y > camY - 240) addNode();
    nodes = nodes.filter((n) => n === p.node || n.y - camY < H + 120);
  }

  function text(s, x, y, size, color, align) {
    g.font = `700 ${size}px system-ui, -apple-system, Segoe UI, sans-serif`;
    g.fillStyle = color; g.textAlign = align || "center";
    g.fillText(s, x, y);
  }

  function draw() {
    const bg = g.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, "#070a16"); bg.addColorStop(1, "#14112b");
    g.fillStyle = bg; g.fillRect(0, 0, W, H);

    // Parallax dust
    g.fillStyle = "rgba(200,210,255,0.35)";
    for (let i = 0; i < 60; i++) {
      const sx = (i * 97.3) % W;
      const sy = (((i * 53.7 - camY * 0.3) % H) + H) % H;
      g.fillRect(sx, sy, 1.5, 1.5);
    }

    g.save();
    g.translate(0, -camY);

    for (const n of nodes) {
      g.strokeStyle = `hsla(${n.hue}, 80%, 70%, 0.12)`;
      g.setLineDash([4, 6]); g.lineWidth = 1;
      g.beginPath(); g.arc(n.x, n.y, n.r + CAPTURE, 0, Math.PI * 2); g.stroke();
      g.setLineDash([]);
      const glow = g.createRadialGradient(n.x, n.y, 0, n.x, n.y, n.r * 2.6);
      glow.addColorStop(0, `hsla(${n.hue}, 90%, 75%, 0.9)`);
      glow.addColorStop(1, `hsla(${n.hue}, 90%, 60%, 0)`);
      g.fillStyle = glow;
      g.beginPath(); g.arc(n.x, n.y, n.r * 2.6, 0, Math.PI * 2); g.fill();
      g.fillStyle = n.visited ? `hsl(${n.hue}, 60%, 85%)` : `hsl(${n.hue}, 85%, 65%)`;
      g.beginPath(); g.arc(n.x, n.y, n.r, 0, Math.PI * 2); g.fill();
    }

    // Aim hint: where a launch right now would send you
    if (p.mode === "orbit" && state !== "over") {
      const tx = -Math.sin(p.a) * p.dir, ty = Math.cos(p.a) * p.dir;
      g.strokeStyle = "rgba(255,255,255,0.18)"; g.lineWidth = 2;
      g.beginPath(); g.moveTo(p.x, p.y); g.lineTo(p.x + tx * 90, p.y + ty * 90); g.stroke();
    }

    for (let i = 0; i < trail.length; i++) {
      const t = trail[i];
      g.fillStyle = `rgba(255, 220, 150, ${0.5 * (1 - i / trail.length)})`;
      g.beginPath(); g.arc(t.x, t.y, 5 * (1 - i / trail.length) + 1, 0, Math.PI * 2); g.fill();
    }
    g.fillStyle = "#fff4d6";
    g.beginPath(); g.arc(p.x, p.y, 6, 0, Math.PI * 2); g.fill();

    for (const s of sparks) {
      g.fillStyle = `hsla(${s.hue}, 90%, 75%, ${s.life})`;
      g.fillRect(s.x - 1.5, s.y - 1.5, 3, 3);
    }
    g.restore();

    text(String(score), W / 2, 58, 40, "#ffffff");
    text("BEST " + best, W / 2, 84, 13, "rgba(255,255,255,0.5)");

    if (state === "ready") {
      text("ORBIT HOP", W / 2, H * 0.3, 34, "#ffe4a8");
      text("Tap / Space to fling off your orbit", W / 2, H * 0.3 + 34, 15, "rgba(255,255,255,0.75)");
      text("Pass near a star to get caught", W / 2, H * 0.3 + 56, 15, "rgba(255,255,255,0.75)");
    } else if (state === "over") {
      text("Lost in the dark", W / 2, H * 0.42, 28, "#ffffff");
      text(score + " stars", W / 2, H * 0.42 + 32, 18, "#ffe4a8");
      text("Tap to try again", W / 2, H * 0.42 + 60, 15, "rgba(255,255,255,0.7)");
    }
  }

  let last = performance.now();
  function frame(t) {
    const dt = Math.min(0.033, (t - last) / 1000);
    last = t;
    update(dt); draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
