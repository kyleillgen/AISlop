<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<link rel="icon" href="data:,">
<title>Flipper</title>
</head>
<body>
<script src="flow-engine.js"></script>
<script src="pinball-skin.js"></script>
<script src="flow-shell.js"></script>
<script>
// Flipper: one button works both flippers. The ball comes down to a flipper on a beat; flip as
// it gets there and it flies up the table, ricocheting off whatever it meets (bumpers, drop
// targets, the slingshots), and still comes back down to a flipper on a beat. Flip early and it
// goes left, late and it goes right. Knock the whole bank of targets down and it pays.
//
// Flow: a ring closes on the flipper the ball is heading for, and the ball lands as it closes.
// A small upper flipper on the right fires with the pair, and catches a ball that is still high
// when the beat comes, so nothing has to plummet the whole table to make the beat.
// The clean window is about ±0.24 beat and "perfect" is ±0.08 (about ±45 ms). Flip well off the
// mark and you whiff; miss it and the ball drops between the flippers, and the kickback in the
// outlane fires it straight back into play. The ball is never lost.
//
// Hold: the flipper stays up, so a ball that arrives while you're holding is cradled on it. Let
// go after a hold and the ball takes the orbit lane round the top of the table (a full charge
// goes round twice) and comes back down to the other flipper, ready to flip. Just for fun.
//
// Fidget: every press flips the ball off wherever it is, so mashing keeps it pinging between the
// targets and bumpers. A ball you leave alone rests on a flipper, and a hold-and-release fires the
// orbit shot from anywhere.
(() => {
  "use strict";

  const PERFECT = 0.08; // beats
  const TAU = Math.PI * 2;
  const NT = 5; // drop targets in the bank

  let targets = []; // { x, y, up, drop, lit }
  let pops = []; // pop bumpers { x, y, pop }
  let path = null; // { pts: [{ x, y, t, hit }], next, kind, quality, ghost, scored, whiffed, side }
  let rest = null; // a cradled / resting ball: { x, y, side }
  let flipT = 0; // seconds the flippers stay up after a tap
  let flipAng = 0; // 0 down .. 1 up (eased)
  let spinner = 0;
  let spinnerV = 0;
  let kickFlash = [0, 0];
  let slingFlash = [0, 0];
  let bankResetAt = 0;
  let kick = 0;
  let trail = [];
  let lastBall = [0, 0];

  // Geometry, set on resize
  let cx = 0, fy = 0, pivL = [0, 0], pivR = [0, 0], pivU = [0, 0], FL = 64;
  const UK = 0.7; // the upper flipper's size against the main pair
  const TOP = 88; // the table starts below the score header
  const Y = (f) => TOP + f * (fy - TOP); // 0 top of the table .. 1 the flippers
  const DOWN = 0.5, UP = -0.42; // flipper angles (radians, left flipper; the right mirrors it)
  // Where the ball sits on a flipper: on its top surface (not its middle line), a little past
  // halfway along, for the flipper at angle a (down unless given)
  // side 0 and 1 are the main pair; side 2 is the small upper flipper on the right, which every
  // tap fires too, so a ball high on the table when the beat comes is played up there instead
  // of falling the whole table
  function strike(side, a = DOWN) {
    const k = side === 2 ? UK : 1;
    const d = (FL + 10) * 0.62 * k;
    const lift = (11 - 6 * 0.62) * k + 11 + 1; // bat half-thickness there + ball radius + a hair
    const [px, py] = side === 2 ? pivU : side ? pivR : pivL;
    const m = side ? -1 : 1;
    return [px + m * (Math.cos(a) * d + Math.sin(a) * lift), py + Math.sin(a) * d - Math.cos(a) * lift];
  }
  const win = (api) => api.pick({ chill: 0.3, normal: 0.24, intense: 0.17 }) + 0.06 * api.eng.assist;

  function layout(api) {
    const { W, H } = api;
    cx = W / 2;
    fy = Math.round(H * 0.9); // low on the table, like a real cabinet
    FL = Math.max(52, Math.min(70, W * 0.16));
    pivL = [cx - FL - 14, fy - 22];
    pivR = [cx + FL + 14, fy - 22];
    pivU = [Math.round(W * 0.84), Math.round(Y(0.28))];
    const ty = Math.round(Y(0.15));
    const span = Math.min(W - 140, 260); // clear of the orbit lane at the sides
    targets = Array.from({ length: NT }, (_, i) => {
      const old = targets[i];
      return { x: cx - span / 2 + (span * i) / (NT - 1), y: ty, up: old ? old.up : true, drop: old ? old.drop : 0, lit: old ? old.lit : false };
    });
    const by = Math.round(Y(0.42));
    const bs = Math.min(W * 0.2, 80);
    pops = [
      { x: cx - bs, y: by, pop: 0 },
      { x: cx + bs, y: by, pop: 0 },
      { x: cx, y: by + bs * 0.75, pop: 0 }
    ];
  }

  // ---- Paths: a ball's flight is a list of points with times (in beats); between them it
  // follows a gentle arc, slowing as it climbs and speeding as it falls
  function arcPoint(a, b, u) {
    const mx = (a.x + b.x) / 2;
    const my = Math.min(a.y, b.y) - 0.18 * Math.abs(b.x - a.x) - 18;
    const v = 1 - u;
    return [v * v * a.x + 2 * v * u * mx + u * u * b.x, v * v * a.y + 2 * v * u * my + u * u * b.y];
  }
  function ballAt(now) {
    if (rest) return strike(rest.side, DOWN + (UP - DOWN) * flipAng);
    if (!path) return lastBall;
    const p = path.pts;
    if (now <= p[0].t) return [p[0].x, p[0].y];
    for (let j = 0; j < p.length - 1; j++) {
      if (now < p[j + 1].t) {
        let u = (now - p[j].t) / Math.max(1e-6, p[j + 1].t - p[j].t);
        if (p[j].straight) return [p[j].x + (p[j + 1].x - p[j].x) * u, p[j].y + (p[j + 1].y - p[j].y) * u];
        // Long hops (the kickback) slow as they climb and speed as they fall
        const goingUp = p[j + 1].y < p[j].y - 20;
        u = goingUp ? 1 - (1 - u) * (1 - u) : p[j + 1].y > p[j].y + 20 ? u * u : u;
        return p[j].straight ? [p[j].x + (p[j + 1].x - p[j].x) * u, p[j].y + (p[j + 1].y - p[j].y) * u] : arcPoint(p[j], p[j + 1], u);
      }
    }
    const e = p[p.length - 1];
    return [e.x, e.y];
  }

  // A shot is a real little flight: the ball leaves the flipper, rises against gravity and
  // ricochets off the walls, pop bumpers, drop targets and slingshots, simulated in advance. Only
  // the last moment (a quarter of a second at most) is steered: of a dozen slightly different
  // launches, the one that comes down nearest a flipper on its own is kept, then a smooth curve
  // carries it the rest of the way, arriving exactly at tEnd. So every shot goes somewhere different, and still lands on
  // the beat. aim (-1 left .. 1 right) tilts the launch; Flow sets it from how early or late you
  // flipped, the way the spot on a real flipper decides where the ball goes.
  function shot(api, x, y, t0, tEnd, opts) {
    opts = opts || {};
    const { W } = api;
    const secs = Math.max(0.25, (tEnd - t0) * api.eng.beatSec);
    const span = fy - TOP;
    const g = 2.6 * span; // px/s²
    const land = Math.min(0.3, secs * 0.25);
    const simT = secs - land;
    const aim0 = opts.aim !== undefined ? opts.aim : (Math.random() * 2 - 1) * 0.6;
    const DT = 1 / 120;
    // One candidate flight: launch at a given aim and let it ricochet until the steer takes over
    const [ux, uy] = strike(2);
    const fromUpper = Math.hypot(x - ux, y - uy) < 6;
    // The upper flipper as a solid bat for flights that aren't coming to it
    const ua = DOWN, uL = (FL + 10) * UK;
    const uTip = [pivU[0] - Math.cos(ua) * uL, pivU[1] + Math.sin(ua) * uL];
    function fly(aim) {
      const a = fromUpper
        ? -Math.PI / 2 - 0.55 + aim * 0.35 + (Math.random() - 0.5) * 0.16
        : -Math.PI / 2 + (x < cx ? 0.2 : -0.2) + aim * 0.5 + (Math.random() - 0.5) * 0.16;
      const v0 = Math.sqrt(2 * g * Math.max(90, y - TOP) * 0.88);
      let vx = Math.cos(a) * v0, vy = Math.sin(a) * v0;
      const knocked = new Set();
      const samples = [{ x, y, s: 0, vx, vy }];
      let px = x, py = y;
      const mark = (hit, sling) => {
        const last = samples[samples.length - 1];
        if (hit && !last.hit) last.hit = hit;
        if (sling !== undefined) last.sling = sling;
      };
      for (let i = 1, tt = DT; tt <= simT; i++, tt += DT) {
        vy += g * DT;
        px += vx * DT;
        py += vy * DT;
        // Walls and the arch
        if (px < 17) (px = 17), (vx = Math.abs(vx) * 0.85);
        if (px > W - 17) (px = W - 17), (vx = -Math.abs(vx) * 0.85);
        if (py < TOP + 2) (py = TOP + 2), (vy = Math.abs(vy) * 0.8);
        // Pop bumpers kick the ball away
        for (const b of pops) {
          const dx = px - b.x, dy = py - b.y, d = Math.hypot(dx, dy);
          if (d < 33 && d > 0) {
            const nx = dx / d, ny = dy / d;
            const vn = vx * nx + vy * ny;
            if (vn < 0) (vx -= 2 * vn * nx), (vy -= 2 * vn * ny);
            vx += nx * 260;
            vy += ny * 260;
            px = b.x + nx * 33;
            py = b.y + ny * 33;
            mark(b);
          }
        }
        // The upper flipper's bat (skipped just after leaving it)
        if (tt > 0.15) {
          const sx0 = uTip[0] - pivU[0], sy0 = uTip[1] - pivU[1], l2 = sx0 * sx0 + sy0 * sy0;
          const w = Math.max(0, Math.min(1, ((px - pivU[0]) * sx0 + (py - pivU[1]) * sy0) / l2));
          const qx = px - (pivU[0] + sx0 * w), qy = py - (pivU[1] + sy0 * w), d = Math.hypot(qx, qy);
          if (d < 19 && d > 0) {
            const nx = qx / d, ny = qy / d, vn = vx * nx + vy * ny;
            if (vn < 0) (vx -= 1.8 * vn * nx), (vy -= 1.8 * vn * ny);
            px += nx * (19 - d);
            py += ny * (19 - d);
          }
        }
        // Drop targets knock down and bounce it back
        for (const t of targets) {
          if (!t.up || knocked.has(t)) continue;
          if (Math.abs(px - t.x) < 24 && Math.abs(py - t.y) < 28) {
            knocked.add(t);
            if (vy < 0) (vy = Math.abs(vy) * 0.75), (py = t.y + 28);
            else (vy = -Math.abs(vy) * 0.75), (py = t.y - 28);
            mark(t);
          }
        }
        // Low on the table the slingshots fire it back up
        if (py > fy - 90 && vy > 0) {
          vy = -Math.sqrt(2 * g * span * (0.35 + Math.random() * 0.2));
          vx += (px < cx ? 1 : -1) * (90 + Math.random() * 90);
          mark(null, px < cx ? 0 : 1);
        }
        const sp = Math.hypot(vx, vy);
        if (sp > 1500) (vx *= 1500 / sp), (vy *= 1500 / sp);
        if (i % 2 === 0) samples.push({ x: px, y: py, s: tt, vx, vy });
      }
      // Where the steer takes over for a given flipper: late, but never so late that the ball
      // would have to come down faster than it could fall from there. The cost is how far plain
      // gravity would leave it from the flipper, plus a little for every extra moment of steer
      const fit = (side) => {
        const [tx, ty] = strike(side);
        let k = samples.length - 1;
        for (; k > 0; k--) {
          const q = samples[k], r = secs - q.s;
          const up = Math.max(0, -q.vy) / g; // still rising: the time to stop climbing
          const fall = up + Math.sqrt((2 * Math.max(0, ty - q.y + 0.5 * g * up * up)) / g);
          if (r >= Math.max(land, fall * 1.05, Math.hypot(tx - q.x, ty - q.y) / (1.6 * span))) break;
        }
        const q = samples[k], r = secs - q.s;
        const fx = q.x + q.vx * r, fyy = q.y + q.vy * r + 0.5 * g * r * r;
        return { side, k, r, q, fx, cost: Math.hypot(fx - tx, fyy - ty) + 120 * Math.max(0, r - land) };
      };
      // The nearer of the main pair (or the one asked for); and a ball still high on the table
      // near the beat, above the upper flipper, can come down onto that one instead of dropping
      // the whole table (not straight back to it from itself, unless that's the natural way)
      let f = fit(opts.side !== undefined ? opts.side : samples[samples.length - 1].x < cx ? 0 : 1);
      if (opts.side === undefined) {
        const o = fit(1 - f.side);
        if (o.cost < f.cost) f = o;
        const u = fit(2);
        if (u.q.y < uy - 8) {
          u.cost += fromUpper ? 60 : 0;
          if (u.cost < f.cost) f = u;
        }
      }
      const [sx, sy] = strike(f.side);
      return { samples: samples.slice(0, f.k + 1), px: f.q.x, py: f.q.y, vx: f.q.vx, vy: f.q.vy, r: f.r, side: f.side, sx, sy, cost: f.cost };
    }
    // Try a dozen launches around the chosen aim and keep the one that comes down most naturally,
    // so the final steer is barely there
    let best = fly(aim0);
    for (let k = 0; k < 15 && best.cost > 12; k++) {
      const c = fly(aim0 + (Math.random() * 2 - 1) * 0.35);
      if (c.cost < best.cost) best = c;
    }
    const { samples, px, py, vx, vy, r, side, sx, sy } = best;
    // The steer: a smooth (Hermite) curve onto the flipper, leaving with the ball's own velocity
    // and arriving the way gravity would bring it
    const ex = vx * 0.6 + (side === 2 ? -20 : side ? -40 : 40), ey = Math.min(Math.max(300, vy + g * r), Math.sqrt(2 * g * span));
    const s0 = samples[samples.length - 1].s;
    const steps = Math.max(18, Math.round(r * 50));
    for (let k = 1; k <= steps; k++) {
      const u = k / steps, T = r;
      const h00 = 2 * u ** 3 - 3 * u * u + 1, h10 = u ** 3 - 2 * u * u + u, h01 = -2 * u ** 3 + 3 * u * u, h11 = u ** 3 - u * u;
      samples.push({ x: h00 * px + h10 * T * vx + h01 * sx + h11 * T * ex, y: h00 * py + h10 * T * vy + h01 * sy + h11 * T * ey, s: s0 + (secs - s0) * u });
    }
    const pts = samples.map((q) => ({ x: q.x, y: q.y, t: t0 + (q.s / secs) * (tEnd - t0), straight: true, hit: q.hit, sling: q.sling }));
    path = Object.assign({ pts, next: 1, kind: "shot", side, whiffed: false }, opts, { side });
    rest = null;
  }

  // The orbit lane: up one side, round the top arch, down the other side to the far flipper
  function orbitShot(api, x, y, t0, tEnd, laps) {
    const { W, H } = api;
    const leftFirst = x > cx;
    const L = [W * 0.09, Y(0.5)], TL = [W * 0.14, Y(0.06)], T = [cx, TOP - 2], TR = [W * 0.86, Y(0.06)], R = [W * 0.91, Y(0.5)];
    let ring = leftFirst ? [L, TL, T, TR, R] : [R, TR, T, TL, L];
    if (laps > 1) ring = ring.concat(ring.slice(0, -1).reverse().slice(1)).concat(ring.slice(1));
    const side = leftFirst ? 1 : 0;
    const [sx, sy] = strike(side);
    const all = [[x, y]].concat(ring, [[sx, sy]]);
    const n = all.length - 1;
    const pts = all.map(([px, py], i) => ({ x: px, y: py, t: t0 + ((tEnd - t0) * i) / n, straight: true, orbit: i > 0 && i < n }));
    path = { pts, next: 1, kind: "orbit", side, ghost: true, scored: false, whiffed: false };
    rest = null;
    api.ring(x, y, laps > 1 ? "#ffc400" : api.color(), 60 + 40 * laps);
  }

  // Missed: down between the flippers, then the outlane kickback fires it back up to a flipper
  function drain(api, now) {
    const { W, H } = api;
    const side = Math.random() < 0.5 ? 0 : 1;
    const kx = side ? W - 20 : 20;
    const T = Math.ceil(now + 2.2);
    const [sx, sy] = strike(side);
    const pts = [
      { x: lastBall[0], y: lastBall[1], t: now },
      { x: cx, y: H + 40, t: now + 0.4 },
      { x: kx, y: H + 40, t: now + 0.55, straight: true },
      { x: kx, y: fy + 10, t: now + 0.7, kicker: side, straight: true },
      { x: side ? W * 0.84 : W * 0.16, y: Y(0.5), t: now + 1.3 },
      { x: sx, y: sy, t: T }
    ];
    path = { pts, next: 1, kind: "drain", side, ghost: true, scored: false, whiffed: false };
  }

  function hitThing(api, h) {
    kick = 1;
    if (h.up !== undefined) {
      // A drop target
      if (h.up) {
        h.up = false;
        h.drop = 1;
        api.eng.pluck(0.2 + 0.6 * ((h.x - (cx - 150)) / 300), 0.4, 0.06);
        api.burst(h.x, h.y, api.color(), 6, -1);
        if (h.lit) {
          h.lit = false;
          api.bonus(500);
          api.ring(h.x, h.y, "#ffc400", 50);
          api.burst(h.x, h.y, "#ffc400", 10, -1);
        }
        if (targets.every((t) => !t.up)) {
          api.bonus(1500, "Bank!");
          api.ring(cx, h.y, "#ffc400", api.W * 0.45);
          bankResetAt = performance.now() + 700;
        }
      }
    } else {
      h.pop = 1;
      api.eng.pluck(0.5 + 0.3 * Math.random(), 0.25, 0.05);
      api.burst(h.x, h.y, "#ffc400", 4, -1);
    }
  }

  // Every flight (a shot, the orbit lane, the kickback) ends on a flipper at a beat, ready to flip
  const arrivalT = () => (path ? path.pts[path.pts.length - 1].t : null);
  const pace = (api) => Math.max(2, Math.round(api.eng.paceBeats()));

  // Fidget shots run on seconds, quicker the faster you press
  function fidgetShot(api, now) {
    const [x, y] = ballAt(now);
    const secs = (1.1 - 0.5 * api.rev) * (0.85 + Math.random() * 0.3);
    shot(api, x, y, now, now + secs / api.eng.beatSec, { ghost: true, fidget: true, aim: (cx - x) / cx * 0.6 + (Math.random() - 0.5) * 0.8 });
  }

  const api = FlowShell.mount({
    key: "flipper",
    title: "Flipper",
    hint: "Tap to flip as the ball comes down",
    vignette: false, // baked into the table layer
    input: "tap",
    tierNames: ["Finding your rhythm", "Lit up", "Multiball", "Wizard mode"],
    modes: ["Lit Target"],
    fidgetPoint: (api) => {
      const [x, y] = ballAt(api.eng.beatPos());
      return { x, y };
    },
    engine: { perBeat: [0.25, 1 / 3, 0.5, 1], stableTol: 3, pacing: { minBeats: 2, startBeats: 3 } },

    setup(api) {
      layout(api);
      const [sx, sy] = strike(0);
      rest = null;
      const now = api.eng.beatPos();
      lastBall = [sx, sy];
      shot(api, sx, sy, now, Math.ceil(now + 3), { ghost: true });
    },
    resize(api) {
      layout(api);
    },

    onBeat(n, api) {
      kick = 1;
      if (api.mode === "Lit Target" && !targets.some((t) => t.lit)) {
        const standing = targets.filter((t) => t.up);
        if (standing.length) standing[Math.floor(Math.random() * standing.length)].lit = true;
      }
      if (!api.mode) for (const t of targets) t.lit = false;
    },

    onAction(api) {
      const now = api.eng.beatPos();
      flipT = 0.16;
      if (api.style === "fidget") {
        api.eng.tap({ note: false });
        return fidgetShot(api, now);
      }
      if (rest) {
        // Off the cradle: back into play, landing on a beat (not judged)
        api.eng.tap({ height: 0.5 });
        return shot(api, ...ballAt(now), now, Math.ceil(now + pace(api)), { ghost: true });
      }
      const T = arrivalT();
      if (T === null || path.whiffed) return api.eng.tap({ note: false });
      const err = now - T;
      if (Math.abs(err) <= win(api)) {
        const [sx, sy] = strike(path.side);
        const perfect = Math.abs(err) < PERFECT;
        api.eng.tap({ height: 0.5 - 0.35 * (err / win(api)) });
        if (!api.eng.auto) {
          api.score(1, perfect ? "PERFECT" : "CLEAN", api.eng.beatSec * 0.5);
          if (perfect) api.ring(sx, sy, api.color(), 46);
        }
        // Early sends it left, late sends it right; perfect goes straight up the middle
        return shot(api, sx, sy, now, T + pace(api), { aim: Math.max(-1, Math.min(1, err / win(api))) * (perfect ? 0.3 : 1) });
      }
      api.eng.tap({ note: false });
      if (Math.abs(err) > 0.55) return;
      // A whiff: the flipper swings before (or after) the ball; it drops through
      path.whiffed = true;
      api.miss();
      api.hint("timing", "Flip as the ring closes on the flipper");
    },

    // Let go after a hold: the orbit shot, from the cradle (or from anywhere in Fidget)
    onRelease(api, held) {
      const c = api.chargeOf(held);
      if (c <= 0) return;
      const now = api.eng.beatPos();
      if (!rest && api.style !== "fidget") return;
      if (path && path.kind === "orbit") return;
      const [x, y] = ballAt(now);
      const laps = c > 0.85 ? 2 : 1;
      const secs = (1.0 + 0.5 * c) * laps;
      const tEnd = now + secs / api.eng.beatSec;
      orbitShot(api, x, y, now, api.style === "fidget" ? tEnd : Math.ceil(tEnd), laps);
      spinnerV = 30 * laps;
    },

    // Autopilot flips exactly as the ball arrives, and picks up a resting ball; nothing scores
    autopilot(dt, api) {
      const now = api.eng.beatPos();
      if (rest) {
        flipT = 0.16;
        return shot(api, ...ballAt(now), now, Math.ceil(now + pace(api)), { ghost: true });
      }
      const T = arrivalT();
      if (T !== null && now >= T && !path.whiffed) {
        flipT = 0.16;
        const [sx, sy] = strike(path.side);
        shot(api, sx, sy, T, T + pace(api), { ghost: true });
      }
    },

    update(dt, api) {
      const now = api.eng.beatPos();
      kick = Math.max(0, kick - dt * 4.2);
      flipT = Math.max(0, flipT - dt);
      const up = flipT > 0 || api.held > 0;
      flipAng += ((up ? 1 : 0) - flipAng) * Math.min(1, dt * (up ? 40 : 14));
      for (const p of pops) p.pop = Math.max(0, p.pop - dt * 3);
      for (const t of targets) t.drop = Math.max(0, t.drop - dt * 4);
      kickFlash = kickFlash.map((k) => Math.max(0, k - dt * 2));
      slingFlash = slingFlash.map((k) => Math.max(0, k - dt * 4));
      spinner += spinnerV * dt;
      spinnerV *= Math.pow(0.3, dt);
      if (bankResetAt && performance.now() > bankResetAt) {
        bankResetAt = 0;
        for (const t of targets) {
          t.up = true;
          t.drop = 0;
        }
        api.burst(cx, targets[0].y, "#f6e6c0", 10, -1);
      }

      if (path) {
        // Things the ball passes on its way
        while (path.next < path.pts.length - 1 && now >= path.pts[path.next].t) {
          const pt = path.pts[path.next++];
          if (pt.hit) hitThing(api, pt.hit);
          if (pt.sling !== undefined) {
            slingFlash[pt.sling] = 1;
            api.eng.pluck(0.7, 0.12, 0.05);
          }
          if (pt.kicker !== undefined) {
            kickFlash[pt.kicker] = 1;
            api.ring(pt.x, pt.y, "#e8231f", 40);
            api.eng.pluck(0.9, 0.3, 0.08);
          }
          if (pt.orbit) {
            spinnerV = Math.max(spinnerV, 18);
            api.eng.pluck(0.85 - 0.6 * (pt.x / api.W), 0.2, 0.05);
          }
        }
        // At the flipper with no flip: Fidget and a held flipper cradle it; Flow drops it
        const T = arrivalT();
        const late = now > T + (path.whiffed ? 0.02 : win(api));
        if (late) {
          const [sx, sy] = strike(path.side);
          if (api.style === "fidget" || api.charge > 0 || !api.started) {
            if (api.started) {
              rest = { x: sx, y: sy, side: path.side };
              path = null;
            }
          } else {
            if (!path.whiffed && !api.eng.auto) {
              api.miss();
              api.hint("timing", "Flip as the ring closes on the flipper");
            }
            drain(api, now);
          }
        }
      }

      const b = ballAt(now);
      lastBall = [b[0], b[1]];
      trail.unshift([b[0], b[1]]);
      if (trail.length > 9) trail.pop();
    },

    draw(ctx, api) {
      const { W, H, tier } = api;
      const Skin = PinballSkin;
      const now = api.eng.beatPos();
      const col = api.color();
      const sling = (s) => {
        const m = s ? -1 : 1;
        const x0 = s ? W - 44 : 44;
        return [[x0, fy - 150], [x0, fy - 80], [x0 + m * 34, fy - 66]];
      };

      // The table: everything that never moves, baked once per size and tier
      Skin.layer(ctx, "flipper" + tier, W, H, (g) => {
        Skin.playfield(g, W, H, tier);
        // Wire rails: a soft shadow, the steel and a hairline of light along it
        const wire = (trace, width) => {
          g.lineCap = "round";
          g.lineJoin = "round";
          for (const [st, lw, dx, dy] of [["rgba(0,0,0,0.22)", width + 4, 1.5, 3], ["rgba(0,0,0,0.2)", width + 1.5, 1, 2], ["#8f877c", width, 0, 0], ["rgba(255,248,230,0.7)", 1.1, -0.5, -0.6]]) {
            g.save();
            g.translate(dx, dy);
            g.strokeStyle = st;
            g.lineWidth = lw;
            g.beginPath();
            trace();
            g.stroke();
            g.restore();
          }
        };
        // The cabinet rail: up both sides and round the top arch
        wire(() => {
          g.moveTo(6, H);
          g.lineTo(6, Y(0.12));
          g.quadraticCurveTo(6, TOP - 14, cx, TOP - 14);
          g.quadraticCurveTo(W - 6, TOP - 14, W - 6, Y(0.12));
          g.lineTo(W - 6, H);
        }, 4);
        // The orbit lane inside it: a row of lamp dots
        g.strokeStyle = "rgba(246,230,192,0.16)";
        g.lineWidth = 3;
        g.lineCap = "round";
        g.setLineDash([0, 11]);
        g.beginPath();
        g.moveTo(W * 0.09, Y(0.55));
        g.lineTo(W * 0.09, Y(0.1));
        g.quadraticCurveTo(W * 0.1, TOP - 2, cx, TOP - 2);
        g.quadraticCurveTo(W * 0.9, TOP - 2, W * 0.91, Y(0.1));
        g.lineTo(W * 0.91, Y(0.55));
        g.stroke();
        g.setLineDash([]);
        // Inlane guides down to the flippers
        wire(() => {
          g.moveTo(30, fy - 110);
          g.lineTo(pivL[0], pivL[1]);
          g.moveTo(W - 30, fy - 110);
          g.lineTo(pivR[0], pivR[1]);
        }, 3);
        // Slingshots: a cream plastic body with red rubber on the kicking face, on a soft shadow
        for (const s of [0, 1]) {
          const [p0, p1, p2] = sling(s);
          const tri = () => {
            g.beginPath();
            g.moveTo(p0[0], p0[1]);
            g.lineTo(p1[0], p1[1]);
            g.lineTo(p2[0], p2[1]);
            g.closePath();
          };
          g.lineJoin = "round";
          for (const [a, lw] of [[0.1, 9], [0.14, 5], [0.2, 2]]) {
            g.save();
            g.translate(1.5, 3.5);
            tri();
            g.strokeStyle = g.fillStyle = "rgba(0,0,0," + a + ")";
            g.lineWidth = lw;
            g.stroke();
            g.fill();
            g.restore();
          }
          tri();
          const body = g.createLinearGradient(0, p0[1], 0, p2[1]);
          body.addColorStop(0, "#fbf1da");
          body.addColorStop(1, "#d9bf8c");
          g.fillStyle = body;
          g.strokeStyle = body;
          g.lineWidth = 4;
          g.stroke();
          g.fill();
          g.strokeStyle = "#e8231f";
          g.lineWidth = 3.5;
          g.lineCap = "round";
          g.beginPath();
          g.moveTo(p0[0], p0[1]);
          g.lineTo(p2[0], p2[1]);
          g.stroke();
          for (const p of [p0, p1, p2]) Skin.post(g, p[0], p[1], 3.5);
          // The outlane kickback lamp's socket
          const kx = s ? W - 20 : 20;
          g.fillStyle = "#1a110c";
          g.beginPath();
          g.arc(kx, fy + 20, 7, 0, TAU);
          g.fill();
          g.strokeStyle = "rgba(255,255,255,0.08)";
          g.lineWidth = 1;
          g.stroke();
        }
        // Drop target slots and the insert under each target
        for (const t of targets) {
          g.fillStyle = "rgba(0,0,0,0.5)";
          g.fillRect(t.x - 14, t.y + 14, 28, 4);
          g.fillStyle = "#1a110c";
          g.beginPath();
          g.arc(t.x, t.y + 32, 5.5, 0, TAU);
          g.fill();
        }
        // The spinner's posts
        Skin.post(g, cx - 18, TOP - 2, 3);
        Skin.post(g, cx + 18, TOP - 2, 3);
      });

      // Arrow inserts pointing up the table, the first breathing with the kick
      for (let i = 0; i < 4; i++) Skin.insert(ctx, cx, H * (0.6 + i * 0.045), 10, col, i === 0 ? 0.2 + kick * 0.6 : 0);

      // Spinner at the top of the orbit: a steel plate turning on its wire
      ctx.save();
      ctx.translate(cx, TOP - 2);
      ctx.scale(Math.cos(spinner), 1);
      ctx.fillStyle = spinnerV > 2 ? "#ffc400" : "#b9b1a5";
      ctx.fillRect(-14, -5, 28, 10);
      ctx.fillStyle = "rgba(255,255,255,0.45)";
      ctx.fillRect(-14, -5, 28, 3);
      ctx.restore();

      // Slingshot rubber and kickback lamps flash when they fire
      for (const s of [0, 1]) {
        if (slingFlash[s] > 0) {
          const [p0, , p2] = sling(s);
          Skin.glow(ctx, (p0[0] + p2[0]) / 2, (p0[1] + p2[1]) / 2, 50, "#e8231f", slingFlash[s]);
          ctx.globalAlpha = slingFlash[s];
          ctx.strokeStyle = "#ffd2c4";
          ctx.lineWidth = 3.5;
          ctx.lineCap = "round";
          ctx.beginPath();
          ctx.moveTo(p0[0], p0[1]);
          ctx.lineTo(p2[0], p2[1]);
          ctx.stroke();
          ctx.lineCap = "butt";
          ctx.globalAlpha = 1;
        }
        if (kickFlash[s] > 0) {
          const kx = s ? W - 20 : 20;
          Skin.glow(ctx, kx, fy + 20, 26 + kickFlash[s] * 10, "#e8231f", kickFlash[s]);
          ctx.globalAlpha = kickFlash[s];
          ctx.fillStyle = "#ff5a48";
          ctx.beginPath();
          ctx.arc(kx, fy + 20, 6 + kickFlash[s] * 2, 0, TAU);
          ctx.fill();
          ctx.globalAlpha = 1;
        }
      }

      // Drop targets: cream faces with a red band on a soft shadow, sinking into their slots;
      // the insert under each lights while it's down
      for (const t of targets) {
        if (!t.up) {
          Skin.glow(ctx, t.x, t.y + 32, 16, col, 0.8);
          ctx.fillStyle = col;
          ctx.beginPath();
          ctx.arc(t.x, t.y + 32, 4.5, 0, TAU);
          ctx.fill();
          if (t.drop <= 0) continue;
        }
        const face = t.lit ? "#ffc400" : "#f6e6c0";
        const sp = Skin.sprite(ctx, "target" + face, 40, 48, 20, 22, (g) => {
          for (const [a, grow] of [[0.1, 4], [0.14, 2], [0.2, 0]]) {
            g.fillStyle = "rgba(0,0,0," + a + ")";
            g.beginPath();
            g.roundRect(-11 - grow, -12 - grow, 26 + grow * 2, 32 + grow * 2, 3 + grow);
            g.fill();
          }
          const lin = g.createLinearGradient(0, -16, 0, 16);
          lin.addColorStop(0, Skin.mix(face, "#ffffff", 0.45));
          lin.addColorStop(0.5, face);
          lin.addColorStop(1, Skin.mix(face, "#000000", 0.18));
          g.fillStyle = lin;
          g.beginPath();
          g.roundRect(-13, -16, 26, 32, 3);
          g.fill();
          g.fillStyle = "#e8231f";
          g.fillRect(-13, -11, 26, 4);
          g.fillStyle = "rgba(255,255,255,0.6)";
          g.fillRect(-11, -15, 22, 1);
        });
        if (t.up) Skin.draw(ctx, sp, t.x, t.y);
        else {
          ctx.save();
          ctx.globalAlpha = t.drop;
          ctx.translate(t.x, t.y + 16);
          ctx.scale(1, (4 + 28 * t.drop) / 32);
          Skin.draw(ctx, sp, 0, -16);
          ctx.restore();
        }
      }

      // Pop bumpers
      for (const b of pops) Skin.bumper(ctx, b.x, b.y, 22, b.pop > 0.2 ? "#fff8e6" : col, b.pop);

      // The landing ring: closes on the flipper the ball is heading for, shut as it lands
      const T = arrivalT();
      if (T !== null && !path.whiffed && api.style === "flow") {
        const left = T - now;
        if (left < 1.5 && left > -0.3) {
          const [sx, sy] = strike(path.side);
          const k = Math.max(0, left) / 1.5;
          ctx.strokeStyle = left < 0.12 ? "#ffc400" : col;
          ctx.globalAlpha = 0.35 + 0.6 * (1 - k);
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.arc(sx, sy, 12 + 46 * k, 0, TAU);
          ctx.stroke();
          ctx.globalAlpha = 1;
        }
      }

      // Flippers: cream bats wrapped in red rubber on a steel pivot, pivoting up together
      const bat = (g) => {
        g.beginPath();
        g.arc(0, 0, 11, Math.PI / 2, -Math.PI / 2);
        g.lineTo(FL + 10, -5);
        g.arc(FL + 10, 0, 5, -Math.PI / 2, Math.PI / 2);
        g.closePath();
      };
      const fk = FL.toFixed(1);
      const bw = FL + 15 + 11 + 16;
      const shadow = Skin.sprite(ctx, "batS" + fk, bw, 38, 19, 19, (g) => {
        g.lineJoin = "round";
        for (const [a, lw] of [[0.08, 8], [0.1, 4], [0.16, 0]]) {
          bat(g);
          g.fillStyle = g.strokeStyle = "rgba(0,0,0," + a + ")";
          g.lineWidth = lw;
          if (lw) g.stroke();
          g.fill();
        }
      });
      const body = Skin.sprite(ctx, "batB" + fk, bw, 38, 19, 19, (g) => {
        bat(g);
        const lin = g.createLinearGradient(0, -11, 0, 11);
        lin.addColorStop(0, "#fffaf0");
        lin.addColorStop(0.45, "#f6e6c0");
        lin.addColorStop(1, "#d6bc88");
        g.fillStyle = lin;
        g.fill();
        const rub = g.createLinearGradient(0, -11, 0, 11);
        rub.addColorStop(0, "#ff5a48");
        rub.addColorStop(1, "#b3170f");
        g.strokeStyle = rub;
        g.lineWidth = 2.5;
        g.stroke();
        const cap = g.createRadialGradient(-1.2, -1.5, 0, 0, 0, 4.5);
        cap.addColorStop(0, "#ffffff");
        cap.addColorStop(1, "#7d766d");
        g.fillStyle = cap;
        g.beginPath();
        g.arc(0, 0, 4, 0, TAU);
        g.fill();
      });
      const a = DOWN + (UP - DOWN) * flipAng;
      for (const s of [0, 1, 2]) {
        const [px, py] = s === 2 ? pivU : s ? pivR : pivL;
        const k = s === 2 ? UK : 1;
        for (const [sp, dx, dy] of [[shadow, 2, 4], [body, 0, 0]]) {
          ctx.save();
          ctx.translate(px + dx, py + dy);
          ctx.scale(s ? -k : k, k);
          ctx.rotate(a);
          Skin.draw(ctx, sp, 0, 0);
          ctx.restore();
        }
      }

      // The ball: a faint motion streak, the ball (finish from your lifetime rank), the charge arc
      Skin.streak(ctx, trail, 11);
      const [x, y] = ballAt(now);
      Skin.ball(ctx, x, y, 11, api.ballStops());
      if (api.charge > 0) {
        ctx.strokeStyle = api.charge > 0.85 ? "#ffc400" : col;
        ctx.globalAlpha = 0.75;
        ctx.lineWidth = 2.5;
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.arc(x, y, 19 + 7 * api.charge, -Math.PI / 2, -Math.PI / 2 + TAU * api.charge);
        ctx.stroke();
        ctx.lineCap = "butt";
        ctx.globalAlpha = 1;
      }
    }
  });

  window.__flipperBall = () => ballAt(api.eng.beatPos()); // for automated path tracing
  // Read-only snapshot for automated play tests
  window.flipperState = () => ({
    beatPos: +api.eng.beatPos().toFixed(3),
    arrival: arrivalT(),
    kind: path ? path.kind : rest ? "rest" : null,
    whiffed: path ? path.whiffed : false,
    standing: targets.filter((t) => t.up).length,
    streak: api.eng.streak,
    bpm: +api.eng.bpm.toFixed(1),
    auto: api.eng.auto
  });
})();
</script>
</body>
</html>
