<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<link rel="icon" href="data:,">
<title>Rollover</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
<script src="flow-engine.js"></script>
<script src="pinball-skin.js"></script>
<script src="flow-shell.js"></script>
<script>
// Rollover: lit inserts come down four lanes and land on the beat; slide the ball under them.
//
// Each lane is a note, so moving is playing: the targets walk up, down and zigzag across the
// lanes in short phrases, and following them plays the melody back. Arriving early and waiting
// is "perfect" (be there on the beat, not lunging at it). A missed insert steps the streak down
// a little and the next ones keep coming.
(() => {
  "use strict";

  const N = 4;
  const LEAD = 4; // beats an insert is visible before it lands
  const SKY = [["#0d0930", "#2a1460"], ["#04170f", "#0f3a1c"], ["#1a0520", "#45102e"], ["#1f0806", "#52200a"]];

  let targets = [];
  let lane = 1;
  let laneSince = 0; // beatPos when the ball arrived in its lane
  let ballX = 0;
  let laneFlash = [0, 0, 0, 0];
  let beatsSinceSpawn = 99;
  let nextLane = 1;
  let phrase = [];
  let kick = 0;
  let hitY = 0;
  let topY = 0;
  let left = 0;
  let laneW = 0;

  const laneX = (i) => left + laneW * (i + 0.5);
  const yOf = (t, now) => hitY - (t.beat - now) * ((hitY - topY) / LEAD);

  // Melodic phrases across the lanes: walks, zigzags and holds, chained from where the last
  // one ended so the ball's path reads like a tune
  function nextPhrase(from) {
    const shapes = [[1, 1, 1], [-1, -1, -1], [2, -1, 2], [-2, 1, -2], [0, 1, 0], [1, -1, 1, -1], [0, 0, 1], [-1, 0, -1]];
    const s = shapes[Math.floor(Math.random() * shapes.length)];
    const out = [];
    let at = from;
    for (const d of s) {
      at = Math.max(0, Math.min(N - 1, at + d));
      out.push(at);
    }
    return out;
  }

  function move(to, api) {
    to = Math.max(0, Math.min(N - 1, to));
    if (to === lane) return;
    lane = to;
    laneSince = api.eng.beatPos();
    // Each lane is a note: left low, right high
    api.eng.tap({ height: 0.8 - 0.6 * (lane / (N - 1)) });
  }

  const api = FlowShell.mount({
    key: "rollover",
    title: "Rollover",
    tagline: "Roll under<br>the lights.",
    about:
      "Lit inserts come down four lanes and land on the beat. Slide the ball under each one as it lands. Every lane is a note, so following the lights plays the tune back. Be there early and it counts as perfect. A missed one just steps your streak down a little.",
    hint: "← → or tap a lane",
    input: "tap",
    keys: [["← →", "slide"], ["1–4", "jump to a lane"]],
    tierNames: ["Finding your rhythm", "Lit up", "Multiball", "Jackpot"],
    // Moves follow the lights (every 1-4 beats), and waiting in the right lane is playing too,
    // so autopilot waits longer before taking over
    engine: { perBeat: [0.25, 1 / 3, 0.5, 1, 2], stableTol: 3, idleSec: 7, pacing: { minBeats: 1, startBeats: 2 } },

    resize(api) {
      const w = Math.min(api.W - 24, 460);
      left = (api.W - w) / 2;
      laneW = w / N;
      hitY = Math.round(api.H * 0.8);
      topY = 96;
      ballX = laneX(lane);
    },

    onBeat(n, api) {
      kick = 1;
      if (++beatsSinceSpawn < api.eng.paceBeats()) return;
      beatsSinceSpawn = 0;
      if (!phrase.length) phrase = nextPhrase(nextLane);
      nextLane = phrase.shift();
      targets.push({ beat: n + LEAD, lane: nextLane, state: "live", fade: 1 });
    },

    onKey(key, api) {
      if (key === "ArrowLeft" || key === "a" || key === "A") move(lane - 1, api);
      else if (key === "ArrowRight" || key === "d" || key === "D") move(lane + 1, api);
      else if (key >= "1" && key <= "4") move(+key - 1, api);
      else return false;
      return true;
    },

    // Tap a lane to go there; Space nudges toward the next light
    onAction(api, e) {
      if (e.x !== undefined) return move(Math.floor((e.x - left) / laneW), api);
      const next = targets.find((t) => t.state === "live");
      if (next) move(lane + Math.sign(next.lane - lane), api);
    },

    // Autopilot glides to each light half a beat before it lands; nothing scores
    autopilot(dt, api) {
      const now = api.eng.beatPos();
      const next = targets.find((t) => t.state === "live" && t.beat - now < 0.6);
      if (next && next.lane !== lane) {
        lane += Math.sign(next.lane - lane);
        laneSince = now;
      }
    },

    update(dt, api) {
      const now = api.eng.beatPos();
      kick = Math.max(0, kick - dt * 4.2);
      ballX += (laneX(lane) - ballX) * (1 - Math.pow(0.0005, dt)); // quick, smooth slide
      for (let i = 0; i < N; i++) laneFlash[i] = Math.max(0, laneFlash[i] - dt * 2.5);
      for (const t of targets) {
        if (t.state !== "live") {
          t.fade -= dt * 2.5;
          continue;
        }
        if (now < t.beat) continue;
        if (lane === t.lane) {
          t.state = "got";
          laneFlash[t.lane] = 1;
          api.burst(laneX(t.lane), hitY, api.color(), 6, -1);
          api.ring(laneX(t.lane), hitY, api.color(), 30);
          if (!api.eng.auto) {
            const perfect = now - laneSince >= 0.25; // settled in before it landed
            api.score(1, perfect ? "PERFECT" : "CLEAN", api.eng.beatSec * 1.1);
          }
        } else {
          t.state = "missed";
          api.miss();
        }
      }
      targets = targets.filter((t) => t.fade > 0);
    },

    draw(ctx, api) {
      const { W, H, tier } = api;
      const now = api.eng.beatPos();
      const col = api.color();
      ctx.fillStyle = api.cached("sky" + tier, () => {
        const g = ctx.createLinearGradient(0, 0, 0, H);
        g.addColorStop(0, SKY[tier - 1][0]);
        g.addColorStop(1, SKY[tier - 1][1]);
        return g;
      });
      ctx.fillRect(0, 0, W, H);

      // Side slingshots: two black triangles with a rubber edge that kicks on the beat
      for (const side of [-1, 1]) {
        const x0 = side < 0 ? left - 10 : left + laneW * N + 10;
        ctx.fillStyle = "#140f0c";
        ctx.beginPath();
        ctx.moveTo(x0, hitY - 160);
        ctx.lineTo(x0, hitY - 20);
        ctx.lineTo(x0 - side * 34, hitY - 20);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = col;
        ctx.lineWidth = 3 + kick * 2;
        ctx.beginPath();
        ctx.moveTo(x0, hitY - 160);
        ctx.lineTo(x0 - side * 34, hitY - 20);
        ctx.stroke();
      }

      // Lane guides: cream rails with black outlines, the way inlanes look on a playfield
      for (let i = 0; i <= N; i++) {
        const x = left + laneW * i;
        ctx.fillStyle = "#140f0c";
        ctx.fillRect(x - 3, topY, 6, hitY - topY + 24);
        ctx.fillStyle = "#f6e6c0";
        ctx.fillRect(x - 1.5, topY, 3, hitY - topY + 24);
      }

      // Rollover switches on the line: cream buttons that light when an insert lands on them
      for (let i = 0; i < N; i++) {
        const x = laneX(i);
        ctx.fillStyle = "#140f0c";
        ctx.beginPath();
        ctx.arc(x, hitY, 17, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = laneFlash[i] > 0 ? col : "#3a2418";
        ctx.beginPath();
        ctx.arc(x, hitY, 12 + laneFlash[i] * 3, 0, Math.PI * 2);
        ctx.fill();
      }

      // Inserts: arrow lights pointing down, lit in the tier colour with a hard white glint
      const s = Math.min(22, laneW * 0.32);
      for (const t of targets) {
        const x = laneX(t.lane);
        const y = t.state === "live" ? yOf(t, now) : hitY;
        if (y < topY - s) continue;
        // Lights warm up as they near the line, so the next one to land reads first
        ctx.globalAlpha = t.state === "live" ? 0.45 + 0.55 * Math.max(0, 1 - (t.beat - now) / LEAD) : Math.max(0, t.fade);
        ctx.fillStyle = "#140f0c";
        ctx.beginPath();
        ctx.moveTo(x - s - 3, y - s * 0.7 - 3);
        ctx.lineTo(x + s + 3, y - s * 0.7 - 3);
        ctx.lineTo(x, y + s * 0.7 + 4);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = t.state === "missed" ? "#5a3a2a" : col;
        ctx.beginPath();
        ctx.moveTo(x - s, y - s * 0.7);
        ctx.lineTo(x + s, y - s * 0.7);
        ctx.lineTo(x, y + s * 0.7);
        ctx.closePath();
        ctx.fill();
        if (t.state === "live") {
          ctx.fillStyle = "rgba(255,255,255,0.75)";
          ctx.fillRect(x - s * 0.45, y - s * 0.5, s * 0.35, s * 0.18);
        }
      }
      ctx.globalAlpha = 1;

      // The ball
      const r = Math.min(15, laneW * 0.2);
      const ball = api.cached("ball" + r, () => {
        const g = ctx.createRadialGradient(-r * 0.35, -r * 0.35, r * 0.1, 0, 0, r);
        g.addColorStop(0, "#ffffff");
        g.addColorStop(0.45, "#c9c4bd");
        g.addColorStop(1, "#4a443e");
        return g;
      });
      // The ball leans and stretches into a slide
      const slide = Math.max(-1, Math.min(1, (laneX(lane) - ballX) / laneW));
      ctx.save();
      ctx.translate(ballX, hitY + 30);
      ctx.rotate(slide * 0.15);
      ctx.scale(1 + Math.abs(slide) * 0.18, 1 - Math.abs(slide) * 0.1);
      ctx.fillStyle = ball;
      ctx.beginPath();
      ctx.arc(0, 0, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  });

  // Read-only snapshot for automated play tests
  window.rolloverState = () => {
    const now = api.eng.beatPos();
    const next = targets.find((t) => t.state === "live");
    return {
      beatPos: +now.toFixed(3),
      lane,
      nextLane: next ? next.lane : null,
      nextIn: next ? +(next.beat - now).toFixed(2) : null,
      streak: api.eng.streak,
      bpm: +api.eng.bpm.toFixed(1),
      locked: api.eng.locked,
      auto: api.eng.auto,
      got: targets.filter((t) => t.state === "got").length,
      missed: targets.filter((t) => t.state === "missed").length
    };
  };
})();
</script>
</body>
</html>
