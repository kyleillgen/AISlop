<!doctype html>
<html lang="en">
<head>
<script src="flow-layer.js" data-mode="toy" data-bpm="84" data-step="400"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Resonance Glide</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #070914; touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
  "use strict";
  // Resonance Glide: Flow // Resonance's flight with nothing to crash into. A glowing
  // harmonic ribbon winds across an aurora sky; tap to lift, press down to dip, and ride it.
  // Staying on the ribbon builds resonance, collects beat beads (each one a note in key),
  // and slowly carries the world through new skies. Leave it alone and it glides itself.
  const cv = document.getElementById("c");
  const g = cv.getContext("2d");
  let W = 0, H = 0;
  function resize() {
    const d = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W * d; cv.height = H * d;
    g.setTransform(d, 0, 0, d, 0, 0);
  }
  window.addEventListener("resize", resize);
  resize();

  const BEAT = 60 / 84;
  const SPEED = 150;               // px per second of world scroll; one bead per beat
  const GRAVITY = 520, LIFT = -260, DIVE = 330, DIVE_TIME = 0.14;

  // Skies the world drifts through as distance on the ribbon builds
  const SKIES = [
    { name: "Dusk Drift", top: "#0a0c1f", mid: "#1b1840", low: "#3a2350", aur: [168, 280] },
    { name: "Glacier Light", top: "#061826", mid: "#0f3346", low: "#1d5560", aur: [180, 210] },
    { name: "Rose Hour", top: "#1a0b1f", mid: "#3d1636", low: "#6b2d45", aur: [320, 30] },
    { name: "Verdant Night", top: "#04130f", mid: "#0c2c22", low: "#1d4a35", aur: [120, 170] },
    { name: "Platinum", top: "#111318", mid: "#262b36", low: "#4d5463", aur: [210, 0] }
  ];
  const ERA_SPAN = 400;            // resonance points per sky

  let wx = 0;                      // world x scrolled so far
  let t = 0;
  const ship = { y: 0, vy: 0, dive: 0, trail: [] };
  let resonance = 0.3;             // 0..1, how locked to the ribbon you are
  let points = 0;                  // grows while on the ribbon; drives the skies
  let skyPos = 0;
  let lastInput = -99, autopilot = true;
  let beads = [], nextBead = 0, sparks = [], rings = [];
  let swipe = null;

  // The ribbon: a slow sum of sines in world space, so it never repeats exactly
  function ribbonY(x) {
    const a = 0.5
      + 0.16 * Math.sin(x * 0.0021)
      + 0.09 * Math.sin(x * 0.0047 + 1.3)
      + 0.05 * Math.sin(x * 0.0113 + 0.4);
    const top = 70, bot = H - 50;
    return top + a * (bot - top);
  }

  function shipX() { return Math.min(Math.max(W * 0.26, 70), 170); }
  ship.y = ribbonY(shipX()); // start on the ribbon, already in resonance

  function lift() {
    lastInput = t; autopilot = false;
    ship.dive = 0;
    ship.vy = LIFT;
    note(ship.y, 0);
  }
  function dive() {
    lastInput = t; autopilot = false;
    ship.dive = DIVE_TIME;
    ship.vy = DIVE;
    note(ship.y, -3);
  }
  function note(y, shift) {
    if (!window.Flow) return;
    const deg = Math.max(0, Math.min(13, Math.round((1 - y / H) * 13) + shift));
    Flow.note(deg, { vol: 0.045, dur: 0.6 });
  }

  window.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    swipe = { y: e.clientY, at: performance.now(), used: false };
    lift();
  }, { passive: false });
  window.addEventListener("pointermove", (e) => {
    if (!swipe || swipe.used) return;
    if (e.clientY - swipe.y > 26 && performance.now() - swipe.at < 350) { swipe.used = true; dive(); }
  });
  window.addEventListener("pointerup", () => { swipe = null; });
  window.addEventListener("keydown", (e) => {
    if (e.repeat) return;
    if (e.code === "Space" || e.code === "ArrowUp" || e.code === "KeyW") { e.preventDefault(); lift(); }
    else if (e.code === "ArrowDown" || e.code === "KeyS") { e.preventDefault(); dive(); }
  });

  function update(dt) {
    t += dt;
    wx += SPEED * dt;
    const sx = shipX();

    // Autopilot after a few quiet seconds: ease along the ribbon like a screensaver
    if (t - lastInput > 5) autopilot = true;
    if (autopilot) {
      const target = ribbonY(wx + sx + 40);
      ship.vy += ((target - ship.y) * 6 - ship.vy * 2.2) * dt;
    } else if (ship.dive > 0) {
      ship.dive -= dt;
      ship.vy = ship.dive > 0 ? DIVE : 40; // hold the drop, then level off sharply
    } else {
      ship.vy += GRAVITY * dt;
      // A gentle pull toward the ribbon so it always feels within reach
      ship.vy += (ribbonY(wx + sx) - ship.y) * 0.9 * dt;
    }
    ship.vy = Math.max(-420, Math.min(420, ship.vy));
    ship.y += ship.vy * dt;
    if (ship.y < 40) { ship.y = 40; ship.vy = Math.max(0, ship.vy); }
    if (ship.y > H - 20) { ship.y = H - 20; ship.vy = LIFT * 0.6; }

    // Resonance: close to the ribbon builds it, far away lets it fade
    const off = Math.abs(ship.y - ribbonY(wx + sx));
    const band = 26;
    if (off < band) {
      resonance = Math.min(1, resonance + dt * 0.12);
      points += dt * (2 + resonance * 8) * (autopilot ? 0.35 : 1);
    } else {
      resonance = Math.max(0, resonance - dt * 0.05 * Math.min(3, off / band));
    }
    if (window.Flow) Flow.score(Math.floor(points));
    skyPos += (points / ERA_SPAN - skyPos) * Math.min(1, dt * 0.4);

    ship.trail.unshift({ x: sx, y: ship.y });
    if (ship.trail.length > 46) ship.trail.pop();
    for (const p of ship.trail) p.x -= SPEED * dt;

    // Beat beads sit on the ribbon one beat apart; flying through one plays it
    while (nextBead < wx + W + 60) {
      beads.push({ x: nextBead, taken: false });
      nextBead += SPEED * BEAT;
    }
    for (const b of beads) {
      const bx = b.x - wx, by = ribbonY(b.x);
      if (!b.taken && Math.abs(bx - sx) < 14 && Math.abs(by - ship.y) < 22) {
        b.taken = true;
        resonance = Math.min(1, resonance + 0.04);
        points += 3;
        note(by, 7);
        if (window.Flow) Flow.hit(bx, by, true);
        for (let i = 0; i < 8; i++) {
          const a = Math.random() * Math.PI * 2;
          sparks.push({ x: bx, y: by, vx: Math.cos(a) * 60 - SPEED * 0.3, vy: Math.sin(a) * 60, life: 1 });
        }
      }
    }
    beads = beads.filter((b) => b.x - wx > -40 && !b.taken);
    for (let i = sparks.length - 1; i >= 0; i--) {
      const p = sparks[i];
      p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt * 1.4;
      if (p.life <= 0) sparks.splice(i, 1);
    }
  }

  function mix(a, b, k) {
    const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
    const c = (s) => Math.round(((pa >> s) & 255) + ((((pb >> s) & 255) - ((pa >> s) & 255)) * k));
    return `rgb(${c(16)},${c(8)},${c(0)})`;
  }

  function draw() {
    const e0 = Math.floor(skyPos), k = skyPos - e0;
    const A = SKIES[e0 % SKIES.length], B = SKIES[(e0 + 1) % SKIES.length];
    const ease = k * k * (3 - 2 * k);
    const bg = g.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, mix(A.top, B.top, ease));
    bg.addColorStop(0.55, mix(A.mid, B.mid, ease));
    bg.addColorStop(1, mix(A.low, B.low, ease));
    g.fillStyle = bg; g.fillRect(0, 0, W, H);

    // Stars
    g.fillStyle = "rgba(230,235,255,0.5)";
    for (let i = 0; i < 70; i++) {
      const x = ((i * 137.5 - wx * 0.05) % W + W) % W;
      const y = (i * 71.3) % (H * 0.7);
      const tw = 0.6 + 0.4 * Math.sin(t * 1.5 + i);
      g.globalAlpha = 0.3 + tw * 0.4;
      g.fillRect(x, y, 1.6, 1.6);
    }
    g.globalAlpha = 1;

    // Aurora curtains that brighten with resonance
    const h1 = A.aur[0] + (B.aur[0] - A.aur[0]) * ease, h2 = A.aur[1] + (B.aur[1] - A.aur[1]) * ease;
    for (let band = 0; band < 2; band++) {
      const baseY = H * (0.22 + band * 0.16);
      g.beginPath();
      g.moveTo(0, baseY);
      for (let x = 0; x <= W; x += 24) {
        const y = baseY + Math.sin((x + wx * 0.2) * 0.006 + t * 0.4 + band) * 30 + Math.cos((x - wx * 0.1) * 0.013 - t * 0.3) * 14;
        g.lineTo(x, y);
      }
      g.lineTo(W, baseY + 170); g.lineTo(0, baseY + 170); g.closePath();
      const ag = g.createLinearGradient(0, baseY - 30, 0, baseY + 170);
      ag.addColorStop(0, `hsla(${band ? h2 : h1}, 85%, 65%, ${0.06 + resonance * 0.16})`);
      ag.addColorStop(1, `hsla(${band ? h2 : h1}, 85%, 65%, 0)`);
      g.fillStyle = ag; g.fill();
    }

    // Parallax hills
    for (let layer = 0; layer < 2; layer++) {
      const par = layer ? 0.45 : 0.22;
      g.fillStyle = layer ? "rgba(5,6,14,0.75)" : "rgba(12,12,28,0.6)";
      g.beginPath(); g.moveTo(0, H);
      for (let x = 0; x <= W; x += 16) {
        const wx2 = x + wx * par;
        const y = H - (layer ? 40 : 80) - Math.sin(wx2 * 0.004 + layer) * 26 - Math.sin(wx2 * 0.011) * 12;
        g.lineTo(x, y);
      }
      g.lineTo(W, H); g.closePath(); g.fill();
    }

    // The harmonic ribbon
    g.lineCap = "round";
    for (const pass of [{ w: 18, a: 0.08 + resonance * 0.1 }, { w: 3, a: 0.35 + resonance * 0.45 }]) {
      g.strokeStyle = `hsla(${h1}, 85%, 72%, ${pass.a})`;
      g.lineWidth = pass.w;
      g.beginPath();
      for (let x = 0; x <= W; x += 12) {
        const y = ribbonY(wx + x);
        if (x === 0) g.moveTo(x, y); else g.lineTo(x, y);
      }
      g.stroke();
    }

    for (const b of beads) {
      const bx = b.x - wx, by = ribbonY(b.x);
      const pulse = 4 + Math.sin(t * 6 + b.x) * 1.2;
      g.fillStyle = `hsla(${h2}, 90%, 80%, 0.25)`;
      g.beginPath(); g.arc(bx, by, pulse * 2.6, 0, Math.PI * 2); g.fill();
      g.fillStyle = "#fff6dd";
      g.beginPath(); g.arc(bx, by, pulse, 0, Math.PI * 2); g.fill();
    }

    for (let i = 1; i < ship.trail.length; i++) {
      const a = ship.trail[i - 1], b = ship.trail[i];
      g.strokeStyle = `hsla(${h1}, 90%, 75%, ${(1 - i / ship.trail.length) * (0.3 + resonance * 0.5)})`;
      g.lineWidth = 6 * (1 - i / ship.trail.length) + 1;
      g.beginPath(); g.moveTo(a.x, a.y); g.lineTo(b.x, b.y); g.stroke();
    }
    for (const p of sparks) {
      g.fillStyle = `rgba(255,240,210,${p.life})`;
      g.fillRect(p.x - 1.5, p.y - 1.5, 3, 3);
    }

    // The glider
    const sx = shipX();
    g.save(); g.translate(sx, ship.y); g.rotate(Math.max(-0.5, Math.min(0.55, ship.vy / 600)));
    const halo = g.createRadialGradient(0, 0, 2, 0, 0, 26 + resonance * 14);
    halo.addColorStop(0, `hsla(${h1}, 90%, 80%, 0.55)`);
    halo.addColorStop(1, `hsla(${h1}, 90%, 80%, 0)`);
    g.fillStyle = halo; g.beginPath(); g.arc(0, 0, 26 + resonance * 14, 0, Math.PI * 2); g.fill();
    g.fillStyle = "#f4f7ff";
    g.beginPath(); g.moveTo(14, 0); g.lineTo(-10, -8); g.lineTo(-5, 0); g.lineTo(-10, 8); g.closePath(); g.fill();
    g.restore();

    // Whisper-quiet HUD: the sky's name and a thin resonance line
    g.font = "600 11px system-ui, sans-serif"; g.textAlign = "left";
    g.fillStyle = "rgba(255,255,255,0.4)";
    g.fillText((ease > 0.5 ? B : A).name.toUpperCase(), 14, 22);
    g.fillStyle = "rgba(255,255,255,0.12)"; g.fillRect(14, 30, 90, 3);
    g.fillStyle = `hsla(${h1}, 90%, 75%, 0.8)`; g.fillRect(14, 30, 90 * resonance, 3);
    if (t < 12 && lastInput < 0) {
      g.textAlign = "center"; g.fillStyle = "rgba(255,255,255,0.45)"; g.font = "600 13px system-ui, sans-serif";
      g.fillText("tap / space to lift · swipe down / ↓ to dip · ride the ribbon", W / 2, H - 22);
    }
  }

  let last = performance.now();
  function frame(now) {
    if (window.Flow && Flow.away && now - last < 100) { requestAnimationFrame(frame); return; }
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    update(dt); draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
