<!DOCTYPE html>
<html lang="en">
<head>
<script src="flow-layer.js" data-mode="toy"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Breathing Glowsand</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#07051a}
  canvas{display:block;width:100vw;height:100vh;touch-action:none;cursor:pointer}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function(){
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W=0,H=0,dpr=1,N=0,hx,hy,px,py,vx,vy,heat,tint,grain=3,rMax=80,cx=0,cy=0;
let tray={x:0,y:0,w:0,h:0,r:20},bg=null,stars=[];
const presses=[],byId=new Map(),ripples=[];
let hover=null,hoverDist=0,lastInput=performance.now(),nextGhost=0,hintA=1,hintUsed=false;
let t=0,lastDraw=0;
const NB=16,buckets=[],counts=new Int32Array(NB);

function note(d,o){try{if(window.Flow&&Flow.note)Flow.note(Math.max(0,Math.min(13,d|0)),o);}catch(e){}}
function hit(x,y){try{if(window.Flow&&Flow.hit)Flow.hit(x,y,true);}catch(e){}}

function resize(){
  dpr=Math.min(2,window.devicePixelRatio||1);
  W=window.innerWidth;H=window.innerHeight;
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#0a0722');bg.addColorStop(.55,'#150b30');bg.addColorStop(1,'#1f0d35');
  const m=Math.min(W,H)*0.06;
  tray={x:m,y:m,w:W-2*m,h:H-2*m,r:Math.min(W,H)*0.08};
  cx=W/2;cy=H/2;rMax=Math.min(W,H)*0.17+20;
  stars=[];
  const sc=Math.round(W*H/9000);
  for(let i=0;i<sc;i++)stars.push({x:Math.random()*W,y:Math.random()*H,s:Math.random()*1.2+.3,p:Math.random()*6.28});
  build();
}

function insideTray(x,y){
  const T=tray,r=T.r;
  if(x<T.x||x>T.x+T.w||y<T.y||y>T.y+T.h)return false;
  const qx=Math.max(T.x+r-x,0,x-(T.x+T.w-r)),qy=Math.max(T.y+r-y,0,y-(T.y+T.h-r));
  return qx*qx+qy*qy<=r*r;
}

function build(){
  const area=tray.w*tray.h;
  const s=Math.max(6,Math.sqrt(area/3800));
  grain=Math.max(1.6,s*0.42);
  const pts=[];
  for(let y=tray.y+s*.6;y<tray.y+tray.h;y+=s*.87){
    const off=(Math.round((y-tray.y)/(s*.87))%2)*s*.5;
    for(let x=tray.x+s*.6+off;x<tray.x+tray.w;x+=s){
      const jx=x+(Math.random()-.5)*s*.5,jy=y+(Math.random()-.5)*s*.5;
      if(insideTray(jx,jy))pts.push(jx,jy);
    }
  }
  N=pts.length/2;
  hx=new Float32Array(N);hy=new Float32Array(N);px=new Float32Array(N);py=new Float32Array(N);
  vx=new Float32Array(N);vy=new Float32Array(N);heat=new Float32Array(N);tint=new Uint8Array(N);
  for(let i=0;i<N;i++){
    hx[i]=px[i]=pts[i*2];hy[i]=py[i]=pts[i*2+1];
    const n=Math.sin(hx[i]*.012+hy[i]*.008)+Math.sin(hy[i]*.017-hx[i]*.006);
    tint[i]=(n+Math.random()*.9>.45)?1:0;
  }
  for(let b=0;b<NB;b++)buckets[b]=new Int32Array(N);
}

function press(id,x,y,ghost){
  const p={id,x,y,r:0,held:0,down:true,step:0,ghost:!!ghost,auto:ghost?(0.7+Math.random()*0.9):0};
  presses.push(p);if(id!=null)byId.set(id,p);
  note(1+Math.floor(Math.random()*3),{vol:ghost?.05:.22,dur:.7,type:'sine'});
  return p;
}

function release(p){
  if(!p||!p.down)return;
  p.down=false;
  if(p.id!=null)byId.delete(p.id);
  const f=Math.min(1,p.r/rMax),q=p.ghost?.25:1;
  ripples.push({x:p.x,y:p.y,r:p.r*.5,amp:(1+2.4*f)*(p.ghost?.5:1)});
  if(!p.ghost)hit(p.x,p.y);
  const d=7+Math.round((1-f)*5);
  note(d,{vol:(.14+.14*f)*q,dur:1.4,type:'sine'});
  setTimeout(()=>note(d-2,{vol:(.1+.1*f)*q,dur:1.6,type:'triangle'}),150);
  if(f>.6)setTimeout(()=>note(d-4,{vol:.09*q,dur:2,type:'sine'}),320);
}

function used(){lastInput=performance.now();hintUsed=true;}

cv.addEventListener('pointerdown',e=>{
  e.preventDefault();used();
  try{cv.setPointerCapture(e.pointerId);}catch(_){}
  press(e.pointerId,e.clientX,e.clientY,false);
});
cv.addEventListener('pointermove',e=>{
  e.preventDefault();
  const p=byId.get(e.pointerId);
  if(p){p.x=e.clientX;p.y=e.clientY;lastInput=performance.now();return;}
  if(e.pointerType==='mouse'){
    if(hover){hoverDist+=Math.hypot(e.clientX-hover.x,e.clientY-hover.y);}
    hover={x:e.clientX,y:e.clientY,life:1};
    lastInput=performance.now();
    if(hoverDist>240){hoverDist=0;note(7+Math.floor((1-e.clientY/H)*6),{vol:.04,dur:.8,type:'sine'});}
  }
});
function up(e){e.preventDefault();release(byId.get(e.pointerId));}
cv.addEventListener('pointerup',up);
cv.addEventListener('pointercancel',up);
cv.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse')hover=null;});
let spaceP=null;
window.addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();if(e.repeat||spaceP)return;used();
    spaceP=press('space',cx+(Math.random()-.5)*tray.w*.4,cy+(Math.random()-.5)*tray.h*.4,false);}
});
window.addEventListener('keyup',e=>{if(e.code==='Space'){e.preventDefault();release(spaceP);spaceP=null;}});
window.addEventListener('resize',resize);

function colors(b){
  const out=[];
  for(let tn=0;tn<2;tn++)for(let h=0;h<8;h++){
    const k=h/7;
    const hue=tn?(270+k*60):(185+k*135);
    const l=38+k*36+b*4,a=.5+k*.5+b*.06;
    out[tn*8+h]=`hsla(${hue.toFixed(0)},95%,${l.toFixed(0)}%,${Math.min(1,a).toFixed(2)})`;
  }
  return out;
}

function step(now){
  requestAnimationFrame(step);
  const away=!!(window.Flow&&Flow.away);
  if(away&&now-lastDraw<100)return;
  lastDraw=now;t+=1/60;

  const br=Math.sin(t*Math.PI*2/6.5);
  const scale=1+0.013*br;

  // idle ghost presses
  if(now-lastInput>5000&&now>nextGhost){
    nextGhost=now+4000+Math.random()*4000;
    press(null,tray.x+tray.w*(.2+Math.random()*.6),tray.y+tray.h*(.2+Math.random()*.6),true);
  }

  // presses
  for(let i=presses.length-1;i>=0;i--){
    const p=presses[i];
    if(p.down){
      p.held+=1/60;
      const tgt=rMax*(p.ghost?.45:1)*(1-Math.exp(-p.held*1.1));
      p.r+=(tgt-p.r)*.12;
      const s=Math.floor(p.r/rMax*5);
      if(s>p.step){p.step=s;note(3+s,{vol:p.ghost?.03:.07,dur:.9,type:'sine'});}
      if(p.ghost){p.auto-=1/60;if(p.auto<=0)release(p);}
    }else{p.r*=.9;if(p.r<1)presses.splice(i,1);}
  }
  for(let i=ripples.length-1;i>=0;i--){
    const r=ripples[i];r.r+=2.4;r.amp*=.968;
    if(r.amp<.04)ripples.splice(i,1);
  }
  if(hover){hover.life*=.97;if(hover.life<.05)hover=null;}

  counts.fill(0);
  const K=.018,damp=.86,np=presses.length,nr=ripples.length;
  for(let i=0;i<N;i++){
    let x=px[i],y=py[i];
    const tx=cx+(hx[i]-cx)*scale,ty=cy+(hy[i]-cy)*scale;
    let ax=(tx-x)*K,ay=(ty-y)*K,h=heat[i];
    for(let j=0;j<np;j++){
      const p=presses[j],r=p.r;if(r<1)continue;
      const dx=x-p.x,dy=y-p.y,d2=dx*dx+dy*dy;
      if(d2<r*r){
        let d=Math.sqrt(d2),ux,uy;
        if(d<.01){const a=Math.random()*6.28;ux=Math.cos(a);uy=Math.sin(a);}else{ux=dx/d;uy=dy/d;}
        const push=(r-d)*.3;
        x+=ux*push;y+=uy*push;h+=push*.02;
      }
    }
    if(hover){
      const dx=x-hover.x,dy=y-hover.y,d2=dx*dx+dy*dy,hr=26*hover.life;
      if(d2<hr*hr&&d2>.01){const d=Math.sqrt(d2),push=(hr-d)*.2;x+=dx/d*push;y+=dy/d*push;h+=push*.015;}
    }
    for(let j=0;j<nr;j++){
      const r=ripples[j],dx=x-r.x,dy=y-r.y,d=Math.sqrt(dx*dx+dy*dy)+.001,diff=Math.abs(d-r.r);
      if(diff<16){const k=(1-diff/16)*r.amp*.35;ax+=dx/d*k;ay+=dy/d*k;h+=k*.04;}
    }
    let nvx=(vx[i]+ax)*damp,nvy=(vy[i]+ay)*damp;
    vx[i]=nvx;vy[i]=nvy;px[i]=x+nvx;py[i]=y+nvy;
    h=h>1?1:h*.991;heat[i]=h;
    const b=(h*8|0)>7?7:(h*8|0),bi=tint[i]*8+b;
    buckets[bi][counts[bi]++]=i;
  }

  // draw
  ctx.globalCompositeOperation='source-over';
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  for(const s of stars){
    ctx.fillStyle=`rgba(200,190,255,${(.25+.25*Math.sin(t*.8+s.p)).toFixed(2)})`;
    ctx.fillRect(s.x,s.y,s.s,s.s);
  }
  const T=tray;
  ctx.beginPath();ctx.roundRect?ctx.roundRect(T.x,T.y,T.w,T.h,T.r):ctx.rect(T.x,T.y,T.w,T.h);
  ctx.fillStyle='rgba(12,6,30,.85)';ctx.fill();
  const g=ctx.createRadialGradient(cx,cy,0,cx,cy,Math.max(T.w,T.h)*.7);
  g.addColorStop(0,`rgba(120,60,220,${(.1+.05*br).toFixed(3)})`);g.addColorStop(1,'rgba(40,10,80,0)');
  ctx.fillStyle=g;ctx.fill();
  ctx.save();
  ctx.shadowColor='rgba(180,90,255,.8)';ctx.shadowBlur=16+6*br;
  ctx.strokeStyle=`rgba(200,130,255,${(.4+.12*br).toFixed(2)})`;ctx.lineWidth=2;ctx.stroke();
  ctx.restore();

  ctx.globalCompositeOperation='lighter';
  const cols=colors(br);
  // glow pass for warm grains
  const gs=grain*3.2,go=gs/2;
  ctx.globalAlpha=.12;
  for(let bi=0;bi<NB;bi++){
    if((bi&7)<2)continue;
    const n=counts[bi],arr=buckets[bi];if(!n)continue;
    ctx.fillStyle=cols[bi];
    for(let k=0;k<n;k++){const i=arr[k];ctx.fillRect(px[i]-go,py[i]-go,gs,gs);}
  }
  ctx.globalAlpha=.75+.1*br;
  const go2=grain/2;
  for(let bi=0;bi<NB;bi++){
    const n=counts[bi],arr=buckets[bi];if(!n)continue;
    ctx.fillStyle=cols[bi];
    for(let k=0;k<n;k++){const i=arr[k];ctx.fillRect(px[i]-go2,py[i]-go2,grain,grain);}
  }
  ctx.globalAlpha=1;

  // press glows
  for(const p of presses){
    if(p.r<2)continue;
    const a=p.down?.35:.35*(p.r/rMax);
    const rg=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*1.3);
    rg.addColorStop(0,`rgba(255,110,220,${(a*.5).toFixed(3)})`);
    rg.addColorStop(.7,`rgba(120,80,255,${(a*.25).toFixed(3)})`);
    rg.addColorStop(1,'rgba(60,20,120,0)');
    ctx.fillStyle=rg;ctx.beginPath();ctx.arc(p.x,p.y,p.r*1.3,0,6.283);ctx.fill();
  }
  for(const r of ripples){
    ctx.strokeStyle=`rgba(140,230,255,${Math.min(.3,r.amp*.08).toFixed(3)})`;
    ctx.lineWidth=2;ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,6.283);ctx.stroke();
  }
  ctx.globalCompositeOperation='source-over';

  if(hintUsed)hintA*=.96;
  if(hintA>.02){
    ctx.fillStyle=`rgba(220,200,255,${(hintA*(.45+.15*br)).toFixed(3)})`;
    ctx.font=`${Math.max(12,Math.min(16,W/26))}px system-ui,sans-serif`;
    ctx.textAlign='center';
    ctx.fillText('press & hold the sand · let go to breathe out',W/2,T.y+T.h-Math.max(18,T.r*.6));
  }
}

resize();
nextGhost=performance.now()+2500;
requestAnimationFrame(step);
})();
</script>
</body>
</html>
