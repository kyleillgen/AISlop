<!DOCTYPE html>
<html lang="en">
<head>
<script src="flow-layer.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Glimmerwing</title>
<style>
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#120a24}
canvas{display:block;width:100vw;height:100vh;touch-action:none;user-select:none;-webkit-user-select:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function(){
"use strict";
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W=0,H=0,M=1,dpr=1;
const COLS=['#ff7ac8','#7dffd0','#ffe66d','#b69cff','#ffb38a','#7cd4ff'];
const TAU=Math.PI*2;
function resize(){
  dpr=Math.min(2,window.devicePixelRatio||1);
  W=window.innerWidth;H=window.innerHeight;M=Math.min(W,H);
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  if(bird){bird.x=Math.min(Math.max(bird.x,10),W-10);bird.y=Math.min(Math.max(bird.y,10),H-10);}
  if(blossom){blossom.x=Math.min(Math.max(blossom.x,40),W-40);blossom.y=Math.min(Math.max(blossom.y,60),H-40);}
}
let bird=null,blossom=null;
window.addEventListener('resize',resize);
resize();

// ---------- storage ----------
let best=0;
try{best=parseInt(localStorage.getItem('glimmerwing_best')||'0',10)||0;}catch(e){}
function saveBest(){try{localStorage.setItem('glimmerwing_best',String(best));}catch(e){}}

// ---------- audio ----------
// All sound comes from Flow's engine: each sugarling you gather plays a rising note on
// Flow's 16th grid, a delivered bouquet plays its harmony and then an arpeggio as the
// motes fly in one per 16th, and a scattering wisp plays its soft cushion.
function initAudio(){}
const beatSec=()=>window.Flow?Flow.beat:0.55;
// The light breathes on the calibrated beat
const beatPulse=()=>window.Flow?Math.pow(1-(((Flow.beatPos%1)+1)%1),3):0;

// ---------- state ----------
let state='start',overAt=0,score=0,t=0,L=1,R=100,group=[],free=[],flying=[],wisps=[],parts=[],texts=[],hist=[],invuln=0;
const bokeh=[];
for(let i=0;i<40;i++)bokeh.push({x:Math.random(),y:Math.random(),r:4+Math.random()*22,c:COLS[i%6],s:0.004+Math.random()*0.01,p:Math.random()*TAU});

function newBird(){bird={x:W/2,y:H/2,vx:0,vy:0,face:1,tilt:0,flap:0};hist=[{x:bird.x,y:bird.y}];}
newBird();

function rand(a,b){return a+Math.random()*(b-a);}
function d2(ax,ay,bx,by){const dx=ax-bx,dy=ay-by;return dx*dx+dy*dy;}

function placeBlossom(){
  let x,y,k=0;
  do{x=rand(50,W-50);y=rand(80,H-50);k++;}while(k<40&&d2(x,y,bird.x,bird.y)<(M*0.38)**2);
  blossom={x,y,a:0,pulse:0};
}
function spawnMote(){
  let x,y,k=0;
  do{x=rand(30,W-30);y=rand(60,H-30);k++;}
  while(k<40&&(d2(x,y,bird.x,bird.y)<(M*0.25)**2||(blossom&&d2(x,y,blossom.x,blossom.y)<(M*0.15)**2)));
  free.push({x,y,vx:0,vy:0,c:COLS[(Math.random()*6)|0],p:Math.random()*TAU,a:0});
}
function start(){
  state='play';score=0;t=0;L=1;group=[];free=[];flying=[];wisps=[];parts=[];texts=[];invuln=0;
  newBird();R=lightRadius();placeBlossom();
  for(let i=0;i<7;i++)spawnMote();
  window.Flow&&Flow.reset();
  window.Flow&&Flow.score(0);
}
function gameOver(){
  state='over';overAt=performance.now();
  if(score>best){best=score;saveBest();}
  window.Flow&&Flow.miss();
  // gently release the group
  for(const m of group){const a=Math.random()*TAU;m.vx=Math.cos(a)*80;m.vy=Math.sin(a)*80;free.push(m);}
  group=[];
}
function tryStart(){
  if(state==='play')return;
  if(state==='over'&&performance.now()-overAt<600)return;
  start();
}
function lightRadius(){return M*(0.1+0.36*Math.max(0,L));}

// ---------- input ----------
const ptr={active:false,x:0,y:0};
const keys={};
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();initAudio();
  if(ac&&ac.state==='suspended')ac.resume();
  ptr.active=true;ptr.x=e.clientX;ptr.y=e.clientY;
  if(state!=='play')tryStart();
});
cv.addEventListener('pointermove',e=>{
  e.preventDefault();
  if(ptr.active||e.pointerType==='mouse'){ptr.active=true;ptr.x=e.clientX;ptr.y=e.clientY;}
});
function up(e){if(e.pointerType!=='mouse')ptr.active=false;}
cv.addEventListener('pointerup',up);
cv.addEventListener('pointercancel',up);
cv.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse')ptr.active=false;});
const KMAP={ArrowLeft:'l',KeyA:'l',ArrowRight:'r',KeyD:'r',ArrowUp:'u',KeyW:'u',ArrowDown:'d',KeyS:'d'};
window.addEventListener('keydown',e=>{
  const k=KMAP[e.code];
  if(k){keys[k]=true;ptr.active=false;e.preventDefault();}
  if(e.code==='Space'||e.code==='Enter'){
    e.preventDefault();
    if(e.repeat)return;
    initAudio();
    if(state!=='play')tryStart();
  }
});
window.addEventListener('keyup',e=>{const k=KMAP[e.code];if(k)keys[k]=false;});
window.addEventListener('blur',()=>{for(const k in keys)keys[k]=false;});

// ---------- effects ----------
function pop(x,y,c,big){
  parts.push({ring:true,x,y,r:4,max:big?46:28,life:1,c});
  const n=big?10:6;
  for(let i=0;i<n;i++){const a=i/n*TAU+Math.random()*0.4,s=rand(60,big?190:130);
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,c,r:rand(2,4)});}
}
function floatText(x,y,s,c){texts.push({x,y,s,c,life:1});}

// ---------- update ----------
function update(dt){
  // bird motion (also idle on start screen)
  const maxS=M*1.15;
  if(state==='play'){
    let kx=(keys.r?1:0)-(keys.l?1:0),ky=(keys.d?1:0)-(keys.u?1:0);
    if(kx||ky){
      const l=Math.hypot(kx,ky);kx/=l;ky/=l;
      bird.vx+=kx*maxS*3*dt;bird.vy+=ky*maxS*3*dt;
    }else if(ptr.active){
      let dx=(ptr.x-bird.x)*5,dy=(ptr.y-bird.y)*5;const l=Math.hypot(dx,dy);
      if(l>maxS){dx*=maxS/l;dy*=maxS/l;}
      const k=Math.min(1,dt*7);bird.vx+=(dx-bird.vx)*k;bird.vy+=(dy-bird.vy)*k;
    }
    const damp=Math.pow(0.35,dt);bird.vx*=damp;bird.vy*=damp;
    const sp=Math.hypot(bird.vx,bird.vy);
    if(sp>maxS){bird.vx*=maxS/sp;bird.vy*=maxS/sp;}
  }else{
    bird.vx=Math.cos(performance.now()/900)*40;bird.vy=Math.sin(performance.now()/600)*25;
  }
  bird.x+=bird.vx*dt;bird.y+=bird.vy*dt;
  if(bird.x<14){bird.x=14;bird.vx=Math.abs(bird.vx)*0.5;}
  if(bird.x>W-14){bird.x=W-14;bird.vx=-Math.abs(bird.vx)*0.5;}
  if(bird.y<14){bird.y=14;bird.vy=Math.abs(bird.vy)*0.5;}
  if(bird.y>H-14){bird.y=H-14;bird.vy=-Math.abs(bird.vy)*0.5;}
  const speed=Math.hypot(bird.vx,bird.vy);
  if(Math.abs(bird.vx)>15){const f=bird.vx>0?1:-1;bird.face+=(f-bird.face)*Math.min(1,dt*10);}
  const tt=Math.max(-1,Math.min(1,bird.vy/maxS))*0.6;bird.tilt+=(tt-bird.tilt)*Math.min(1,dt*8);
  bird.flap+=dt*(40+speed*0.03);

  // trail history
  const last=hist[hist.length-1];
  if(d2(last.x,last.y,bird.x,bird.y)>9){hist.push({x:bird.x,y:bird.y});}
  const maxH=group.length*5+30;
  if(hist.length>maxH)hist.splice(0,hist.length-maxH);

  if(state==='play'){
    t+=dt;
    // light
    const sf=Math.min(1,speed/(M*0.55));
    const drain=0.07; // steady, never escalating
    L+=(sf*0.115-drain)*dt;
    if(L>1)L=1;
    if(L<=0){L=0;gameOver();}
    if(invuln>0)invuln-=dt;
  }else if(state==='start'){L=0.8;}
  const Rt=lightRadius();R+=(Rt-R)*Math.min(1,dt*6);

  // free motes
  const target=Math.min(12,7+Math.floor(t/30));
  if(state==='play'&&free.length+group.length<target+group.length*0&&free.length<target)spawnMote();
  for(let i=free.length-1;i>=0;i--){
    const m=free[i];
    m.p+=dt*2;m.a=Math.min(1,m.a+dt*1.5);
    m.x+=m.vx*dt;m.y+=m.vy*dt+Math.sin(m.p)*6*dt;
    m.vx*=Math.pow(0.2,dt);m.vy*=Math.pow(0.2,dt);
    m.x=Math.min(Math.max(m.x,12),W-12);m.y=Math.min(Math.max(m.y,12),H-12);
    if(state==='play'&&m.a>0.5&&d2(m.x,m.y,bird.x,bird.y)<(M*0.05+16)**2){
      free.splice(i,1);group.push(m);
      pop(m.x,m.y,m.c,false);
      window.Flow&&Flow.note(Math.min(13,2+group.length));
    }
  }
  // group follows the trail
  for(let i=0;i<group.length;i++){
    const m=group[i];m.p+=dt*3;
    const idx=hist.length-1-(i+1)*5;
    const p=idx>=0?hist[idx]:hist[0];
    const tx=p.x+Math.cos(m.p+i)*4,ty=p.y+Math.sin(m.p*1.3+i)*4;
    const k=Math.min(1,dt*9);m.x+=(tx-m.x)*k;m.y+=(ty-m.y)*k;
  }
  // blossom delivery
  if(blossom){
    blossom.a+=dt;blossom.pulse=Math.max(0,blossom.pulse-dt*2);
    if(state==='play'&&group.length>0&&d2(blossom.x,blossom.y,bird.x,bird.y)<(M*0.06+26)**2){
      const n=group.length,mult=1+Math.floor(n/5);
      // One mote per 16th note, so the bouquet lands as an arpeggio in time
      group.forEach((m,i)=>{m.delay=i*beatSec()/4;m.mult=mult;m.i=i;flying.push(m);});
      window.Flow&&Flow.hit(blossom.x,blossom.y);
      group=[];
      L=Math.min(1,L+0.14+0.035*n);
      if(n>=5)floatText(blossom.x,blossom.y-40,'×'+mult+' bouquet!','#ffe66d');
      blossom.pulse=1;
      blossom.next=0.9;
    }
    if(blossom.next!==undefined){blossom.next-=dt;if(blossom.next<=0&&flying.length===0){placeBlossom();}}
  }
  // flying into blossom
  for(let i=flying.length-1;i>=0;i--){
    const m=flying[i];
    if(m.delay>0){m.delay-=dt;continue;}
    const k=Math.min(1,dt*10);m.x+=(blossom.x-m.x)*k;m.y+=(blossom.y-m.y)*k;
    if(d2(m.x,m.y,blossom.x,blossom.y)<36){
      flying.splice(i,1);
      score+=m.mult;
      pop(blossom.x+rand(-8,8),blossom.y+rand(-8,8),m.c,true);
      floatText(blossom.x+rand(-20,20),blossom.y-20,'+'+m.mult,m.c);
      window.Flow&&Flow.score(score);
      window.Flow&&Flow.note(Math.min(13,7+(m.i||0)%7),{now:true});
      window.Flow&&Flow.hit(blossom.x,blossom.y,true);
      blossom.pulse=1;
    }
  }
  // wisps
  if(state==='play'){
    const wt=t>18?Math.min(4,1+Math.floor((t-18)/28)):0;
    if(wisps.length<wt){
      const side=(Math.random()*4)|0,r=M*0.045+10;
      let x=side===0?-r:side===1?W+r:rand(0,W),y=side===2?-r:side===3?H+r:rand(0,H);
      if(side<2)y=rand(0,H);
      const a=Math.atan2(H/2-y,W/2-x)+rand(-0.6,0.6),s=rand(28,48); // no speed ramp
      wisps.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r,p:Math.random()*TAU,a:0});
    }
  }
  for(const w of wisps){
    w.p+=dt;w.a=Math.min(1,w.a+dt*0.7);
    w.x+=w.vx*dt;w.y+=w.vy*dt;
    if(w.x<w.r&&w.vx<0||w.x>W-w.r&&w.vx>0)w.vx*=-1;
    if(w.y<w.r&&w.vy<0||w.y>H-w.r&&w.vy>0)w.vy*=-1;
    if(state==='play'&&invuln<=0&&w.a>0.8&&d2(w.x,w.y,bird.x,bird.y)<(w.r+12)**2){
      invuln=1.6;
      if(group.length){
        for(const m of group){const a=Math.atan2(m.y-w.y,m.x-w.x)+rand(-0.8,0.8),s=rand(160,280);
          m.vx=Math.cos(a)*s;m.vy=Math.sin(a)*s;m.a=0.2;free.push(m);}
        group=[];
        window.Flow&&Flow.miss();
      }
      const a=Math.atan2(bird.y-w.y,bird.x-w.x);bird.vx+=Math.cos(a)*200;bird.vy+=Math.sin(a)*200;
    }
  }
  // particles
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];
    if(p.ring){p.life-=dt*2.2;p.r+=(p.max-p.r)*Math.min(1,dt*8);}
    else{p.life-=dt*1.8;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=Math.pow(0.1,dt);p.vy*=Math.pow(0.1,dt);}
    if(p.life<=0)parts.splice(i,1);
  }
  for(let i=texts.length-1;i>=0;i--){const tx=texts[i];tx.life-=dt*0.9;tx.y-=dt*30;if(tx.life<=0)texts.splice(i,1);}
}

// ---------- draw ----------
function glow(x,y,r,c,a){
  const g=ctx.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0,c);g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.globalAlpha=a;ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();ctx.globalAlpha=1;
}
function drawMote(m,a,s){
  s=s||1;
  glow(m.x,m.y,16*s,m.c,0.55*a);
  ctx.globalAlpha=a;ctx.fillStyle=m.c;ctx.beginPath();ctx.arc(m.x,m.y,5.5*s,0,TAU);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.85)';ctx.beginPath();ctx.arc(m.x-1.6*s,m.y-1.8*s,2*s,0,TAU);ctx.fill();
  ctx.globalAlpha=1;
}
function drawBlossom(){
  if(!blossom)return;
  const b=blossom,s=Math.max(0.8,Math.min(1.4,M/600))*(1+b.pulse*0.18+Math.sin(b.a*2)*0.04);
  const fade=b.next!==undefined?Math.max(0,Math.min(1,b.next/0.4)):Math.min(1,b.a*2);
  if(b.next!==undefined&&b.next<=0)return;
  ctx.save();ctx.globalAlpha=fade;
  glow(b.x,b.y,70*s,'rgba(255,140,210,0.55)',1);
  ctx.translate(b.x,b.y);ctx.scale(s,s);ctx.rotate(b.a*0.3);
  for(let i=0;i<6;i++){
    ctx.save();ctx.rotate(i/6*TAU);
    const g=ctx.createLinearGradient(0,0,0,-28);
    g.addColorStop(0,'#ffd1ec');g.addColorStop(1,i%2?'#ff7ac8':'#ff9bd6');
    ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(0,-15,9,15,0,0,TAU);ctx.fill();
    ctx.restore();
  }
  const cg=ctx.createRadialGradient(-2,-2,1,0,0,9);cg.addColorStop(0,'#fff7c2');cg.addColorStop(1,'#ffc94d');
  ctx.fillStyle=cg;ctx.beginPath();ctx.arc(0,0,8,0,TAU);ctx.fill();
  ctx.restore();ctx.globalAlpha=1;
}
function drawBird(){
  const b=bird,s=Math.max(0.85,Math.min(1.35,M/600));
  ctx.save();ctx.translate(b.x,b.y);
  ctx.scale(s*(b.face>=0?Math.max(0.2,Math.abs(b.face)):-Math.max(0.2,Math.abs(b.face))),s);
  ctx.rotate(b.tilt);
  if(invuln>0&&state==='play')ctx.globalAlpha=0.55+0.45*Math.sin(invuln*20)**2;
  const fl=Math.sin(b.flap);
  // back wing
  ctx.save();ctx.translate(-2,-4);ctx.rotate(-0.5+fl*0.9);
  ctx.fillStyle='rgba(182,156,255,0.45)';ctx.beginPath();ctx.ellipse(-4,-12,5,14,-0.3,0,TAU);ctx.fill();ctx.restore();
  // tail
  ctx.fillStyle='#4fc9b0';ctx.beginPath();ctx.moveTo(-10,0);ctx.lineTo(-24,-6);ctx.lineTo(-22,2);ctx.lineTo(-25,7);ctx.closePath();ctx.fill();
  // body
  const g=ctx.createLinearGradient(0,-10,0,10);g.addColorStop(0,'#7dffd0');g.addColorStop(1,'#2fa58f');
  ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(0,1,14,8.5,0.1,0,TAU);ctx.fill();
  // throat
  ctx.fillStyle='#ff6fb8';ctx.beginPath();ctx.ellipse(8,3,6,4.5,0.3,0,TAU);ctx.fill();
  // head
  ctx.fillStyle='#5ee8c0';ctx.beginPath();ctx.arc(10,-3,7,0,TAU);ctx.fill();
  ctx.fillStyle='#1b1030';ctx.beginPath();ctx.arc(12.5,-4.5,1.8,0,TAU);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(13,-5.1,0.7,0,TAU);ctx.fill();
  // beak
  ctx.strokeStyle='#ffe0a0';ctx.lineWidth=2;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(16,-3);ctx.lineTo(31,-1);ctx.stroke();
  // front wing
  ctx.save();ctx.translate(-1,-4);ctx.rotate(-0.4-fl*0.9);
  const wg=ctx.createLinearGradient(0,0,0,-24);wg.addColorStop(0,'rgba(255,230,109,0.8)');wg.addColorStop(1,'rgba(255,122,200,0.35)');
  ctx.fillStyle=wg;ctx.beginPath();ctx.ellipse(-3,-12,5.5,14,-0.2,0,TAU);ctx.fill();ctx.restore();
  ctx.restore();ctx.globalAlpha=1;
}
function drawWisp(w){
  const a=w.a,wob=Math.sin(w.p*2)*0.08;
  ctx.save();ctx.globalAlpha=a;
  const g=ctx.createRadialGradient(w.x,w.y,w.r*0.2,w.x,w.y,w.r*1.5);
  g.addColorStop(0,'rgba(10,4,24,0.95)');g.addColorStop(0.6,'rgba(30,12,60,0.75)');g.addColorStop(1,'rgba(90,60,170,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(w.x,w.y,w.r*1.5*(1+wob),w.r*1.5*(1-wob),0,0,TAU);ctx.fill();
  ctx.strokeStyle='rgba(170,140,255,0.35)';ctx.lineWidth=2;
  ctx.beginPath();ctx.ellipse(w.x,w.y,w.r*(1+wob),w.r*(1-wob),0,0,TAU);ctx.stroke();
  ctx.fillStyle='rgba(200,180,255,0.7)';
  ctx.beginPath();ctx.arc(w.x-w.r*0.3,w.y-w.r*0.1,2.5,0,TAU);ctx.arc(w.x+w.r*0.3,w.y-w.r*0.1,2.5,0,TAU);ctx.fill();
  ctx.restore();
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function text(s,x,y,size,c,a){
  ctx.globalAlpha=a===undefined?1:a;ctx.fillStyle=c;
  ctx.font='700 '+size+'px system-ui,-apple-system,"Segoe UI",sans-serif';
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(s,x,y);ctx.globalAlpha=1;
}
function draw(now){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  // dusk sky
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#2a1650');bg.addColorStop(0.55,'#4a2370');bg.addColorStop(1,'#ff8fb3');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  for(const b of bokeh){
    const y=((b.y-now*b.s*0.00005)%1+1)%1;
    glow(b.x*W+Math.sin(now*0.0004+b.p)*12,y*H,b.r,b.c,0.25);
  }
  // darkness with a pool of light around the bird, breathing on the beat
  const R0=R;R=R0*(1+0.05*beatPulse());
  const dk=ctx.createRadialGradient(bird.x,bird.y,R*0.35,bird.x,bird.y,R);
  dk.addColorStop(0,'rgba(10,5,24,0)');dk.addColorStop(1,'rgba(10,5,24,0.9)');
  ctx.fillStyle=dk;ctx.fillRect(0,0,W,H);
  ctx.globalCompositeOperation='lighter';
  glow(bird.x,bird.y,R,'rgba(255,170,220,0.16)',1);
  ctx.globalCompositeOperation='source-over';
  ctx.strokeStyle='rgba(255,210,240,'+(0.12+(L<0.25?0.2*Math.sin(now*0.01)**2:0))+')';
  ctx.lineWidth=2;ctx.beginPath();ctx.arc(bird.x,bird.y,R,0,TAU);ctx.stroke();
  R=R0;

  drawBlossom();
  for(const m of free){
    const d=Math.sqrt(d2(m.x,m.y,bird.x,bird.y));
    const vis=d<R?1:Math.max(0.3,1-(d-R)/(M*0.4));
    drawMote(m,m.a*vis,0.9+Math.sin(m.p)*0.08);
  }
  for(const w of wisps)drawWisp(w);
  for(const m of flying)drawMote(m,1,1);
  for(let i=group.length-1;i>=0;i--)drawMote(group[i],1,1);
  drawBird();
  for(const p of parts){
    if(p.ring){ctx.globalAlpha=Math.max(0,p.life);ctx.strokeStyle=p.c;ctx.lineWidth=3*p.life+0.5;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,TAU);ctx.stroke();}
    else{ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r*p.life+0.5,0,TAU);ctx.fill();}
  }
  ctx.globalAlpha=1;
  for(const tx of texts)text(tx.s,tx.x,tx.y,18,tx.c,Math.max(0,tx.life));

  if(state==='play'){
    // HUD
    text(String(score),W/2,34,30,'#fff2fb');
    text('best '+best,W/2,60,13,'rgba(255,230,250,0.6)');
    const bw=Math.min(200,W*0.4),bx=W/2-bw/2,by=76;
    rr(bx,by,bw,8,4);ctx.fillStyle='rgba(255,255,255,0.12)';ctx.fill();
    if(L>0){const lg=ctx.createLinearGradient(bx,0,bx+bw,0);lg.addColorStop(0,'#ff7ac8');lg.addColorStop(0.5,'#ffe66d');lg.addColorStop(1,'#7dffd0');
      rr(bx,by,Math.max(8,bw*L),8,4);ctx.fillStyle=lg;ctx.fill();}
    if(group.length)text('×'+group.length,bird.x,bird.y-30*Math.max(0.85,Math.min(1.35,M/600)),14,'#fff7c2',0.9);
    if(t<5)text('keep moving to stay bright',W/2,H-40,15,'rgba(255,230,250,'+(1-t/5)*0.8+')');
  }else{
    ctx.fillStyle='rgba(18,8,36,0.45)';ctx.fillRect(0,0,W,H);
    const ts=Math.min(56,W*0.12);
    if(state==='start'){
      text('Glimmerwing',W/2,H*0.3,ts,'#ffd1ec');
      text('Steer with finger, mouse, arrows or WASD.',W/2,H*0.3+ts*0.9,Math.min(17,W*0.042),'#fff2fb',0.9);
      text('Keep moving to keep your light. Gather sugarlings',W/2,H*0.3+ts*0.9+26,Math.min(15,W*0.037),'#fff2fb',0.75);
      text('and bring them home to the blossom.',W/2,H*0.3+ts*0.9+46,Math.min(15,W*0.037),'#fff2fb',0.75);
      text('tap or press space',W/2,H*0.72,18,'#7dffd0',0.6+0.4*Math.sin(now*0.004)**2);
      if(best)text('best '+best,W/2,H*0.72+30,14,'rgba(255,230,250,0.6)');
    }else{
      text('your glow faded',W/2,H*0.3,Math.min(40,W*0.09),'#ffd1ec');
      text(String(score),W/2,H*0.3+ts*1.1,ts*1.2,'#fff2fb');
      text('best '+best,W/2,H*0.3+ts*1.1+ts*0.9,16,'rgba(255,230,250,0.7)');
      const ready=now-overAt>=600;
      text('tap to try again',W/2,H*0.72,18,'#7dffd0',ready?0.6+0.4*Math.sin(now*0.004)**2:0.25);
    }
  }
}

// ---------- loop ----------
let lastT=performance.now();
function frame(now){
  const dt=Math.min(0.033,Math.max(0,(now-lastT)/1000));lastT=now;
  update(dt);draw(now);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
