<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<link rel="icon" href="data:,">
<title>Word Rain</title>
</head>
<body>
<script src="flow-engine.js"></script>
<script src="pinball-skin.js"></script>
<script src="flow-shell.js"></script>
<script>
// Word Rain: words fall on the beat; type the lowest before it reaches the river.
// Built on the flow engine + shell; this file is only the game's rules and look.
(() => {
  "use strict";

  // Calm, common words, 3-7 letters
  const WORDS = (
    "rain moss tide fern reed dune cove glen mist dew pond lake reef cliff brook creek river stream delta marsh " +
    "cedar maple birch aspen willow alder oak pine elm ash yew larch spruce hazel holly ivy clover thyme sage mint " +
    "lily lotus poppy tulip iris daisy aster lilac orchid violet petal bloom seed root stem leaf bark twig acorn " +
    "ember flame spark glow lamp candle hearth smoke cloud storm thunder breeze gust wind calm still quiet hush " +
    "drift float glide sway swirl ripple wave swell crest shore sand stone pebble shell coral pearl amber jade " +
    "dawn dusk noon night moon star comet orbit solar lunar north south east west field meadow grove forest trail " +
    "path road bridge harbor island valley canyon summit ridge slope hill peak cave echo tone chord note tune song " +
    "hum beat pulse rhythm tempo flow focus mind think dream rest sleep wake breathe slow steady easy light soft " +
    "warm cool fresh clear bright gentle kind open free whole true clean plain simple small quick sharp deep wide " +
    "blue green gold silver copper rust indigo teal cyan plum olive cream ivory honey ink paper page " +
    "book word line verse rhyme story letter quill desk chair window door roof attic garden porch fence gate " +
    "kettle teapot mug bread butter apple pear fig lemon orange cherry berry melon grape peach " +
    "otter heron crane robin wren finch swift lark owl hawk fox deer hare badger beaver salmon trout seal whale " +
    "build code test merge ship patch fix bug loop byte cache queue stack array string commit branch deploy compile"
  ).split(" ");
  // Gel-lit night skies, like a 70s sci-fi planet set: indigo, green, magenta, ember
  const BG = [["#0d0930", "#3f1d8a"], ["#04170f", "#134a1d"], ["#1a0520", "#561034"], ["#1f0806", "#6a2508"]];
  const TOP_Y = 96;

  let words = [];
  let ripples = [];
  let rain = [];
  let beatsSinceSpawn = 99;
  let kick = 0;
  let ghostClock = 0;
  let recentLanes = [];
  let waterY = 0;

  const fontPx = (api) => (api.W < 520 ? 20 : 24);
  const tileW = (api) => Math.round(fontPx(api) * 0.95); // one drop target per letter
  const progressOf = (w, api) => (api.eng.beatPos() - w.spawnBeat) / w.fallBeats;
  const yOf = (w, api) => TOP_Y - 20 + Math.min(1, progressOf(w, api)) * (waterY - TOP_Y + 4);
  const letterX = (w, i, api) => {
    const cw = tileW(api);
    return w.x - (w.text.length * cw) / 2 + cw * (i + 0.5);
  };
  function activeWord() {
    let best = null;
    for (const w of words) if (w.state === "falling" && (!best || w.spawnBeat < best.spawnBeat)) best = w;
    return best;
  }
  const ripple = (x, size) => ripples.push({ x, r: 4, max: 40 + 50 * size, a: 0.8 });

  function spawnWord(beat, api) {
    let lane;
    do lane = Math.floor(Math.random() * 5);
    while (recentLanes.includes(lane));
    recentLanes = recentLanes.concat(lane).slice(-2);
    const margin = Math.min(110, api.W * 0.18);
    let text;
    // Intensity picks word length: chill keeps them short, intense goes long
    const [minLen, maxLen] = api.pick({ chill: [3, 5], normal: [3, 7], intense: [5, 7] });
    let tries = 0;
    do text = WORDS[Math.floor(Math.random() * WORDS.length)];
    while (((text.length < minLen || text.length > maxLen) || words.some((w) => w.text === text)) && ++tries < 60);
    // Assist slows the fall; fixed when the word appears, never changed once visible
    words.push({
      text,
      x: margin + ((lane + 0.5) / 5) * (api.W - margin * 2),
      spawnBeat: beat,
      fallBeats: Math.round(api.pick({ chill: 13, normal: 10, intense: 8 }) + 5 * api.eng.assist),
      golden: api.mode === "Golden Words", // worth a bonus for every letter
      typed: 0,
      errors: 0,
      state: "falling",
      fade: 1,
      shake: 0,
      ghost: false,
      firstKeyMs: 0
    });
  }

  function complete(w, api, ghost) {
    w.state = "done";
    const y = yOf(w, api);
    for (let i = 0; i < w.text.length; i++) api.burst(letterX(w, i, api), y, ghost ? "#64748b" : api.color(), 2, 1);
    ripple(w.x, ghost ? 0.5 : 1);
    if (ghost) return;
    const perfect = w.errors === 0 && progressOf(w, api) < 0.6 && !w.gusted;
    // Handling time (first key to last, plus a moment to read) paces the next words
    const handleSec = w.firstKeyMs ? (performance.now() - w.firstKeyMs) / 1000 + 0.6 : undefined;
    api.score(1, perfect ? "PERFECT" : "CLEAN", handleSec);
    if (w.golden) {
      api.bonus(300 * w.text.length);
      api.burst(w.x, y, "#ffc400", 12, -1);
    }
    if (perfect) api.ring(w.x, y, api.color(), 60);
  }

  const api = FlowShell.mount({
    key: "wordRain",
    title: "Word Rain",
    hint: "Type the lowest word &middot; no need to fix typos",
    input: "type",
    tierNames: ["Finding your rhythm", "Steady rain", "Downpour", "Monsoon"],
    modes: ["Golden Words"],
    // Fidget: effects come from the word you're on (or mid-sky when none is falling)
    fidgetPoint: (api) => {
      const w = activeWord();
      return w ? { x: letterX(w, Math.min(w.typed, w.text.length - 1), api), y: yOf(w, api) } : { x: api.W / 2, y: api.H * 0.45 };
    },
    engine: {
      // Keystrokes per beat: the typing stride. The in-between counts leave no gaps, so
      // any pace from ~120 to ~620 ms a key fits the 96-124 band.
      perBeat: [1, 1.25, 1.5, 1.75, 2, 2.5, 3, 3.5, 4],
      minMs: 60,
      maxMs: 900,
      stableTol: 2.5, // typing is raggeder than tapping
      idleSec: 4, // people pause to think while typing
      phaseFollow: false // keystrokes aren't aimed at the beat
    },

    setup() {
      for (let i = 0; i < 90; i++) rain.push({ x: Math.random() * 2000, y: Math.random() * 1200, len: 8 + Math.random() * 14, v: 380 + Math.random() * 260 });
    },
    resize(api) {
      waterY = Math.round(api.H - Math.max(70, api.H * 0.16));
    },
    start() {
      beatsSinceSpawn = 99; // first word on the next beat
    },

    onBeat(n, api) {
      kick = 1;
      beatsSinceSpawn++;
      const falling = words.filter((w) => w.state === "falling").length;
      if (beatsSinceSpawn >= api.eng.paceBeats() && falling < 4) {
        spawnWord(n, api);
        beatsSinceSpawn = 0;
      }
    },

    // Hold Space and let go: a gust lifts every falling word back up the sky (up to two beats of
    // fall). A breather you choose; a word that's been lifted can't be perfect, so it never pays.
    onRelease(api, held) {
      const c = api.chargeOf(held);
      if (c <= 0) return;
      const lift = 0.6 + 1.4 * c;
      for (const w of words) {
        if (w.state !== "falling") continue;
        w.spawnBeat = Math.min(api.eng.beatPos(), w.spawnBeat + lift);
        w.gusted = true;
        api.burst(w.x, yOf(w, api), "#f6e6c0", 3, -1);
      }
      api.ring(api.W / 2, api.H * 0.7, c > 0.85 ? "#ffc400" : api.color(), api.W * (0.25 + 0.3 * c));
      api.eng.pluck(0.2, 0.5 + 0.5 * c, 0.08);
    },

    onLetter(ch, api) {
      const w = activeWord();
      if (!w) return api.eng.tap({ note: false });
      // Fidget: any key types the right letter, so mashing the keyboard types the words out
      if (api.style === "fidget") ch = w.text[w.typed];
      if (ch === w.text[w.typed]) {
        if (w.typed === 0 || w.ghost) w.firstKeyMs = performance.now();
        (w.hitAt || (w.hitAt = []))[w.typed] = performance.now();
        w.typed++;
        w.ghost = false;
        // Each word climbs the scale as you type it
        api.eng.tap({ height: 0.85 - 0.7 * (w.typed / w.text.length) });
        api.burst(letterX(w, w.typed - 1, api), yOf(w, api) - 14, api.color(), 3, -1);
        if (w.typed === w.text.length) complete(w, api, false);
      } else {
        // A typo costs nothing: it still counts toward your rhythm, and there's nothing to fix
        api.eng.tap({ note: false });
        api.eng.error();
        api.hint("typos", "Typos don't count: no backspace, just keep going");
        w.errors++;
        w.shake = 0.22;
      }
    },

    // Autopilot: the lowest word types itself at three letters a beat; nothing scores
    autopilot(dt, api) {
      ghostClock += dt;
      const w = activeWord();
      if (w && ghostClock > api.eng.beatSec / 3) {
        ghostClock = 0;
        w.typed++;
        w.ghost = true;
        if (w.typed >= w.text.length) complete(w, api, true);
      }
    },

    onPhrase(api) {
      ripple(api.W / 2, 2.4);
    },

    update(dt, api) {
      kick = Math.max(0, kick - dt * 4.2);
      for (const w of words) {
        w.shake = Math.max(0, w.shake - dt);
        if (w.state === "falling" && progressOf(w, api) >= 1) {
          w.state = "sunk";
          ripple(w.x, 0.8);
          api.miss(); // ignored in autopilot, forgiven twice after taking over
        }
        if (w.state !== "falling") w.fade -= dt * 2.2;
      }
      words = words.filter((w) => w.fade > 0);
      const density = [40, 60, 75, 90][api.tier - 1];
      const slow = 1 - 0.3 * api.eng.ctrl.windDown;
      for (let i = 0; i < density; i++) {
        const d = rain[i];
        d.y += d.v * dt * slow;
        d.x -= (12 + api.tier * 3) * dt;
        if (d.y > waterY) {
          d.y = TOP_Y - 20 - Math.random() * 60;
          d.x = Math.random() * (api.W + 60);
        }
        if (d.x < -20) d.x += api.W + 40;
      }
      for (let i = ripples.length - 1; i >= 0; i--) {
        const r = ripples[i];
        r.r += (r.max - r.r) * dt * 2.6;
        r.a -= dt * 0.9;
        if (r.a <= 0) ripples.splice(i, 1);
      }
    },

    draw(ctx, api, t) {
      const { W, H, tier } = api;
      const col = api.color();
      ctx.fillStyle = api.cached("sky" + tier, () => {
        const g = ctx.createLinearGradient(0, 0, 0, H);
        g.addColorStop(0, BG[tier - 1][0]);
        g.addColorStop(1, BG[tier - 1][1]);
        return g;
      });
      ctx.fillRect(0, 0, W, H);

      // Rain: one path, thin and faint
      ctx.strokeStyle = `rgba(255, 220, 180, ${0.14 + kick * 0.08})`;
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (let i = 0; i < [40, 60, 75, 90][tier - 1]; i++) {
        const d = rain[i];
        ctx.moveTo(d.x, d.y);
        ctx.lineTo(d.x - 3, d.y + d.len);
      }
      ctx.stroke();

      // Water: a gently breathing surface
      ctx.fillStyle = api.cached("water", () => {
        const g = ctx.createLinearGradient(0, waterY, 0, H);
        g.addColorStop(0, "rgba(60, 20, 110, 0.55)");
        g.addColorStop(1, "rgba(10, 4, 24, 0.95)");
        return g;
      });
      ctx.beginPath();
      ctx.moveTo(0, H);
      for (let x = 0; x <= W + 24; x += 24) ctx.lineTo(x, waterY + Math.sin(x * 0.018 + t * 1.3) * (2 + kick * 1.5));
      ctx.lineTo(W, H);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = col;
      ctx.globalAlpha = 0.35 + kick * 0.2;
      ctx.lineWidth = 1.5;
      ctx.stroke();
      for (const r of ripples) {
        ctx.globalAlpha = Math.max(0, r.a);
        ctx.beginPath();
        ctx.ellipse(r.x, waterY + 4, r.r, r.r * 0.22, 0, 0, Math.PI * 2);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;

      // Words are banks of drop targets: a cream tile per letter that lights up when hit
      const px = fontPx(api);
      const cw = tileW(api);
      const th = Math.round(px * 1.25);
      ctx.font = `600 ${px}px Oswald, Impact, sans-serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.lineWidth = 2;
      ctx.strokeStyle = "#140f0c";
      const active = activeWord();
      for (const w of words) {
        const y = yOf(w, api);
        const isActive = w === active;
        const sx = w.shake > 0 && !api.reduced ? Math.sin(w.shake * 70) * 3 : 0;
        const alpha = w.state === "falling" ? (isActive ? 1 : 0.55) : Math.max(0, w.fade) * 0.7;
        const x0 = w.x - (w.text.length * cw) / 2 + sx;
        ctx.globalAlpha = alpha;
        if (isActive) {
          // A black rail under the bank you're on, with a yellow arrow pointing at it
          ctx.fillStyle = "#140f0c";
          ctx.fillRect(x0 - 4, y - th / 2 - 4, w.text.length * cw + 8, th + 8);
          ctx.fillStyle = "#ffc400";
          ctx.beginPath();
          ctx.moveTo(x0 - 16, y - 7);
          ctx.lineTo(x0 - 7, y);
          ctx.lineTo(x0 - 16, y + 7);
          ctx.fill();
        }
        for (let i = 0; i < w.text.length; i++) {
          const typed = i < w.typed;
          const tx = x0 + cw * i + 1;
          // A struck target punches in and springs back over ~150 ms
          const since = w.hitAt && w.hitAt[i] ? (performance.now() - w.hitAt[i]) / 150 : 1;
          const punch = since < 1 ? Math.sin(since * Math.PI) * 0.18 : 0;
          ctx.save();
          ctx.translate(tx + (cw - 2) / 2, y);
          ctx.scale(1 - punch, 1 - punch);
          ctx.translate(-(tx + (cw - 2) / 2), -y);
          ctx.fillStyle = typed ? (w.ghost ? "#8a7f6a" : col) : w.golden ? "#ffc400" : "#f6e6c0";
          ctx.fillRect(tx, y - th / 2, cw - 2, th);
          ctx.strokeRect(tx, y - th / 2, cw - 2, th);
          ctx.fillStyle = typed ? "#fff8e6" : "#140f0c";
          ctx.fillText(w.text[i].toUpperCase(), tx + (cw - 2) / 2, y + 1);
          ctx.restore();
        }
      }
      ctx.globalAlpha = 1;
      ctx.textBaseline = "alphabetic";
    }
  });

  // Read-only snapshot for automated play tests
  window.wordRainState = () => {
    const w = activeWord();
    return {
      active: w ? w.text.slice(w.typed) : null,
      onScreen: words.filter((x) => x.state === "falling").length,
      streak: api.eng.streak,
      tier: api.eng.tier,
      bpm: +api.eng.bpm.toFixed(1),
      locked: api.eng.locked,
      auto: api.eng.auto,
      spacingBeats: api.eng.paceBeats(),
      cleanRate: +api.eng.pacer.rate().toFixed(2),
      musicMix: +api.eng.synth.autoMix.toFixed(2), // 0 game arrangement, 1 drift
      chord: api.eng.synth.chordIndex
    };
  };
})();
</script>
</body>
</html>
