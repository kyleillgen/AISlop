<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<link rel="icon" href="data:,">
<title>Ricochet</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
<script src="flow-engine.js"></script>
<script src="pinball-skin.js"></script>
<script src="flow-shell.js"></script>
<script>
// Ricochet: a steel ball climbs a shaft between two rubber walls. It reaches a wall on a beat;
// kick as it gets there and it springs across to the other wall, higher up, landing on a beat
// again. Up and up, forever.
//
// Flow: a ring closes on the spot where the ball will meet the wall. The clean window is about
// ±0.24 beat and "perfect" is ±0.08 (about ±45 ms). Kicking early gives a flatter hop, late a
// loftier one. Miss and the ball slides down the rubber until a kicker fires it back across, a
// little lower: nothing is lost but a bit of height.
//
// Hold: a ball that reaches the wall while you're holding grips it. Let go and it's a super
// jump, two to four times the climb with a spin (a full charge goes furthest). Just for fun.
//
// Fidget: every press springs the ball off toward the other wall from wherever it is, so you can
// double-jump in mid-air; mash to climb as fast as you can press. A ball you leave alone grips
// the wall where it lands.
(() => {
  "use strict";

  const PERFECT = 0.08; // beats
  const TAU = Math.PI * 2;
  const BALL = 11;

  let path = null; // { segs: [...], side (the wall it ends on), whiffed, kind }
  let grip = null; // a ball holding the wall: { side, y }
  let camY = 0;
  let kick = 0;
  let spin = 0;
  let spinV = 0;
  let trail = [];
  let marks = []; // lights left on the walls where the ball landed cleanly: { side, y, a, perfect }
  let stars = []; // Star Ladder mode: { x, y, taken }
  let kickers = []; // where a slide was kicked back across: { side, y, a }
  let lastBall = [0, 0];
  let wallL = 0, wallR = 0;
  // Pop bumpers up the middle of the shaft: the ball arcs past them and they pop as it goes by
  const POP_STEP = 380;
  const popX = (k, api) => api.W / 2 + (k % 2 ? 46 : -46);
  const popped = new Map(); // bumper index -> pop (0..1)

  const win = (api) => api.pick({ chill: 0.3, normal: 0.24, intense: 0.17 }) + 0.06 * api.eng.assist;
  const pace = (api) => Math.max(2, Math.round(api.eng.paceBeats()));
  const wallX = (side) => (side ? wallR - BALL - 5 : wallL + BALL + 5);
  const climbFor = (beats) => 70 + 38 * beats;

  // Paths are short lists of segments in beat time: an arc (a real parabola between two points,
  // lifted by h at the middle) or a slide (straight, speeding up)
  function at(seg, now) {
    const u = Math.max(0, Math.min(1, (now - seg.t0) / Math.max(1e-6, seg.t1 - seg.t0)));
    if (seg.type === "slide") {
      const e = u * u;
      return [seg.x0 + (seg.x1 - seg.x0) * e, seg.y0 + (seg.y1 - seg.y0) * e];
    }
    return [seg.x0 + (seg.x1 - seg.x0) * u, seg.y0 + (seg.y1 - seg.y0) * u - seg.h * 4 * u * (1 - u)];
  }
  function ballAt(now) {
    if (grip) return [wallX(grip.side), grip.y];
    if (!path) return lastBall;
    for (const s of path.segs) if (now < s.t1) return at(s, Math.max(now, s.t0));
    const s = path.segs[path.segs.length - 1];
    return [s.x1, s.y1];
  }
  const arrival = () => (path ? path.segs[path.segs.length - 1].t1 : null);

  // A hop from (x, y) to the other wall, landing at t1. lift (-1 flat .. 1 lofty) shapes the arc
  function hop(api, x, y, t0, t1, opts) {
    opts = opts || {};
    const side = opts.side !== undefined ? opts.side : x < api.W / 2 ? 1 : 0;
    const beats = (t1 - t0) * (opts.secsBased ? 1 / api.eng.beatSec / 0.55 : 1);
    const climb = (opts.climb || climbFor(Math.min(4, beats))) * (opts.boost || 1);
    const y1 = y - climb;
    const h = (34 + 16 * Math.min(4, beats)) * (1 + 0.45 * (opts.lift || 0)) * (opts.boost ? 1.4 : 1);
    path = { segs: [{ type: "arc", x0: x, y0: y, x1: wallX(side), y1, t0, t1, h }], side, whiffed: false, kind: opts.kind || "hop", ghost: !!opts.ghost };
    grip = null;
    if (api.mode === "Star Ladder" && api.started && !opts.ghost) stars.push({ x: (x + wallX(side)) / 2, y: (y + y1) / 2 - h, taken: false });
  }

  // Missed: down the rubber, then a kicker fires it across, landing a little lower than it was
  function slide(api, now) {
    const side = path.side;
    const [x, y] = ballAt(now);
    const T = Math.ceil(now + 2.2);
    const yk = y + 60;
    const to = wallX(1 - side);
    path = {
      segs: [
        { type: "slide", x0: x, y0: y, x1: x, y1: yk, t0: now, t1: now + 0.6 },
        { type: "arc", x0: x, y0: yk, x1: to, y1: yk - climbFor(1) * 0.5, t0: now + 0.6, t1: T, h: 70, kicker: side }
      ],
      side: 1 - side,
      whiffed: false,
      kind: "slide",
      ghost: true
    };
  }

  const api = FlowShell.mount({
    key: "ricochet",
    title: "Ricochet",
    hint: "Tap to kick off the wall as the ball lands",
    vignette: false, // baked into the table layer
    input: "tap",
    tierNames: ["Finding your rhythm", "Climbing", "Skyward", "Pinball wizard"],
    modes: ["Star Ladder"],
    fidgetPoint: (api) => {
      const [x, y] = ballAt(api.eng.beatPos());
      return { x, y: y - camY };
    },
    engine: { perBeat: [0.25, 1 / 3, 0.5, 1], stableTol: 3, pacing: { minBeats: 2, startBeats: 3 } },

    setup(api) {
      wallL = Math.max(26, api.W / 2 - 170);
      wallR = Math.min(api.W - 26, api.W / 2 + 170);
      const now = api.eng.beatPos();
      camY = -api.H * 0.62;
      hop(api, wallX(0), 0, now, Math.ceil(now + 3), { ghost: true });
    },
    resize(api) {
      wallL = Math.max(26, api.W / 2 - 170);
      wallR = Math.min(api.W - 26, api.W / 2 + 170);
    },

    onBeat() {
      kick = 1;
    },

    onAction(api) {
      const now = api.eng.beatPos();
      if (api.style === "fidget") {
        api.eng.tap({ note: false });
        const [x, y] = ballAt(now);
        const secs = (0.5 - 0.2 * api.rev) * (0.9 + Math.random() * 0.2);
        const near = x < api.W / 2 ? 0 : 1;
        return hop(api, x, y, now, now + secs / api.eng.beatSec, { side: 1 - near, climb: 80 + 50 * api.rev, ghost: true, kind: "fidget" });
      }
      if (grip) {
        // Off the wall again: back into the rhythm, landing on a beat (not judged)
        api.eng.tap({ height: 0.5 });
        return hop(api, wallX(grip.side), grip.y, now, Math.ceil(now + pace(api)), { ghost: true });
      }
      const T = arrival();
      if (T === null || path.whiffed) return api.eng.tap({ note: false });
      const err = now - T;
      if (Math.abs(err) <= win(api)) {
        const perfect = Math.abs(err) < PERFECT;
        const [, y] = ballAt(T);
        api.eng.tap({ height: 0.5 - 0.35 * (err / win(api)) });
        if (!api.eng.auto) {
          api.score(1, perfect ? "PERFECT" : "CLEAN", api.eng.beatSec * 0.5);
          marks.push({ side: path.side, y, a: 1, perfect });
          if (perfect) api.ring(wallX(path.side), y - camY, api.color(), 46);
        }
        return hop(api, wallX(path.side), y, now, T + pace(api), { lift: Math.max(-1, Math.min(1, err / win(api))) });
      }
      api.eng.tap({ note: false });
      if (Math.abs(err) > 0.55) return;
      path.whiffed = true; // kicked at thin air: it'll slide when it gets there
      api.miss();
      api.hint("timing", "Kick as the ring closes on the wall");
    },

    // Let go after a hold: a super jump off the wall (or from anywhere in Fidget)
    onRelease(api, held) {
      const c = api.chargeOf(held);
      if (c <= 0) return;
      if (!grip && api.style !== "fidget") return;
      const now = api.eng.beatPos();
      const [x, y] = ballAt(now);
      const side = grip ? 1 - grip.side : x < api.W / 2 ? 1 : 0;
      const secs = 0.8 + 0.5 * c;
      const t1 = now + secs / api.eng.beatSec;
      hop(api, x, y, now, api.style === "fidget" ? t1 : Math.ceil(t1), { side, boost: 2 + 2 * c, ghost: true, kind: "super" });
      spinV = 18 + 22 * c;
      api.ring(x, y - camY, c > 0.85 ? "#ffc400" : api.color(), 50 + 50 * c);
      api.eng.pluck(0.2, 0.6, 0.1);
    },

    // Autopilot kicks exactly as the ball reaches the wall, and peels a gripping ball off; nothing scores
    autopilot(dt, api) {
      const now = api.eng.beatPos();
      if (grip) return hop(api, wallX(grip.side), grip.y, now, Math.ceil(now + pace(api)), { ghost: true });
      const T = arrival();
      if (T !== null && now >= T && !path.whiffed) {
        const [, y] = ballAt(T);
        hop(api, wallX(path.side), y, T, T + pace(api), { ghost: true });
      }
    },

    update(dt, api) {
      const now = api.eng.beatPos();
      kick = Math.max(0, kick - dt * 4.2);
      spin += spinV * dt;
      spinV *= Math.pow(0.15, dt);
      for (const m of marks) m.a -= dt * 0.12;
      marks = marks.filter((m) => m.a > 0);
      for (const k of kickers) k.a -= dt * 2;
      kickers = kickers.filter((k) => k.a > 0);

      if (path) {
        // The kicker fires as the slide ends
        for (const s of path.segs) {
          if (s.kicker !== undefined && !s.fired && now >= s.t0) {
            s.fired = true;
            kickers.push({ side: s.kicker, y: s.y0, a: 1 });
            api.eng.pluck(0.9, 0.3, 0.08);
          }
        }
        const T = arrival();
        if (now > T + (path.whiffed ? 0.02 : win(api))) {
          const [, y] = ballAt(T);
          if (api.style === "fidget" || api.charge > 0) {
            // Gripping the rubber: waits for you
            grip = { side: path.side, y };
            path = null;
            api.burst(wallX(grip.side), y - camY, "#f6e6c0", 3, -1);
          } else if (api.started) {
            if (!path.whiffed && !api.eng.auto) {
              api.miss();
              api.hint("timing", "Kick as the ring closes on the wall");
            }
            slide(api, now);
          }
        }
      }

      // Bumpers pop as the ball passes close
      const [px0, py0] = ballAt(now);
      const k0 = Math.round(py0 / POP_STEP);
      if (Math.hypot(px0 - popX(k0, api), py0 - k0 * POP_STEP) < 52 && !(popped.get(k0) > 0.5)) {
        popped.set(k0, 1);
        api.eng.pluck(0.45 + 0.3 * Math.random(), 0.25, 0.05);
        api.burst(popX(k0, api), k0 * POP_STEP - camY, "#ffc400", 4, -1);
      }
      for (const [k, v] of popped) v > 0.01 ? popped.set(k, v - dt * 2.5) : popped.delete(k);

      // Stars on the way: caught by a hop that passes close
      const [bx, by] = ballAt(now);
      for (const s of stars) {
        if (!s.taken && Math.hypot(bx - s.x, by - s.y) < 26) {
          s.taken = true;
          api.bonus(300);
          api.ring(s.x, s.y - camY, "#ffc400", 50);
          api.burst(s.x, s.y - camY, "#ffc400", 10, -1);
        }
      }
      stars = stars.filter((s) => !s.taken && s.y - camY < api.H + 60);

      // The camera keeps the ball low on the screen, climbing smoothly (never dropping far)
      const target = by - api.H * 0.62;
      camY += (target - camY) * Math.min(1, dt * (target < camY ? 3 : 1.2));
      lastBall = [bx, by];
      trail.unshift([bx, by]);
      if (trail.length > 10) trail.pop();
    },

    draw(ctx, api) {
      const { W, H, tier } = api;
      const Skin = PinballSkin;
      const now = api.eng.beatPos();
      const col = api.color();

      // The shaft: playfield between two walls of red rubber on steel rails, with dark aprons
      // outside them, baked once per size and tier
      Skin.layer(ctx, "ricochet" + tier + "|" + wallL + "," + wallR, W, H, (g) => {
        Skin.playfield(g, W, H, tier);
        for (const side of [0, 1]) {
          const x = side ? wallR : wallL;
          const m = side ? -1 : 1; // toward the shaft
          const apron = g.createLinearGradient(x, 0, side ? W : 0, 0);
          apron.addColorStop(0, "rgba(0,0,0,0.55)");
          apron.addColorStop(1, "rgba(0,0,0,0.3)");
          g.fillStyle = apron;
          g.fillRect(side ? x : 0, 0, side ? W - x : x, H);
          // A soft shadow the wall casts onto the shaft
          const sh = g.createLinearGradient(x, 0, x + m * 14, 0);
          sh.addColorStop(0, "rgba(0,0,0,0.35)");
          sh.addColorStop(1, "rgba(0,0,0,0)");
          g.fillStyle = sh;
          g.fillRect(side ? x - 14 : x, 0, 14, H);
          // The steel rail, then the rubber facing the shaft with a line of light along it
          g.fillStyle = "#6f685f";
          g.fillRect(side ? x : x - 3, 0, 3, H);
          g.fillStyle = "rgba(255,248,230,0.55)";
          g.fillRect(side ? x + 1 : x - 2, 0, 1, H);
          g.fillStyle = "#b3170f";
          g.fillRect(side ? x - 4 : x, 0, 4, H);
          g.fillStyle = "#e8231f";
          g.fillRect(side ? x - 3 : x, 0, 3, H);
          g.fillStyle = "rgba(255,190,175,0.55)";
          g.fillRect(side ? x - 4 : x + 3, 0, 1, H);
        }
      });

      // Arrow inserts scrolling down the middle of the shaft, every fourth lit with the beat
      const step = 110;
      Skin.column(ctx, "ricoIns" + col, W / 2, step * 4, camY + step / 2, H, 40, (g) => {
        for (let j = 1; j < 4; j++) Skin.insert(g, 0, j * step + step / 2, 10, col, 0);
      });
      for (let k = Math.floor(camY / step / 4) * 4; k * step - camY < H + step; k += 4) Skin.insert(ctx, W / 2, k * step - camY, 10, col, 0.25 + kick * 0.6);
      // Rubber posts along the walls
      for (const x of [wallL + 2, wallR - 2]) Skin.column(ctx, "ricoPost", x, 90, camY + 45, H, 20, (g) => Skin.post(g, 0, 45, 4));

      ctx.save();
      ctx.translate(0, -camY);

      // Lights left where the ball landed cleanly, fading as it climbs on
      for (const m of marks) {
        const a = Math.max(0, m.a);
        if (a <= 0) continue;
        const c = m.perfect ? "#ffc400" : col;
        const mx = m.side ? wallR - 12 : wallL + 12;
        Skin.glow(ctx, mx, m.y, m.perfect ? 22 : 16, c, a);
        ctx.globalAlpha = a;
        ctx.fillStyle = c;
        ctx.beginPath();
        ctx.arc(mx, m.y, m.perfect ? 5 : 3.5, 0, TAU);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      // Kickers flash where they fired a sliding ball back across
      for (const k of kickers) {
        if (k.a <= 0) continue;
        const kx = k.side ? wallR - 5 : wallL + 5;
        Skin.glow(ctx, kx, k.y, 34, "#e8231f", k.a);
        ctx.globalAlpha = k.a;
        ctx.fillStyle = "#ff5a48";
        ctx.beginPath();
        ctx.roundRect(k.side ? wallR - 9 : wallL + 1, k.y - 14, 8, 28, 4);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      for (const s of stars) Skin.star(ctx, s.x, s.y, 9 + kick * 2);
      const kp = Math.floor(camY / POP_STEP);
      for (let k = kp; k <= kp + Math.ceil(H / POP_STEP) + 1; k++) {
        const pop = Math.max(0, popped.get(k) || 0);
        Skin.bumper(ctx, popX(k, api), k * POP_STEP, 20, pop > 0.2 ? "#fff8e6" : col, pop);
      }

      // The landing ring: closes on the spot where the ball will meet the wall
      const T = arrival();
      if (T !== null && path && !path.whiffed && api.style === "flow") {
        const left = T - now;
        if (left < 1.5 && left > -0.3) {
          const [lx, ly] = ballAt(T);
          const k = Math.max(0, left) / 1.5;
          ctx.strokeStyle = left < 0.12 ? "#ffc400" : col;
          ctx.globalAlpha = 0.35 + 0.6 * (1 - k);
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.arc(lx, ly, 14 + 44 * k, 0, TAU);
          ctx.stroke();
          ctx.globalAlpha = 1;
        }
      }

      // The ball: a faint motion streak, the ball (finish from your lifetime rank), the charge arc
      Skin.streak(ctx, trail, BALL);
      const [x, y] = ballAt(now);
      Skin.ball(ctx, x, y, BALL, api.ballStops());
      if (spinV > 2) {
        // The spin shows as a mark turning on the ball; its light stays put
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(spin);
        ctx.strokeStyle = "rgba(20,15,12,0.3)";
        ctx.lineWidth = 2;
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.arc(0, 0, BALL * 0.6, 0.3, 1.6);
        ctx.stroke();
        ctx.restore();
      }
      if (api.charge > 0) {
        ctx.strokeStyle = api.charge > 0.85 ? "#ffc400" : col;
        ctx.globalAlpha = 0.75;
        ctx.lineWidth = 2.5;
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.arc(x, y, 19 + 7 * api.charge, -Math.PI / 2, -Math.PI / 2 + TAU * api.charge);
        ctx.stroke();
        ctx.lineCap = "butt";
        ctx.globalAlpha = 1;
      }
      ctx.restore();
    }
  });

  // Read-only snapshot for automated play tests
  window.ricochetState = () => ({
    beatPos: +api.eng.beatPos().toFixed(3),
    arrival: arrival(),
    kind: grip ? "grip" : path ? path.kind : null,
    whiffed: path ? path.whiffed : false,
    height: Math.round(-lastBall[1]),
    streak: api.eng.streak,
    bpm: +api.eng.bpm.toFixed(1),
    auto: api.eng.auto
  });
})();
</script>
</body>
</html>
