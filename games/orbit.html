<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<link rel="icon" href="data:,">
<title>Orbit</title>
</head>
<body>
<script src="flow-engine.js"></script>
<script src="pinball-skin.js"></script>
<script src="flow-shell.js"></script>
<script>
// Orbit: a steel ball circles a pop bumper; fling it off and the next bumper up the table
// catches it. The table climbs forever.
//
// Flow: each bumper has a lit arrow on its orbit pointing at the next one, and the ball crosses
// it on a beat. Fling as it crosses and the ball flies straight down the lane into the next
// orbit, landing half a beat later. The clean window is about ±0.24 beat and "perfect" is ±0.08
// (about ±45 ms); a fling inside the window is steered the last few pixels into the lane, so a
// slightly-off fling still lands. A fling well off the arrow swings the ball out and the bumper
// reels it back. Nothing is lost: the arrow comes round again.
//
// Fidget: the table bends to you. Press to grab the ball, let go to fling it; the next bumper
// appears wherever the ball is heading. Hold longer and the orbit winds up and the fling goes
// further. Mash and the ball climbs bumper to bumper as fast as you can press.
(() => {
  "use strict";

  const PERFECT = 0.08; // beats
  const FLY = 0.5; // beats a Flow flight lasts, release on the beat to landing
  const TAU = Math.PI * 2;

  let bumpers = []; // { x, y, dir, phi, lane: {px, py, qx, qy}, pop, star }
  let cur = null; // the bumper the ball is orbiting
  let theta = 0; // ball's angle on the orbit
  let omega = Math.PI; // radians per beat
  let relBeat = 0; // the beat the ball crosses the arrow
  let lastBeat = 0;
  let missedThis = false;
  let flight = null; // { ax, ay, bx, by, c1x, c1y, c2x, c2y, t0, t1, ghost, perfect, fidget, power }
  let swing = null; // a fling off the arrow: { t0, dx, dy }
  let pendingFling = null; // Fidget: a release that came mid-flight, flung on arrival
  let grab = 0; // Fidget: squeeze while pressed
  let sling = null; // Fidget: a charged release, flung when the ball swings round to face up the table
  let camY = 0;
  let kick = 0;
  let trail = [];
  let shards = [];

  const R = (api) => Math.max(30, Math.min(40, api.W * 0.085)); // orbit radius
  const BR = (api) => R(api) * 0.56; // bumper radius
  const margin = (api) => R(api) + BR(api) + 14;
  const dirVec = (a) => [Math.cos(a), Math.sin(a)];

  // Add the next bumper up the table from X. The lane leaves X's orbit along angle phi (pointing
  // up the table) and meets the new bumper's orbit on its tangent, so a flight is a straight line.
  function addAfter(X, api, phiWanted, dist) {
    const r = R(api);
    let best = null;
    for (let i = 0; i < 24 && !best; i++) {
      let phi = phiWanted !== undefined ? phiWanted : -Math.PI / 2 + (Math.random() * 2 - 1) * 1.05;
      if (phiWanted !== undefined && i === 1) phi = -Math.PI - phiWanted; // off the rail: bank it back
      const D = dist || api.pick({ chill: 150, normal: 165, intense: 185 }) + Math.random() * 50;
      const thR = phi - X.dir * (Math.PI / 2);
      const [cx, cy] = dirVec(thR);
      const px = X.x + cx * r, py = X.y + cy * r;
      const [dx, dy] = dirVec(phi);
      let qx = px + dx * D, qy = py + dy * D;
      const dir = Math.random() < 0.5 ? 1 : -1;
      const thIn = phi - dir * (Math.PI / 2);
      const [ex, ey] = dirVec(thIn);
      let x = qx - ex * r, y = qy - ey * r;
      const m = margin(api);
      if (phiWanted !== undefined && i > 1) {
        // Fidget, still off the table after banking: shift the bumper (and landing point) in
        const sx = Math.max(m, Math.min(api.W - m, x)) - x;
        x += sx;
        qx += sx;
      } else if (x < m || x > api.W - m || y > X.y - 90) continue;
      best = { X, phi, px, py, qx, qy, x, y, dir };
    }
    if (!best) return addAfter(X, api, -Math.PI / 2, 170);
    best.X.phi = best.phi;
    best.X.lane = { px: best.px, py: best.py, qx: best.qx, qy: best.qy };
    const Y = { x: best.x, y: best.y, dir: best.dir, phi: null, lane: null, pop: 0, star: api.mode === "Star Lane" && api.started };
    bumpers.push(Y);
    return Y;
  }
  const nextOf = (X) => bumpers[bumpers.indexOf(X) + 1];
  function fillAhead(api) {
    while (bumpers[bumpers.length - 1].y > camY - 160) addAfter(bumpers[bumpers.length - 1], api);
  }

  // Choose when the ball next crosses the arrow: an exact beat, on the ball's FIRST pass whenever
  // the orbit speed allows (so you can fling on the first loop and keep a rhythm going), with the
  // speed near half a turn a beat and the timing near the pacer's spacing
  // gap: the soonest the crossing may come (flings stay at least two beats apart). keep: hold
  // the ball's current speed (after a missed crossing, so it never changes speed mid-loop)
  function retime(now, api, target, gap = 0.5, keep = false) {
    const thR = cur.phi - cur.dir * (Math.PI / 2);
    const d0 = ((((thR - theta) * cur.dir) % TAU) + TAU) % TAU;
    let best = null;
    for (let T = Math.ceil(now + gap); T <= Math.ceil(now + gap) + 7; T++) {
      for (let m = 0; m < 4; m++) {
        const w = (d0 + TAU * m) / (T - now);
        if (w < Math.PI * 0.4 || w > Math.PI * 1.8) continue;
        const cost = keep ? Math.abs(Math.log(w / omega)) * 40 + Math.abs(T - target) * 0.1 : Math.abs(Math.log(w / Math.PI)) * 3 + Math.abs(T - target) * 0.6 + m * 5;
        if (!best || cost < best.cost) best = { T, w, cost };
      }
    }
    relBeat = best ? best.T : Math.ceil(now) + 2;
    omega = best ? best.w : Math.PI;
    missedThis = false;
  }

  function orbitPos(api, th) {
    const [cx, cy] = dirVec(th === undefined ? theta : th);
    return [cur.x + cx * R(api), cur.y + cy * R(api)];
  }
  function tangent(th) {
    return dirVec((th === undefined ? theta : th) + cur.dir * (Math.PI / 2));
  }
  function ballPos(api, now) {
    if (flight) {
      const u0 = Math.min(1, Math.max(0, (now - flight.t0) / (flight.t1 - flight.t0)));
      const u = 1 - (1 - u0) * (1 - u0); // flung fast, caught softly
      const v = 1 - u;
      return [
        v * v * v * flight.ax + 3 * v * v * u * flight.c1x + 3 * v * u * u * flight.c2x + u * u * u * flight.bx,
        v * v * v * flight.ay + 3 * v * v * u * flight.c1y + 3 * v * u * u * flight.c2y + u * u * u * flight.by
      ];
    }
    let [x, y] = orbitPos(api);
    if (swing) {
      const u = Math.min(1, (now - swing.t0) / 1);
      const s = Math.sin(Math.PI * u) * 70;
      x += swing.dx * s;
      y += swing.dy * s;
    }
    return [x, y];
  }

  function launch(api, now, opts) {
    const Y = nextOf(cur);
    const L = cur.lane;
    const [ax, ay] = orbitPos(api);
    const [tx, ty] = tangent();
    const [ix, iy] = dirVec(cur.phi); // arrive along the lane
    const len = Math.hypot(L.qx - ax, L.qy - ay);
    flight = {
      ax, ay, bx: L.qx, by: L.qy,
      // Leave along the ball's own tangent, arrive along the lane: a slightly-off fling bends in
      c1x: ax + tx * len * 0.35, c1y: ay + ty * len * 0.35,
      c2x: L.qx - ix * len * 0.35, c2y: L.qy - iy * len * 0.35,
      t0: now, t1: opts.t1, ghost: opts.ghost, perfect: opts.perfect, fidget: opts.fidget, power: opts.power || 0
    };
    swing = null;
    if (!opts.ghost) api.eng.tap({ height: 0.85 - 0.7 * (Y.x / api.W) });
  }

  function land(api, now) {
    const f = flight;
    flight = null;
    const Y = nextOf(cur);
    cur = Y;
    theta = Math.atan2(f.by - Y.y, f.bx - Y.x);
    if (!Y.lane) addAfter(Y, api);
    Y.pop = 1;
    kick = 1;
    const col = api.color();
    api.burst(Y.x, Y.y - camY, f.fidget && f.power > 0.5 ? "#ffc400" : col, 5 + Math.round(f.power * 10), -1);
    if (f.fidget) {
      api.ring(Y.x, Y.y - camY, f.power > 0.5 ? "#ffc400" : col, 40 + 60 * f.power);
      api.eng.pluck(0.75 - 0.55 * (Y.x / api.W), 0.3 + 0.6 * f.power, 0.07);
      if (Y.star) {
        // Star Lane still pops in while fidgeting: the star bursts, nothing is counted
        api.ring(Y.x, Y.y - camY, "#ffc400", 70);
        api.burst(Y.x, Y.y - camY, "#ffc400", 12, -1);
        api.eng.chime();
      }
    } else if (!f.ghost && !api.eng.auto) {
      api.score(1, f.perfect ? "PERFECT" : "CLEAN", api.eng.beatSec * FLY);
      if (f.perfect) api.ring(Y.x, Y.y - camY, col, 46);
      if (Y.star) {
        api.bonus(500);
        api.ring(Y.x, Y.y - camY, "#ffc400", 60);
      }
    }
    Y.star = false;
    // Forget the table well below, keep the chain ahead
    bumpers = bumpers.slice(Math.max(0, bumpers.indexOf(cur) - 2));
    retime(now, api, now + Math.max(1, api.eng.paceBeats() - FLY), 2 - FLY);
    if (pendingFling !== null) {
      const p = pendingFling;
      pendingFling = null;
      fidgetFling(api, now, p);
    }
  }

  // Fidget: fling now, toward wherever the ball is heading (kept pointing up the table)
  // Fidget: fling now. power 0 is a tap; a charged release (0..1) is a sling
  function fidgetFling(api, now, power) {
    if (flight) return (pendingFling = power);
    // A charged shot is a sling: the ball keeps whipping round the bumper and lets go only when
    // it faces up the table, so it always leaves off the loop like a stone from a sling
    const [ux, uy] = tangent();
    if (power > 0.25 && Math.abs(Math.atan2(uy, ux) + Math.PI / 2) > 0.4) {
      sling = power;
      grab = Math.max(grab, 0.6 + 0.4 * power); // keep whipping round at full wind-up until it lets go
      return;
    }
    sling = null;
    grab = 0;
    let [tx, ty] = tangent();
    if (ty > 0) ty = -ty; // heading down the table: bank it back up
    let a = Math.atan2(ty, tx);
    a = Math.max(-Math.PI + 0.75, Math.min(-0.75, a)); // at least 43° up the table
    bumpers = bumpers.slice(0, bumpers.indexOf(cur) + 1);
    addAfter(cur, api, a, Math.max(140, (150 + 200 * power) * (1 - 0.2 * api.rev)));
    // The lane starts where the ball is now
    const [ax, ay] = orbitPos(api);
    cur.lane = { px: ax, py: ay, qx: cur.lane.qx, qy: cur.lane.qy };
    const secs = (0.3 + 0.35 * power) * (1 - 0.55 * api.rev);
    launch(api, now, { t1: now + secs / api.eng.beatSec, fidget: true, power });
  }

  function reset(api) {
    bumpers = [{ x: api.W / 2, y: 0, dir: 1, phi: null, lane: null, pop: 0, star: false }];
    cur = bumpers[0];
    camY = -api.H * 0.68;
    theta = -Math.PI / 2;
    addAfter(cur, api);
    fillAhead(api);
    const now = api.eng.beatPos();
    lastBeat = now;
    retime(now, api, now + 3);
  }

  const api = FlowShell.mount({
    key: "orbit",
    title: "Orbit",
    hint: "Tap to fling as the ball crosses the arrow",
    vignette: false, // baked into the table layer
    input: "tap",
    tierNames: ["Finding your rhythm", "In orbit", "Slingshot", "Pinball wizard"],
    modes: ["Star Lane"],
    fidgetPoint: (api) => {
      const [x, y] = ballPos(api, api.eng.beatPos());
      return { x, y: y - camY };
    },
    // Flings come every 2-4 beats
    engine: { perBeat: [0.25, 1 / 3, 0.5, 1], stableTol: 3, pacing: { minBeats: 2, startBeats: 3 } },

    setup(api) {
      reset(api);
    },
    resize(api) {
      if (!bumpers.length) return;
      const m = margin(api);
      for (const b of bumpers) if (b !== cur) b.x = Math.max(m, Math.min(api.W - m, b.x));
    },

    onBeat() {
      kick = 1;
    },

    onAction(api) {
      const now = api.eng.beatPos();
      if (api.style === "fidget") {
        // Every press flings at once; keep holding and the next fling winds up into a sling
        api.eng.tap({ note: false });
        return fidgetFling(api, now, 0);
      }
      if (flight || swing) return api.eng.tap({ note: false });
      const err = now - relBeat;
      const win = api.pick({ chill: 0.3, normal: 0.24, intense: 0.17 }) + 0.06 * api.eng.assist;
      if (Math.abs(err) <= win) {
        missedThis = true; // this crossing is taken
        return launch(api, now, { t1: relBeat + FLY, perfect: Math.abs(err) < PERFECT });
      }
      // Off the arrow: well away from it is just a tap along with the music; near it, the ball
      // swings out and the bumper reels it back in
      if (Math.abs(err) > 0.55) return api.eng.tap({ note: false });
      api.eng.tap({ note: false });
      const [tx, ty] = tangent();
      swing = { t0: now, dx: tx, dy: ty };
      missedThis = true;
      api.miss();
      api.hint("timing", "Fling as the ball crosses the lit arrow");
    },

    onRelease(api, held) {
      const power = api.chargeOf(held);
      if (api.style !== "fidget" || power <= 0) return; // a plain press already flung on the way down
      // The wind-up stays on while a sling waits to let go; it ends when the ball actually flies
      fidgetFling(api, api.eng.beatPos(), power);
    },

    // Autopilot flings exactly as the ball crosses the arrow; nothing scores
    autopilot(dt, api) {
      const now = api.eng.beatPos();
      if (!flight && !swing && now >= relBeat && !missedThis) {
        missedThis = true;
        launch(api, relBeat, { t1: relBeat + FLY, ghost: true });
      }
    },

    update(dt, api) {
      const now = api.eng.beatPos();
      const db = Math.max(0, Math.min(0.5, now - lastBeat));
      lastBeat = now;
      kick = Math.max(0, kick - dt * 4.2);
      if (api.style === "fidget" && api.charge > 0) grab = api.charge;
    else if (sling === null) grab = Math.max(0, grab - dt * 6);
    if (sling !== null && (flight || api.style !== "fidget")) sling = null;
      for (const b of bumpers) b.pop = Math.max(0, b.pop - dt * 3);

      if (flight) {
        if (now >= flight.t1) land(api, now);
      } else {
        // Holding in Fidget winds the orbit up
        theta += cur.dir * omega * db * (1 + 2.5 * grab);
        if (sling !== null) fidgetFling(api, now, sling); // lets go once it faces up the table
        if (swing && now - swing.t0 >= 1) swing = null;
        // A crossing passed with no fling: Flow counts it, then the arrow comes round again
        const win = api.pick({ chill: 0.3, normal: 0.24, intense: 0.17 }) + 0.06 * api.eng.assist;
        if (!swing && now > relBeat + win) {
          if (!missedThis && api.started && !api.eng.auto && api.style === "flow") {
            api.miss();
            api.hint("timing", "Fling as the ball crosses the lit arrow");
          }
          retime(now, api, now + 2, 0.5, true);
        }
      }

      // The camera keeps the ball low on the screen, climbing smoothly
      const [, by] = ballPos(api, now);
      const target = Math.min(by, cur.y) - api.H * 0.66;
      camY += (target - camY) * Math.min(1, dt * 3.2);
      fillAhead(api);

      const [x, y] = ballPos(api, now);
      trail.unshift([x, y]);
      if (trail.length > 10) trail.pop();
      for (const s of shards) s.a -= dt;
      shards = shards.filter((s) => s.a > 0);
    },

    draw(ctx, api) {
      const { W, H, tier } = api;
      const Skin = PinballSkin;
      const now = api.eng.beatPos();
      const col = api.color();
      const r = R(api);
      const br = BR(api);

      // The table: painted playfield and the wire rails at the edges, baked once per size and tier
      Skin.layer(ctx, "orbit" + tier, W, H, (g) => {
        Skin.playfield(g, W, H, tier);
        for (const x of [6, W - 6]) {
          g.strokeStyle = "rgba(0,0,0,0.3)";
          g.lineWidth = 6;
          g.beginPath();
          g.moveTo(x + 1, 0);
          g.lineTo(x + 1, H);
          g.stroke();
          g.strokeStyle = "#8f877c";
          g.lineWidth = 3;
          g.beginPath();
          g.moveTo(x, 0);
          g.lineTo(x, H);
          g.stroke();
          g.strokeStyle = "rgba(255,248,230,0.7)";
          g.lineWidth = 1;
          g.beginPath();
          g.moveTo(x - 0.5, 0);
          g.lineTo(x - 0.5, H);
          g.stroke();
        }
      });

      // The playfield scrolling past: arrow inserts up the middle (every fourth one lit, pulsing
      // with the beat) and the posts that hold the rails
      const step = 120;
      Skin.column(ctx, "orbitIns" + col, W / 2, step * 4, camY + step / 2, H, 40, (g) => {
        for (let j = 1; j < 4; j++) Skin.insert(g, 0, j * step + step / 2, 11, col, 0);
      });
      for (let k = Math.floor(camY / step / 4) * 4; k * step - camY < H + step; k += 4) Skin.insert(ctx, W / 2, k * step - camY, 11, col, 0.25 + kick * 0.6);
      for (const x of [6, W - 6]) Skin.column(ctx, "orbitPost", x, step * 2, camY, H, 16, (g) => Skin.post(g, 0, step / 2, 3));

      ctx.save();
      ctx.translate(0, -camY);

      // Lanes: a row of lamp dots from each bumper to the next; the one in play lights as the beat nears
      ctx.lineCap = "round";
      for (const b of bumpers) {
        if (!b.lane) continue;
        const live = b === cur && !flight && api.style === "flow";
        const near = live ? Math.max(0, 1 - Math.abs(now - relBeat) / 1.2) : 0;
        ctx.strokeStyle = live ? col : "#f6e6c0";
        ctx.globalAlpha = live ? 0.3 + 0.6 * near : 0.1;
        ctx.lineWidth = live ? 3.5 : 2.5;
        ctx.setLineDash([0, 10]);
        ctx.beginPath();
        ctx.moveTo(b.lane.px, b.lane.py);
        ctx.lineTo(b.lane.qx, b.lane.qy);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.globalAlpha = 1;
        // The arrow insert on the orbit: fling as the ball crosses it
        if (live) Skin.insert(ctx, b.lane.px, b.lane.py, 9 + 4 * near, near > 0.85 ? "#ffc400" : col, 0.35 + 0.65 * near, b.phi + Math.PI / 2);
      }
      ctx.lineCap = "butt";

      // Pop bumpers; the cap lights when the ball lands, and the next one glows in time
      for (const b of bumpers) {
        const sy = b.y - camY;
        if (sy < -80 || sy > H + 80) continue;
        if (b === cur) {
          // The ball's track round the bumper, a faint guide
          ctx.strokeStyle = "#f6e6c0";
          ctx.globalAlpha = 0.09;
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.arc(b.x, b.y, r, 0, TAU);
          ctx.stroke();
          ctx.globalAlpha = 1;
        }
        const lit = b.pop > 0.3 ? "#fff8e6" : b.pop > 0 || b === nextOf(cur) ? col : "#4a3326";
        Skin.bumper(ctx, b.x, b.y, br, lit, b.pop);
        if (b.star) Skin.star(ctx, b.x, b.y - br - 16, 9 + kick * 2);
      }

      // The ball: a faint motion streak, the wind-up arc, then the ball (finish from your lifetime rank)
      Skin.streak(ctx, trail, 11);
      const [x, y] = ballPos(api, now);
      if (grab > 0) {
        ctx.strokeStyle = grab > 0.95 ? "#ffc400" : col;
        ctx.globalAlpha = 0.6;
        ctx.lineWidth = 2.5;
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.arc(x, y, 14 + 10 * grab, -Math.PI / 2, -Math.PI / 2 + TAU * grab);
        ctx.stroke();
        ctx.lineCap = "butt";
        ctx.globalAlpha = 1;
      }
      Skin.ball(ctx, x, y, 11, api.ballStops(), 1 + grab * 0.1, 1 - grab * 0.15);
      ctx.restore();
    }
  });

  // Closest two bumpers on the table, for automated tests
  window.orbitMinGap = () => {
    let m = Infinity;
    for (let i = 0; i < bumpers.length; i++) for (let j = i + 1; j < bumpers.length; j++) m = Math.min(m, Math.hypot(bumpers[i].x - bumpers[j].x, bumpers[i].y - bumpers[j].y));
    return m;
  };
  // Read-only snapshot for automated play tests
  window.orbitState = () => ({
    beatPos: +api.eng.beatPos().toFixed(3),
    relBeat,
    omega: +(omega / Math.PI).toFixed(2),
    flying: !!flight,
    bumpers: bumpers.length,
    climbed: Math.round(-cur.y),
    streak: api.eng.streak,
    bpm: +api.eng.bpm.toFixed(1),
    auto: api.eng.auto
  });
})();
</script>
</body>
</html>
