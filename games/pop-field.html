<!doctype html>
<html lang="en">
<head>
<script src="flow-layer.js" data-mode="toy"></script>
<script src="key-cursor.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Pop Field</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #08121c; touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
  "use strict";
  // Pop Field: an endless drift of soft bubbles. Tap one, or swipe through a few, and it
  // pops into a note from the current chord: big bubbles hum low, small ones chime high.
  // Popping nudges the neighbours. There is no score and no end; the field just keeps coming.
  const cv = document.getElementById("c");
  const g = cv.getContext("2d");
  let W = 0, H = 0;
  function resize() {
    const d = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W * d; cv.height = H * d;
    g.setTransform(d, 0, 0, d, 0, 0);
  }
  window.addEventListener("resize", resize);
  resize();

  let bubbles = [];
  let bits = [];
  let rings = [];
  let spawnT = 0;
  let pointerDown = false;
  let t = 0;

  function cap() { return Math.max(14, Math.min(34, Math.round((W * H) / 16000))); }

  function addBubble(y) {
    const r = 12 + Math.pow(Math.random(), 1.6) * 34;
    bubbles.push({
      x: r + Math.random() * (W - r * 2),
      y: y !== undefined ? y : H + r,
      r,
      vx: 0, vy: -(10 + Math.random() * 14) * (30 / (r + 10)),
      wob: Math.random() * Math.PI * 2,
      hue: 170 + Math.random() * 160,
      grow: 0
    });
  }
  for (let i = 0; i < cap() * 0.7; i++) addBubble(Math.random() * H);

  function pop(b) {
    bubbles.splice(bubbles.indexOf(b), 1);
    // Bigger bubble, lower note
    const deg = Math.round(13 - ((b.r - 12) / 34) * 13);
    if (window.Flow) { Flow.note(deg, { vol: 0.07, dur: 0.6 + b.r / 40, type: "sine" }); Flow.hit(b.x, b.y, true); }
    rings.push({ x: b.x, y: b.y, r: b.r, a: 0.8, hue: b.hue });
    for (let i = 0; i < 10 + b.r / 3; i++) {
      const a = Math.random() * Math.PI * 2, s = 30 + Math.random() * 90;
      bits.push({ x: b.x, y: b.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1, hue: b.hue });
    }
    // Soft shove to the neighbours, so pops ripple through a cluster
    for (const o of bubbles) {
      const dx = o.x - b.x, dy = o.y - b.y, d = Math.hypot(dx, dy);
      if (d < b.r * 4 && d > 0.1) { const k = (1 - d / (b.r * 4)) * 60; o.vx += (dx / d) * k; o.vy += (dy / d) * k * 0.5; }
    }
  }

  function popAt(x, y) {
    for (let i = bubbles.length - 1; i >= 0; i--) {
      const b = bubbles[i];
      if (Math.hypot(b.x - x, b.y - y) < b.r + 6) { pop(b); return true; }
    }
    return false;
  }

  window.addEventListener("pointerdown", (e) => { e.preventDefault(); pointerDown = true; popAt(e.clientX, e.clientY); }, { passive: false });
  window.addEventListener("pointermove", (e) => { if (pointerDown) popAt(e.clientX, e.clientY); });
  window.addEventListener("pointerup", () => { pointerDown = false; });
  window.addEventListener("pointercancel", () => { pointerDown = false; });
  // Space pops the lowest bubble, for a keyboard fidget
  window.addEventListener("keydown", (e) => {
    if (e.code !== "Space" || e.repeat) return;
    e.preventDefault();
    if (bubbles.length) pop(bubbles.reduce((a, b) => (a.y > b.y ? a : b)));
  });

  function update(dt) {
    t += dt;
    spawnT -= dt;
    if (spawnT <= 0 && bubbles.length < cap()) { addBubble(); spawnT = 0.5 + Math.random() * 0.9; }

    for (let i = bubbles.length - 1; i >= 0; i--) {
      const b = bubbles[i];
      b.wob += dt * (0.8 + 12 / b.r);
      b.vx *= Math.exp(-dt * 1.5);
      b.vy += (-(10 + 340 / (b.r + 10)) - b.vy) * dt * 0.6;
      b.x += (b.vx + Math.sin(b.wob) * 8) * dt;
      b.y += b.vy * dt;
      b.x = Math.max(b.r, Math.min(W - b.r, b.x));
      b.grow = Math.min(1, b.grow + dt * 1.5);
      if (b.y < -b.r * 2) bubbles.splice(i, 1);
    }
    for (let i = bits.length - 1; i >= 0; i--) {
      const p = bits[i];
      p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 40 * dt; p.life -= dt * 1.4;
      if (p.life <= 0) bits.splice(i, 1);
    }
    for (let i = rings.length - 1; i >= 0; i--) {
      const r = rings[i];
      r.r += 120 * dt; r.a -= dt * 1.8;
      if (r.a <= 0) rings.splice(i, 1);
    }
  }

  function draw() {
    const bg = g.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, "#0b1424"); bg.addColorStop(1, "#13263a");
    g.fillStyle = bg; g.fillRect(0, 0, W, H);

    for (const b of bubbles) {
      const r = b.r * (0.4 + 0.6 * b.grow);
      const sx = 1 + Math.sin(b.wob * 2) * 0.04, sy = 1 - Math.sin(b.wob * 2) * 0.04;
      g.save(); g.translate(b.x, b.y); g.scale(sx, sy);
      const body = g.createRadialGradient(-r * 0.3, -r * 0.35, r * 0.1, 0, 0, r);
      body.addColorStop(0, `hsla(${b.hue}, 90%, 85%, 0.35)`);
      body.addColorStop(0.7, `hsla(${b.hue + 30}, 80%, 60%, 0.12)`);
      body.addColorStop(1, `hsla(${b.hue + 60}, 90%, 70%, 0.45)`);
      g.fillStyle = body;
      g.beginPath(); g.arc(0, 0, r, 0, Math.PI * 2); g.fill();
      g.fillStyle = "rgba(255,255,255,0.7)";
      g.beginPath(); g.ellipse(-r * 0.38, -r * 0.42, r * 0.18, r * 0.1, -0.6, 0, Math.PI * 2); g.fill();
      g.restore();
    }
    for (const r of rings) {
      g.strokeStyle = `hsla(${r.hue}, 90%, 80%, ${r.a})`; g.lineWidth = 2;
      g.beginPath(); g.arc(r.x, r.y, r.r, 0, Math.PI * 2); g.stroke();
    }
    for (const p of bits) {
      g.fillStyle = `hsla(${p.hue}, 90%, 80%, ${p.life})`;
      g.beginPath(); g.arc(p.x, p.y, 2, 0, Math.PI * 2); g.fill();
    }
  }

  let last = performance.now();
  function frame(now) {
    if (window.Flow && Flow.away && now - last < 100) { requestAnimationFrame(frame); return; }
    const dt = Math.min(0.12, (now - last) / 1000);
    last = now;
    update(dt); draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
