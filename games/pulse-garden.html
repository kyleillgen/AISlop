<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Pulse Garden</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #06140f; touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
  "use strict";
  // Pulse Garden: seeds sprout on the beat. A ring closes in on each one; tap the
  // seed as the ring touches it to make it bloom. Miss and a petal falls from your stem.
  const cv = document.getElementById("c");
  const g = cv.getContext("2d");
  let W = 0, H = 0;
  function resize() {
    const d = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W * d; cv.height = H * d;
    g.setTransform(d, 0, 0, d, 0, 0);
  }
  window.addEventListener("resize", resize);
  resize();

  const BEST_KEY = "aislop.pulse-garden.best";
  let best = 0;
  try { best = parseInt(localStorage.getItem(BEST_KEY) || "0", 10) || 0; } catch (e) {}
  function saveBest(s) {
    if (s <= best) return;
    best = s;
    try { localStorage.setItem(BEST_KEY, String(best)); } catch (e) {}
  }

  const BPM = 100, BEAT = 60 / BPM, SEED_R = 26, LEAD = 2; // seeds ripen two beats after they sprout
  const PENTA = [261.63, 293.66, 329.63, 392.0, 440.0, 523.25, 587.33, 659.25];
  let actx = null;
  function audio() {
    if (actx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) actx = new AC();
  }
  function tone(freq, dur, vol, type) {
    if (!actx) return;
    const t0 = actx.currentTime;
    const o = actx.createOscillator(), v = actx.createGain();
    o.type = type || "sine"; o.frequency.value = freq;
    v.gain.setValueAtTime(vol, t0);
    v.gain.exponentialRampToValueAtTime(0.0005, t0 + dur);
    o.connect(v); v.connect(actx.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  }

  let state = "ready", overAt = 0;
  let clock, nextBeat, beatCount, seeds, blooms, score, combo, petals, flash;

  function reset() {
    clock = 0; nextBeat = 0.5; beatCount = 0;
    seeds = []; blooms = []; score = 0; combo = 0; petals = 5; flash = null;
  }
  reset();

  function spawnSeed() {
    for (let tries = 0; tries < 20; tries++) {
      const x = 50 + Math.random() * (W - 100);
      const y = 120 + Math.random() * (H - 190);
      if (seeds.every((s) => Math.hypot(s.x - x, s.y - y) > SEED_R * 4)) {
        seeds.push({ x, y, hit: clock + LEAD * BEAT, note: PENTA[Math.floor(((H - y) / H) * PENTA.length)] || PENTA[0] });
        return;
      }
    }
  }

  function judge(seed) {
    const err = Math.abs(clock - seed.hit);
    seeds.splice(seeds.indexOf(seed), 1);
    if (err < 0.07) { combo++; score += 3 * Math.min(4, 1 + Math.floor(combo / 8)); flash = { text: "BLOOM", t: 0.5 }; }
    else if (err < 0.15) { combo++; score += 1; flash = { text: "good", t: 0.4 }; }
    else { miss(); return; }
    tone(seed.note, 0.5, 0.18, "triangle");
    blooms.push({ x: seed.x, y: seed.y, t: 0, hue: 300 + Math.random() * 80 });
  }

  function miss() {
    combo = 0; petals--;
    flash = { text: "miss", t: 0.4 };
    tone(110, 0.25, 0.12, "sine");
    if (petals <= 0) { state = "over"; overAt = performance.now(); saveBest(score); }
  }

  // Taps judge the nearest seed under your finger; Space judges the ripest seed
  function tapAt(x, y) {
    let pick = null, pd = Infinity;
    for (const s of seeds) {
      const d = Math.hypot(s.x - x, s.y - y);
      if (d < SEED_R + 22 && d < pd) { pick = s; pd = d; }
    }
    if (pick && Math.abs(clock - pick.hit) < 0.4) judge(pick);
  }
  function tapRipest() {
    if (!seeds.length) return;
    const ripest = seeds.reduce((a, b) => (a.hit < b.hit ? a : b));
    if (Math.abs(clock - ripest.hit) < 0.4) judge(ripest);
  }

  function start() {
    audio();
    if (state === "ready") { state = "play"; return true; }
    if (state === "over" && performance.now() - overAt > 600) { reset(); state = "ready"; }
    return state !== "play";
  }
  window.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    if (state !== "play") { start(); return; }
    tapAt(e.clientX, e.clientY);
  }, { passive: false });
  window.addEventListener("keydown", (e) => {
    if ((e.code === "Space" || e.code === "Enter") && !e.repeat) {
      e.preventDefault();
      if (state !== "play") { start(); return; }
      tapRipest();
    }
  });

  function update(dt) {
    for (let i = blooms.length - 1; i >= 0; i--) {
      blooms[i].t += dt;
      if (blooms[i].t > 1.2) blooms.splice(i, 1);
    }
    if (flash) { flash.t -= dt; if (flash.t <= 0) flash = null; }
    if (state !== "play") return;

    clock += dt;
    while (clock >= nextBeat) {
      beatCount++;
      tone(beatCount % 4 === 1 ? 880 : 660, 0.05, 0.04, "square");
      spawnSeed();
      // Busier garden as you grow: an off-beat seed every other bar, then every bar
      const extra = score > 60 ? beatCount % 2 === 0 : score > 25 ? beatCount % 4 === 2 : false;
      if (extra) spawnSeed();
      nextBeat += BEAT;
    }
    for (let i = seeds.length - 1; i >= 0; i--) {
      if (clock > seeds[i].hit + 0.18) { seeds.splice(i, 1); miss(); if (state !== "play") return; }
    }
  }

  function text(s, x, y, size, color) {
    g.font = `700 ${size}px system-ui, -apple-system, Segoe UI, sans-serif`;
    g.fillStyle = color; g.textAlign = "center";
    g.fillText(s, x, y);
  }

  function draw() {
    const bg = g.createRadialGradient(W / 2, H * 0.6, 40, W / 2, H * 0.6, Math.max(W, H));
    bg.addColorStop(0, "#123a28"); bg.addColorStop(1, "#06140f");
    g.fillStyle = bg; g.fillRect(0, 0, W, H);

    // Beat pulse on the soil
    const phase = state === "play" ? 1 - ((nextBeat - clock) / BEAT) : 0;
    g.fillStyle = `rgba(120, 255, 170, ${0.06 * (1 - phase)})`;
    g.fillRect(0, 0, W, H);

    for (const b of blooms) {
      const k = b.t / 1.2;
      for (let i = 0; i < 6; i++) {
        const a = (i / 6) * Math.PI * 2 + b.t;
        g.fillStyle = `hsla(${b.hue}, 80%, 70%, ${1 - k})`;
        g.beginPath();
        g.ellipse(b.x + Math.cos(a) * 18 * (0.5 + k), b.y + Math.sin(a) * 18 * (0.5 + k), 12, 6, a, 0, Math.PI * 2);
        g.fill();
      }
      g.fillStyle = `rgba(255, 230, 120, ${1 - k})`;
      g.beginPath(); g.arc(b.x, b.y, 7, 0, Math.PI * 2); g.fill();
    }

    for (const s of seeds) {
      const remain = Math.max(0, (s.hit - clock) / (LEAD * BEAT));
      const ringR = SEED_R * (1 + remain * 2.4);
      g.strokeStyle = `rgba(190, 255, 210, ${0.25 + (1 - remain) * 0.6})`;
      g.lineWidth = 3;
      g.beginPath(); g.arc(s.x, s.y, ringR, 0, Math.PI * 2); g.stroke();
      g.fillStyle = "#3fbf7a";
      g.beginPath(); g.arc(s.x, s.y, SEED_R, 0, Math.PI * 2); g.fill();
      g.fillStyle = "#b7f5cf";
      g.beginPath(); g.ellipse(s.x, s.y - 4, 6, 11, 0.3, 0, Math.PI * 2); g.fill();
    }

    text(String(score), W / 2, 52, 34, "#ffffff");
    text("BEST " + best + (combo > 1 ? "   ·   COMBO " + combo : ""), W / 2, 74, 12, "rgba(255,255,255,0.55)");
    for (let i = 0; i < 5; i++) {
      g.fillStyle = i < petals ? "#f59ad1" : "rgba(255,255,255,0.12)";
      g.beginPath(); g.ellipse(W / 2 - 40 + i * 20, 92, 6, 4, 0.6, 0, Math.PI * 2); g.fill();
    }
    if (flash) text(flash.text, W / 2, H - 40, 18, `rgba(255,255,255,${Math.min(1, flash.t * 2.5)})`);

    if (state === "ready") {
      text("PULSE GARDEN", W / 2, H * 0.36, 32, "#b7f5cf");
      text("Tap each seed as its ring closes", W / 2, H * 0.36 + 32, 15, "rgba(255,255,255,0.75)");
      text("Space hits the ripest seed · sound on", W / 2, H * 0.36 + 54, 13, "rgba(255,255,255,0.55)");
    } else if (state === "over") {
      text("The garden rests", W / 2, H * 0.42, 26, "#ffffff");
      text(score + " points", W / 2, H * 0.42 + 30, 18, "#b7f5cf");
      text("Tap to try again", W / 2, H * 0.42 + 56, 14, "rgba(255,255,255,0.7)");
    }
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    update(dt); draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
